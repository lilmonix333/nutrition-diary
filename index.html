<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#12a05b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="营养日记">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>营养日记</title>
<style>
:root{
  --bg:#f4f6f8;--card:#fff;--ink:#1c2024;--ink2:#4b5563;--mute:#9aa3ad;--line:#f0f2f5;
  --green:#12a05b;--green2:#24c97a;--soft:#e8f8ef;--blue:#3b82f6;--amber:#f59e0b;
  --purple:#a855f7;--red:#ef4444;--r:16px;
  --safeB:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
input,button{font:inherit;color:inherit;border:none;background:none;outline:none}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* 布局 */
.wrap{padding:12px 14px calc(96px + var(--safeB));max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(28,32,36,.05)}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.mute{color:var(--mute)}
.sm{font-size:12px}
.xs{font-size:11px}
.green{color:var(--green)}
.red{color:var(--red)}
.bold{font-weight:700}
.hidden{display:none!important}

/* 顶部日期条 */
.datebar{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 12px}
.datebar .nav{width:38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink2);box-shadow:0 2px 8px rgba(28,32,36,.06)}
.datebar .nav.off{opacity:.35}
.datebar .mid{text-align:center}
.datebar .d1{font-size:17px;font-weight:700}
.datebar .d2{font-size:11px;color:var(--mute);margin-top:2px}

/* 环形 */
.herohead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.pill{font-size:12px;color:var(--green);background:var(--soft);padding:5px 11px;border-radius:99px}
.link{font-size:12px;color:var(--mute);padding:5px 2px}
.ringbox{position:relative;width:min(64vw,240px);margin:8px auto 14px;aspect-ratio:1/1}
.ringbox svg{width:100%;height:100%;display:block}
.ringmid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.ringmid .lbl{font-size:12px;color:var(--mute)}
.ringmid .num{font-size:44px;font-weight:800;line-height:1.05;letter-spacing:-1.5px;color:var(--green);margin:2px 0}
.ringmid .num.over{color:var(--red)}
.ringmid .u{font-size:12px;color:var(--mute);font-weight:400;letter-spacing:0;margin-left:3px}
.ringmid .sub{font-size:11px;color:#b6bec7}

/* 进度条 */
.bar{height:7px;border-radius:7px;background:#eef1f4;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:7px;transition:width .35s ease}
.macro{margin-bottom:11px}
.macro:last-child{margin-bottom:0}
.mhead{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.mhead b{font-weight:700}
.mhead span{color:var(--mute);font-weight:400}

/* 餐次 */
.meal{padding:14px 16px}
.mealhead{display:flex;align-items:center;justify-content:space-between}
.mealhead .l{display:flex;align-items:center;gap:7px}
.mealhead .ic{font-size:16px}
.mealhead .nm{font-size:15px;font-weight:700}
.mealhead .cnt{font-size:11px;color:var(--mute);background:#f4f6f8;padding:2px 7px;border-radius:6px}
.mealhead .hint{font-size:11px;color:#b6bec7}
.mealhead .r{display:flex;align-items:center;gap:10px}
.mealhead .kc{font-size:14px;font-weight:700}
.mealhead .kcu{font-size:10px;color:var(--mute);margin-left:-6px}
.addbtn{width:27px;height:27px;border-radius:50%;background:var(--soft);color:var(--green);font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center}
.addbtn:active{background:#d2f0e0}
.items{margin-top:10px;border-top:1px solid var(--line);padding-top:2px}
.item{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f7f8fa}
.item:last-child{border-bottom:none;padding-bottom:0}
.item .nm{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:52vw}
.item .g{font-size:11px;color:var(--mute);margin-left:6px}
.item .kc{font-size:12px;color:#6b7280}
.del{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:#c8cfd6;font-size:18px;margin-left:4px}
.del:active{color:var(--red)}

/* 饮水 */
.cups{display:flex;flex-wrap:wrap;gap:8px}
.cup{width:38px;height:38px;border-radius:9px;background:#f4f6f8;display:flex;align-items:center;justify-content:center;font-size:15px;color:#cfd6dd}
.cup.on{background:#e8f2ff;color:#3b82f6}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid #eef1f4;padding-bottom:var(--safeB)}
.tabbar .t{flex:1;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mute);font-size:10px}
.tabbar .t.on{color:var(--green)}
.tabbar .t svg{width:24px;height:24px}
.fab{position:fixed;right:16px;bottom:calc(74px + var(--safeB));z-index:41;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--green2),var(--green));color:#fff;font-size:28px;font-weight:300;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(18,160,91,.38)}
.fab:active{transform:scale(.95)}

/* 添加页 */
.pagehead{position:sticky;top:0;z-index:30;background:var(--bg);padding:10px 0 8px;margin:-12px -14px 0;padding-left:14px;padding-right:14px}
.ptitle{display:flex;align-items:center;gap:10px}
.back{width:34px;height:34px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink2);box-shadow:0 2px 8px rgba(28,32,36,.06)}
.ptitle .tt{font-size:17px;font-weight:700;flex:1}
.sumcard{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:var(--r);padding:12px 16px;margin:10px 0}
.sumcard .k{font-size:22px;font-weight:800}
.sumcard .k small{font-size:12px;font-weight:400;color:var(--mute)}
.ghost{font-size:12px;color:var(--green);background:var(--soft);padding:8px 12px;border-radius:99px}
.mealtabs{display:flex;gap:7px;margin-bottom:10px}
.mealtabs .mt{flex:1;height:36px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;gap:3px;font-size:13px;color:#6b7280}
.mealtabs .mt.on{background:var(--ink);color:#fff;font-weight:700}
.search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:0 14px;height:42px;margin-bottom:10px}
.search input{flex:1;height:42px;font-size:15px}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 14px;border-radius:99px;background:#fff;color:#6b7280;font-size:13px}
.chip.on{background:var(--soft);color:var(--green);font-weight:700}
.flist{background:#fff;border-radius:var(--r);overflow:hidden}
.f{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid #f4f6f8;gap:10px}
.f:last-child{border-bottom:none}
.f:active{background:#f7fbf9}
.f .nm{font-size:14px;font-weight:500}
.f .ds{font-size:11px;color:var(--mute);margin-top:2px}
.f .pl{width:26px;height:26px;flex:0 0 auto;border-radius:50%;background:var(--soft);color:var(--green);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center}
.fdel{font-size:11px;color:var(--red);padding:4px 2px;flex:0 0 auto}

/* 底部弹层 */
.mask{position:fixed;inset:0;background:rgba(16,20,24,.45);z-index:60;animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:#fff;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + var(--safeB));animation:up .22s ease;max-height:88vh;overflow:auto}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet h3{margin:0 0 4px;font-size:17px;display:flex;align-items:center;justify-content:space-between}
.sheet .x{color:#c3cad1;font-size:24px;line-height:1;padding:0 4px}
.per100{font-size:11px;color:var(--mute);margin-bottom:14px}
.gramrow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.step{width:44px;height:44px;border-radius:12px;background:#f4f6f8;font-size:20px;display:flex;align-items:center;justify-content:center}
.step:active{background:#e6eaee}
.ginput{flex:1;height:44px;border-radius:12px;background:#f7f9fa;font-size:22px;font-weight:700;text-align:center}
.quicks{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.quick{padding:7px 13px;border-radius:99px;background:#f4f6f8;color:var(--ink2);font-size:13px}
.quick:active{background:var(--soft);color:var(--green)}
.preview{background:#f7fbf9;border-radius:12px;padding:12px 14px;margin-bottom:14px}
.preview .big{font-size:30px;font-weight:800;color:var(--green);line-height:1}
.preview .big small{font-size:12px;font-weight:400;color:var(--mute);margin-left:4px}
.preview .det{display:flex;justify-content:space-between;font-size:12px;color:#6b7280;margin-top:8px}
.btn{height:46px;border-radius:23px;background:linear-gradient(135deg,var(--green2),var(--green));color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(18,160,91,.3)}
.btn:active{opacity:.86}
.btn.gray{background:#f4f6f8;color:var(--ink);box-shadow:none}
.field{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.field:last-of-type{border-bottom:none}
.field .lb{font-size:14px;color:var(--ink2)}
.field input{text-align:right;font-size:16px;width:130px}
.field .un{font-size:12px;color:var(--mute);width:26px;text-align:right}

/* 报告 */
.seg{display:flex;background:#f4f6f8;border-radius:99px;padding:3px}
.seg .s{padding:5px 13px;border-radius:99px;font-size:12px;color:var(--mute)}
.seg .s.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 5px rgba(0,0,0,.07)}
.chart{position:relative;display:flex;align-items:flex-end;height:150px;margin:16px 0 0}
.chart .col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.chart .b{width:52%;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,#34d399,var(--green));min-height:2px}
.chart .b.over{background:linear-gradient(180deg,#fca5a5,#ef4444)}
.chart .b.zero{background:#e9edf1}
.tline{position:absolute;left:0;right:0;border-top:1px dashed #c8d0d8;z-index:2}
.tline b{position:absolute;right:0;top:-16px;font-size:10px;color:var(--mute);font-weight:400}
.xlabels{display:flex;margin-top:6px}
.xlabels span{flex:1;text-align:center;font-size:10px;color:var(--mute)}
.legend{display:flex;justify-content:center;gap:14px;margin-top:12px}
.legend i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px;vertical-align:1px}
.grid2{display:flex;flex-wrap:wrap}
.grid2 .gi{width:50%;padding:8px 0}
.grid2 .v{font-size:21px;font-weight:800;line-height:1.2}
.grid2 .n{font-size:12px;color:var(--ink2);margin-top:1px}
.grid2 .t{font-size:10px;color:var(--mute)}
.three{display:flex;gap:8px}
.three .a{flex:1;text-align:center;background:#f8fafb;border-radius:12px;padding:10px 0}
.three .a b{display:block;font-size:22px;font-weight:800;line-height:1.2}
.three .a span{font-size:10px;color:var(--mute)}
.ratiobar{margin-bottom:11px}
.ratiobar .h{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.ratio-pct{font-weight:700}
.wline{display:flex;align-items:baseline;justify-content:space-between}
.wline .wv{font-size:32px;font-weight:800;line-height:1}
.wline .wv small{font-size:12px;color:var(--mute);font-weight:400;margin-left:4px}
.wchg{font-size:13px;padding:4px 10px;border-radius:99px;background:#f4f6f8;color:#6b7280}
.wchg.down{background:var(--soft);color:var(--green)}
.wchg.up{background:#fdecec;color:var(--red)}
.adv{display:flex;gap:8px;margin-bottom:8px}
.adv i{color:var(--green);font-style:normal;line-height:1.5}
.adv p{margin:0;font-size:13px;color:var(--ink2);line-height:1.55}

/* 我的 */
.seg2{display:flex;background:#f4f6f8;border-radius:12px;padding:3px;margin-bottom:4px}
.seg2 .s{flex:1;height:34px;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:14px;color:#6b7280}
.seg2 .s.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 6px rgba(0,0,0,.07)}
.opt{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;background:#f8fafb;margin-bottom:7px;border:1.5px solid transparent}
.opt.on{background:var(--soft);border-color:var(--green)}
.opt .n{font-size:14px;font-weight:700}
.opt .d{font-size:10px;color:var(--mute);margin-top:1px}
.opt .x{font-size:12px;color:var(--mute)}
.opt.on .x{color:var(--green)}
.goals{display:flex;gap:8px}
.goals .g{flex:1;text-align:center;padding:11px 6px;border-radius:12px;background:#f8fafb;border:1.5px solid transparent}
.goals .g.on{background:var(--soft);border-color:var(--green)}
.goals .g .n{font-size:15px;font-weight:800}
.goals .g .d{font-size:9px;color:var(--mute);margin-top:4px;line-height:1.35}
.rescard{background:linear-gradient(160deg,#fff,#f2fbf6)}
.kbig{text-align:center;padding:4px 0 8px}
.kbig b{font-size:42px;font-weight:800;color:var(--green);letter-spacing:-1px;line-height:1}
.kbig small{font-size:12px;color:var(--mute);margin-left:6px;font-weight:400}
.formula{font-size:10.5px;color:var(--mute);text-align:center;line-height:1.6;margin-bottom:12px}
.ng{display:flex;flex-wrap:wrap}
.ng .n{width:33.33%;text-align:center;padding:7px 0}
.ng .n b{display:block;font-size:16px;font-weight:700}
.ng .n span{display:block;font-size:10px;color:var(--ink2)}
.ng .n i{display:block;font-size:9px;color:#b6bec7;font-style:normal}
.wrow2{display:flex;gap:8px;margin-bottom:10px}
.wrow2 input{flex:1;height:42px;background:#f7f9fa;border-radius:10px;padding:0 12px;font-size:15px}
.wrow2 .sb{width:74px;height:42px;border-radius:10px;background:var(--ink);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
.wlist .w{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f7f8fa;font-size:13px}
.wlist .w:last-child{border-bottom:none}
.rbtn{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px}
.rbtn:last-child{border-bottom:none}
.rbtn:active{opacity:.6}
.arrow{color:#c8cfd6;font-size:18px}
.empty{text-align:center;color:#b6bec7;font-size:12px;padding:22px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + var(--safeB));z-index:99;background:rgba(28,32,36,.92);color:#fff;font-size:13px;padding:9px 18px;border-radius:99px;animation:fade .18s;pointer-events:none;white-space:nowrap}
.banner{position:fixed;left:0;right:0;top:0;z-index:98;background:#fef3c7;color:#92400e;font-size:12px;line-height:1.5;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;text-align:center}
</style>
</head>
<body>
<div id="root"></div>
<div id="overlay"></div>
<div class="tabbar" id="tabbar"></div>

/* ---------------- 日期 ---------------- */
function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function fmtDate(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function parseDate(s) { const p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function todayStr() { return fmtDate(new Date()); }
function addDays(dateStr, n) { const d = parseDate(dateStr); d.setDate(d.getDate() + n); return fmtDate(d); }
const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
function dayLabel(s) {
  const t = todayStr();
  if (s === t) return '今天';
  if (s === addDays(t, -1)) return '昨天';
  if (s === addDays(t, 1)) return '明天';
  const d = parseDate(s);
  return (d.getMonth() + 1) + '月' + d.getDate() + '日 周' + WEEK[d.getDay()];
}
function shortDate(s) { const d = parseDate(s); return (d.getMonth() + 1) + '/' + d.getDate(); }
function weekLabel(s) { return '周' + WEEK[parseDate(s).getDay()]; }
function lastNDates(n, end) {
  const e = end || todayStr(); const out = [];
  for (let i = n - 1; i >= 0; i--) out.push(addDays(e, -i));
  return out;
}

/* ---------------- 营养计算 ---------------- */
function num(v, fb) { const n = Number(v); return isFinite(n) && n > 0 ? n : fb; }

function bmr(p) {
  const w = num(p.weight, 70), h = num(p.height, 175), a = num(p.age, 25);
  const base = 10 * w + 6.25 * h - 5 * a;
  return Math.round(p.gender === 'female' ? base - 161 : base + 5);
}
function actFactor(p) {
  const f = ACTIVITY.filter(function (x) { return x.key === (p.activity || 'moderate'); })[0];
  return f ? f.factor : 1.55;
}
function tdee(p) { return Math.round(bmr(p) * actFactor(p)); }
function goalOf(p) {
  return GOALS.filter(function (x) { return x.key === (p.goal || 'maintain'); })[0] || GOALS[1];
}
function targets(p) {
  const pr = p || DEFAULT_PROFILE;
  const base = bmr(pr), total = tdee(pr), goal = goalOf(pr);
  let kcal = Math.round(total * (1 + goal.adjust));
  kcal = Math.max(kcal, Math.round(base * 1.1), 1200);
  const weight = num(pr.weight, 70);
  let protein = Math.round(weight * goal.proteinPerKg);
  protein = Math.min(protein, Math.round((kcal * 0.4) / 4));
  const fat = Math.round((kcal * goal.fatRatio) / 9);
  let carb = Math.round((kcal - protein * 4 - fat * 9) / 4);
  if (carb < 50) carb = 50;
  const fiber = Math.round(Math.min(40, Math.max(25, (kcal / 1000) * 14)));
  return {
    kcal: kcal, protein: protein, carb: carb, fat: fat, fiber: fiber,
    water: Math.round(weight * 35), bmr: base, tdee: total,
    goalName: goal.name, goalDesc: goal.desc, proteinPerKg: goal.proteinPerKg,
    proteinKcalPct: Math.round(((protein * 4) / kcal) * 100),
    carbKcalPct: Math.round(((carb * 4) / kcal) * 100),
    fatKcalPct: Math.round(((fat * 9) / kcal) * 100)
  };
}
function calcFood(food, grams) {
  const g = num(grams, 100) / 100;
  return {
    grams: Math.round(num(grams, 100)),
    kcal: Math.round((food.kcal || 0) * g),
    protein: Math.round((food.protein || 0) * g * 10) / 10,
    carb: Math.round((food.carb || 0) * g * 10) / 10,
    fat: Math.round((food.fat || 0) * g * 10) / 10,
    fiber: Math.round((food.fiber || 0) * g * 10) / 10
  };
}
function sumRecords(list) {
  const o = { kcal: 0, protein: 0, carb: 0, fat: 0, fiber: 0 };
  (list || []).forEach(function (r) {
    o.kcal += r.kcal || 0; o.protein += r.protein || 0; o.carb += r.carb || 0;
    o.fat += r.fat || 0; o.fiber += r.fiber || 0;
  });
  ['protein', 'carb', 'fat', 'fiber'].forEach(function (k) { o[k] = Math.round(o[k] * 10) / 10; });
  o.kcal = Math.round(o.kcal);
  return o;
}
function pct(v, t) { if (!t || t <= 0) return 0; return Math.min(100, Math.round((v / t) * 100)); }
function searchFoods(kw) {
  const q = String(kw || '').trim().toLowerCase();
  if (!q) return [];
  return FOODS.filter(function (f) {
    return f.name.toLowerCase().indexOf(q) > -1 || (f.py && f.py.indexOf(q) > -1);
  });
}

  data: { profile: DEFAULT_PROFILE, logs: {}, water: {}, custom: [], weights: [] },
  load: function () {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const d = JSON.parse(raw);
        this.data = {
          profile: Object.assign({}, DEFAULT_PROFILE, d.profile || {}),
          logs: d.logs || {}, water: d.water || {},
          custom: Array.isArray(d.custom) ? d.custom : [],
          weights: Array.isArray(d.weights) ? d.weights : []
        };
      }
    } catch (e) { /* 忽略损坏数据 */ }
  },
  save: function () {
    try { localStorage.setItem(KEY, JSON.stringify(this.data)); }
    catch (e) {
      if (!this._warned) {
        this._warned = true;
        toast('无法保存：当前浏览器禁止本地存储');
      }
    }
  }
};

function freqFoodIds(limit) {
  const count = {};
  lastNDates(30).forEach(function (d) {
    (store.data.logs[d] || []).forEach(function (r) {
      if (!r.foodId) return;
      if (!count[r.foodId]) count[r.foodId] = { c: 0, last: 0 };
      count[r.foodId].c++;
      count[r.foodId].last = Math.max(count[r.foodId].last, r.ts || 0);
    });
  });
  return Object.keys(count).sort(function (a, b) {
    return count[b].c - count[a].c || count[b].last - count[a].last;
  }).slice(0, limit || 14);
}

function sheetGrams() {
  const f = S.pickFood;
  if (!f) return '';
  const g = Number(S.grams) || 0;
  const p = calcFood(f, g);
  const q = [];
  const push = function (label, grams) {
    const gg = Math.round(grams);
    if (gg > 0 && !q.some(function (x) { return x.g === gg; })) q.push({ l: label, g: gg });
  };
  if (f.serving && f.serving.grams) {
    const s = f.serving.grams, u = f.serving.unit;
    push('0.5' + u, s * 0.5); push('1' + u, s); push('1.5' + u, s * 1.5); push('2' + u, s * 2);
  }
  push('100g', 100); push('150g', 150); push('200g', 200);

  return '<div class="mask" data-act="closesheet"></div>' +
    '<div class="sheet"><h3><span>' + esc(f.name) + '</span><span class="x" data-act="closesheet">×</span></h3>' +
    '<div class="per100">每 100g：' + f.kcal + ' kcal · 蛋白 ' + f.protein + 'g · 碳水 ' + f.carb + 'g · 脂肪 ' + f.fat + 'g</div>' +
    '<div class="gramrow"><div class="step" data-act="gstep" data-d="-1">−</div>' +
    '<input class="ginput" id="grams" type="number" inputmode="decimal" value="' + S.grams + '">' +
    '<div class="step" data-act="gstep" data-d="1">＋</div></div>' +
    '<div class="quicks">' + q.map(function (x) {
      return '<div class="quick" data-act="qg" data-g="' + x.g + '">' + x.l + '</div>';
    }).join('') + '</div>' +
    '<div class="preview"><div class="big">' + p.kcal + '<small>kcal</small></div>' +
    '<div class="det"><span>蛋白 ' + p.protein + 'g</span><span>碳水 ' + p.carb + 'g</span>' +

}

/* ================= 报告 ================= */
function viewReport() {
  const t = targets(store.data.profile);
  const range = S.range;
  const dates = lastNDates(range);
  const rows = dates.map(function (d) {
    const s = sumRecords(getLogs(d));
    return {
      date: d, kcal: s.kcal, protein: s.protein, carb: s.carb, fat: s.fat, fiber: s.fiber,
      count: getLogs(d).length,
      label: range === 7 ? weekLabel(d) : shortDate(d)
    };
  });

  let maxK = t.kcal;
  rows.forEach(function (r) { if (r.kcal > maxK) maxK = r.kcal; });
  maxK = Math.max(maxK, 1);

  const cols = rows.map(function (r, i) {
    const h = Math.round((r.kcal / maxK) * 100);
    const cls = r.kcal === 0 ? 'zero' : (r.kcal > t.kcal * 1.1 ? 'over' : '');
    const show = range === 7 || i % 5 === 4 || i === rows.length - 1;
    return '<div class="col"><div class="b ' + cls + '" style="height:' + (r.kcal > 0 ? Math.max(2, h) : 2) + '%"></div></div>';
  }).join('');
  const labels = rows.map(function (r, i) {
    const show = range === 7 || i % 5 === 4 || i === rows.length - 1;
    return '<span>' + (show ? r.label : '') + '</span>';
  }).join('');

  const logged = rows.filter(function (r) { return r.count > 0; });
  const n = logged.length || 1;
  const tot = logged.reduce(function (a, r) {
    a.kcal += r.kcal; a.protein += r.protein; a.carb += r.carb; a.fat += r.fat; a.fiber += r.fiber; return a;
  }, { kcal: 0, protein: 0, carb: 0, fat: 0, fiber: 0 });
  const avg = {
    kcal: Math.round(tot.kcal / n), protein: Math.round(tot.protein / n * 10) / 10,
    carb: Math.round(tot.carb / n * 10) / 10, fat: Math.round(tot.fat / n * 10) / 10,
    fiber: Math.round(tot.fiber / n * 10) / 10
  };
  const onTarget = logged.filter(function (r) { return Math.abs(r.kcal - t.kcal) <= t.kcal * 0.1; }).length;
  const proteinOK = logged.filter(function (r) { return r.protein >= t.protein * 0.9; }).length;

  const pk = avg.protein * 4, ck = avg.carb * 4, fk = avg.fat * 9;
  const sumK = (pk + ck + fk) || 1;
  const ratio = [
    { n: '蛋白质', p: Math.round(pk / sumK * 100), c: 'var(--blue)', t: t.proteinKcalPct },
    { n: '碳水', p: Math.round(ck / sumK * 100), c: 'var(--amber)', t: t.carbKcalPct },
    { n: '脂肪', p: Math.round(fk / sumK * 100), c: 'var(--purple)', t: t.fatKcalPct }
  ];

  const ws = store.data.weights;
  let w = null, delta = 0;
  if (ws.length) {
    w = ws[ws.length - 1];
    if (ws.length > 1) delta = Math.round((w.weight - ws[0].weight) * 10) / 10;
  }

  const tips = [];
  if (!logged.length) {
    tips.push('还没有记录，先去「今日」添加一餐吧');
  } else {
    if (avg.kcal > t.kcal * 1.1) tips.push('日均热量超出目标 ' + (avg.kcal - t.kcal) + ' kcal，注意烹饪油与加餐分量');
    else if (avg.kcal < t.kcal * 0.8) tips.push('日均热量偏低，长期过低会掉肌肉、拖慢代谢，建议补足到 ' + t.kcal + ' kcal');
    if (avg.protein < t.protein * 0.8) tips.push('蛋白质日均 ' + avg.protein + 'g，低于目标 ' + t.protein + 'g，可增加鸡胸、蛋、奶、豆制品');
    if (avg.fiber < t.fiber * 0.7) tips.push('膳食纤维不足，多吃蔬菜、全谷物与水果');
    if (avg.fat > t.fat * 1.3) tips.push('脂肪偏高，减少油炸食品与坚果过量摄入');
    if (!tips.length) tips.push('各项指标都在目标区间内，保持这个节奏');
  }

  return '<div class="wrap">' +
    '<div class="card"><div class="row between">' +
    '<b style="font-size:15px">热量趋势</b>' +
    '<div class="seg">' + [7, 30].map(function (r) {
      return '<div class="s ' + (range === r ? 'on' : '') + '" data-act="range" data-r="' + r + '">近' + r + '天</div>';
    }).join('') + '</div></div>' +
    '<div class="chart"><div class="tline" style="bottom:' + Math.min(100, Math.round(t.kcal / maxK * 100)) + '%"><b>目标 ' + t.kcal + '</b></div>' + cols + '</div>' +
    '<div class="xlabels">' + labels + '</div>' +
    '<div class="legend sm mute"><span><i style="background:var(--green)"></i>达标</span>' +
    '<span><i style="background:#f87171"></i>超出10%</span><span><i style="background:#e5e9ee"></i>未记录</span></div></div>' +

    '<div class="card"><div class="row between" style="margin-bottom:6px">' +
    '<b style="font-size:15px">记录日均</b><span class="sm mute">' + logged.length + ' 天有记录</span></div>' +
    '<div class="grid2">' +
    '<div class="gi"><div class="v">' + avg.kcal + '</div><div class="n">热量 kcal</div><div class="t">目标 ' + t.kcal + '</div></div>' +
    '<div class="gi"><div class="v">' + avg.protein + '</div><div class="n">蛋白 g</div><div class="t">目标 ' + t.protein + '</div></div>' +
    '<div class="gi"><div class="v">' + avg.carb + '</div><div class="n">碳水 g</div><div class="t">目标 ' + t.carb + '</div></div>' +
    '<div class="gi"><div class="v">' + avg.fat + '</div><div class="n">脂肪 g</div><div class="t">目标 ' + t.fat + '</div></div>' +
    '</div></div>' +

    '<div class="card"><b style="font-size:15px">达成情况</b>' +
    '<div class="three" style="margin-top:10px">' +
    '<div class="a"><b>' + logged.length + '</b><span>记录天数</span></div>' +
    '<div class="a"><b class="green">' + onTarget + '</b><span>热量达标</span></div>' +
    '<div class="a"><b class="green">' + proteinOK + '</b><span>蛋白达标</span></div></div>' +
    '<div class="xs mute" style="margin-top:10px;line-height:1.6">热量达标 = 摄入在目标 ±10% 内；蛋白达标 = 达到目标 90% 以上</div></div>' +

    '<div class="card"><div class="row between" style="margin-bottom:10px">' +
    '<b style="font-size:15px">供能比</b><span class="xs mute">建议 蛋白' + t.proteinKcalPct + '% 碳水' + t.carbKcalPct + '% 脂肪' + t.fatKcalPct + '%</span></div>' +
    ratio.map(function (r) {
      return '<div class="ratiobar"><div class="h"><span>' + r.n + '</span><span class="ratio-pct">' + r.p + '%</span></div>' +
        '<div class="bar"><i style="width:' + r.p + '%;background:' + r.c + '"></i></div></div>';
    }).join('') + '</div>' +

    (w ? '<div class="card"><div class="row between"><b style="font-size:15px">体重</b>' +
      '<span class="sm mute">目标 ' + store.data.profile.targetWeight + ' kg</span></div>' +
      '<div class="wline" style="margin-top:10px"><div class="wv">' + w.weight + '<small>kg</small></div>' +
      '<div class="wchg ' + (delta < 0 ? 'down' : (delta > 0 ? 'up' : '')) + '">' +
      (delta > 0 ? '↑ ' + delta : (delta < 0 ? '↓ ' + (-delta) : '— 0')) + ' kg</div></div>' +
      '<div class="xs mute" style="margin-top:8px">最近记录 ' + w.date + '，变化为区间首尾差</div></div>' : '') +

    '<div class="card"><b style="font-size:15px">建议</b><div style="margin-top:10px">' +
    tips.map(function (x) { return '<div class="adv"><i>•</i><p>' + esc(x) + '</p></div>'; }).join('') +
    '</div></div>' +
    '<div class="xs mute" style="text-align:center;padding:8px 0 20px">BMR ' + t.bmr + ' · TDEE ' + t.tdee + ' · 目标 ' + t.kcal + ' kcal</div>' +
    '</div>';
}

      '<div class="n"><b>' + t.fiber + '</b><span>纤维 g</span><i>建议下限</i></div>' +
      '<div class="n"><b>' + t.water + '</b><span>饮水 ml</span><i>体重×35</i></div>' +
      '<div class="n"><b>' + t.proteinPerKg + '</b><span>蛋白/kg</span><i>每公斤</i></div>';
  }
}

/* 克数弹层局部刷新 */
function refreshSheet() {
  if (!S.pickFood) return;
  const f = S.pickFood;
  const p = calcFood(f, S.grams);
  const pv = document.querySelector('.preview');
  if (pv) {
    pv.innerHTML = '<div class="big">' + p.kcal + '<small>kcal</small></div>' +
      '<div class="det"><span>蛋白 ' + p.protein + 'g</span><span>碳水 ' + p.carb + 'g</span>' +
      '<span>脂肪 ' + p.fat + 'g</span><span>纤维 ' + p.fiber + 'g</span></div>';
  }
}

/* ================= 事件 ================= */
document.addEventListener('click', function (e) {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  switch (act) {
    case 'tab':
      S.view = el.dataset.v; render(); break;

    case 'prevday':
      S.date = addDays(S.date, -1); render(); break;

    case 'nextday':
      if (S.date === todayStr()) return;
      S.date = addDays(S.date, 1); render(); break;

    case 'addmeal':
      S.meal = el.dataset.meal; S.view = 'add'; S.kw = ''; render(); break;

    case 'openadd':
      S.meal = guessMeal(); S.view = 'add'; S.kw = ''; render(); break;

    case 'back':
      S.view = 'today'; S.pickFood = null; S.newFood = false; render(); break;

    case 'del': {
      const id = el.dataset.id;
      if (!confirm('删除这条记录？')) return;
      setLogs(S.date, getLogs(S.date).filter(function (r) { return r.id !== id; }));
      render(); break;
    }

    case 'cup': {
      const i = +el.dataset.i;
      const target = (i + 1) * 250;
      setWater(S.date, getWater(S.date) >= target ? i * 250 : target);
      render(); break;
    }

    case 'cat':
      S.cat = el.dataset.cat; S.kw = ''; render(); break;

    case 'setmeal':
      S.meal = el.dataset.meal; render(); break;

    case 'pick': {
      const f = listForAdd()[+el.dataset.i];
      if (!f) return;
      S.pickFood = f;
      S.grams = (f.serving && f.serving.grams) || 100;
      render(); break;
    }

    case 'closesheet':
      S.pickFood = null; render(); break;

    case 'gstep': {
      const d = +el.dataset.d;
      const step = (S.pickFood && S.pickFood.serving && S.pickFood.serving.grams)
        ? Math.max(5, Math.round(S.pickFood.serving.grams / 2)) : 10;
      let g = (Number(S.grams) || 0) + d * step;
      if (g < 1) g = 1;
      if (g > 5000) g = 5000;
      S.grams = g;
      const inp = $('grams'); if (inp) inp.value = g;
      refreshSheet(); break;
    }

    case 'qg':
      S.grams = +el.dataset.g;
      const gi = $('grams'); if (gi) gi.value = S.grams;
      refreshSheet(); break;

    case 'confirm': {
      const f = S.pickFood;
      if (!f) return;
      const g = Number(S.grams);
      if (!g || g <= 0) { toast('请输入克数'); return; }
      const p = calcFood(f, g);
      const list = getLogs(S.date);
      list.push({
        id: newId(), meal: S.meal, foodId: f.id, name: f.name, grams: p.grams,
        kcal: p.kcal, protein: p.protein, carb: p.carb, fat: p.fat, fiber: p.fiber, ts: Date.now()
      });
      list.sort(function (a, b) { return a.ts - b.ts; });
      setLogs(S.date, list);
      S.pickFood = null;
      render();
      toast('已记入' + (MEALS.filter(function (m) { return m.key === S.meal; })[0] || {}).name);
      break;
    }

    case 'newfood':
      S.newFood = true; render(); break;

    case 'closefood':
      S.newFood = false; render(); break;

    case 'savenewfood': {
      const name = ($('nf_name').value || '').trim();
      const kcal = Number($('nf_kcal').value);
      if (!name) { toast('请输入名称'); return; }
      if (!kcal) { toast('请输入热量'); return; }
      store.data.custom.unshift({
        id: 'cu' + Date.now().toString(36), name: name, cat: 'custom', py: '',
        kcal: kcal, protein: Number($('nf_p').value) || 0, carb: Number($('nf_c').value) || 0,
        fat: Number($('nf_f').value) || 0, fiber: Number($('nf_fb').value) || 0,
        serving: { unit: '份', grams: 100 }
      });
      store.save();
      S.newFood = false; S.cat = 'custom'; S.kw = '';
      render(); toast('已保存');
      break;
    }

    case 'delfood': {
      const id = el.dataset.id;
      if (!confirm('删除该自定义食物？')) return;
      store.data.custom = store.data.custom.filter(function (f) { return f.id !== id; });
      store.save(); render(); break;
    }

    case 'range':
      S.range = +el.dataset.r; render(); break;

    case 'gender':
      store.data.profile.gender = el.dataset.g; store.save();
      document.querySelectorAll('.seg2 .s').forEach(function (x) {
        x.classList.toggle('on', x.dataset.g === el.dataset.g);
      });
      refreshTargets(); break;

    case 'activity':
      store.data.profile.activity = el.dataset.k; store.save();
      document.querySelectorAll('.opt').forEach(function (x) {
        x.classList.toggle('on', x.dataset.k === el.dataset.k);
      });
      refreshTargets(); break;

    case 'goal':
      store.data.profile.goal = el.dataset.k; store.save();
      document.querySelectorAll('.goals .g').forEach(function (x) {
        x.classList.toggle('on', x.dataset.k === el.dataset.k);
      });
      refreshTargets(); break;

    case 'saveweight': {
      const v = Number($('winput').value);
      if (!v || v <= 0) { toast('请输入体重'); return; }
      const d = todayStr();
      store.data.weights = store.data.weights.filter(function (x) { return x.date !== d; });
      store.data.weights.push({ date: d, weight: Math.round(v * 10) / 10, ts: Date.now() });
      store.data.weights.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
      store.data.profile.weight = Math.round(v * 10) / 10;
      store.save(); render(); toast('已记录'); break;
    }

    case 'export': {
      const data = JSON.stringify({
        v: 1, exportedAt: new Date().toISOString(),
        profile: store.data.profile, logs: store.data.logs, water: store.data.water,
        custom: store.data.custom, weights: store.data.weights
      });
      const ta = document.createElement('textarea');
      ta.value = data; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
      ta.remove();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(data).then(function () { toast('已复制备份'); },
          function () { if (!ok) toast('复制失败，请手动长按选择'); });
      } else {
        toast(ok ? '已复制备份' : '复制失败');
      }
      break;
    }

    case 'import': {
      const txt = prompt('粘贴之前导出的备份 JSON：');
      if (!txt) return;
      try {
        const d = JSON.parse(txt);
        if (d.profile) store.data.profile = Object.assign({}, DEFAULT_PROFILE, d.profile);
        if (d.logs) store.data.logs = d.logs;
        if (d.water) store.data.water = d.water;
        if (Array.isArray(d.custom)) store.data.custom = d.custom;
        if (Array.isArray(d.weights)) store.data.weights = d.weights;
        store.save(); render();
        toast('导入成功');
      } catch (err) { toast('不是合法的备份 JSON'); }
      break;
    }

    case 'clear':
      if (!confirm('清空所有数据？包括饮食记录、饮水、体重与自定义食物，不可恢复')) return;
      store.data = { profile: Object.assign({}, DEFAULT_PROFILE), logs: {}, water: {}, custom: [], weights: [] };
      store.save(); render(); toast('已清空'); break;

    case 'about':
      alert('营养日记\n\nBMR 采用 Mifflin-St Jeor 公式，TDEE = BMR × 活动系数，目标热量在 TDEE 上按减脂/维持/增肌调整。\n\n食物营养值取自常见食物成分表，为估算值。\n\n本工具不构成医疗建议。');
      break;

    case 'noshow':
      break;
  }
});

/* 输入事件 */
document.addEventListener('input', function (e) {
  const t = e.target;

  if (t.id === 'kw') {
    S.kw = t.value;
    const list = listForAdd();
    const box = document.querySelector('.flist');
    if (box) {
      box.innerHTML = list.length ? list.map(function (f, i) {
        return '<div class="f" data-act="pick" data-i="' + i + '">' +
          '<div style="min-width:0;flex:1"><div class="nm">' + esc(f.name) + '</div>' +
          '<div class="ds">每100g · ' + f.kcal + ' kcal · 蛋白' + f.protein + ' · 碳水' + f.carb + ' · 脂肪' + f.fat + '</div></div>' +
          (f.cat === 'custom' ? '<span class="fdel" data-act="delfood" data-id="' + f.id + '">删</span>' : '<span class="pl">＋</span>') +
          '</div>';
      }).join('') : '<div class="empty">没找到，试试「自定义」</div>';
    }
    return;
  }

  if (t.id === 'grams') {
    S.grams = t.value;
    refreshSheet();
    return;
  }

  if (t.dataset && t.dataset.pf) {
    const key = t.dataset.pf;
    const v = Number(t.value);
    if (!isFinite(v) || v <= 0) return;
    const lim = { age: [10, 100], height: [120, 230], weight: [30, 250], targetWeight: [30, 250] }[key];
    store.data.profile[key] = Math.min(lim[1], Math.max(lim[0], v));
    store.save();
    refreshTargets();
  }
});

/* ================= 启动 ================= */
store.load();
if (!localStorage.getItem(KEY)) store.save();

/* 检测存储是否可用：用 file:// 打开时部分浏览器禁止 localStorage */
(function () {
  let ok = true;
  try { localStorage.setItem('__nd_probe', '1'); localStorage.removeItem('__nd_probe'); }
  catch (e) { ok = false; }
  if (!ok) {
    const b = document.createElement('div');
    b.className = 'banner';
    b.textContent = '当前打开方式不能保存数据，记录关闭后会丢失。请改用 https 网址打开并「添加到主屏幕」。';
    document.body.appendChild(b);
  }
})();

/* service worker：离线可用 */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { });
  });
}

render();
</script>

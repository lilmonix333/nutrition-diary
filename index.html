function resolvedTheme() {
  const t = (store.data.settings && store.data.settings.theme) || 'auto';
  if (t === 'auto') {
    try {
      return (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    } catch (e) { return 'light'; }
  }
  return t;
}

function lighten(rgb, p) {
  return 'rgb(' + rgb.split(',').map(function (v) {
    return Math.round(Number(v) + (255 - Number(v)) * p);
  }).join(',') + ')';
}

function applyAppearance() {
  const s = store.data.settings || DEFAULT_SETTINGS;
  const skin = s.skin === 'persona' ? 'persona' : 'minimal';
  const root = document.documentElement;
  root.setAttribute('data-skin', skin);

  // PERSONA 风格固定浅色（P3R 是白底 + 黑边 + 水色）
  const theme = skin === 'persona' ? 'light' : resolvedTheme();
  root.setAttribute('data-theme', theme);

  const acc = skin === 'persona' ? PERSONA_ACC : (ACCENTS[s.accent] || ACCENTS.green);
  root.style.setProperty('--acc', acc.a);
  root.style.setProperty('--green2', lighten(acc.a, 0.26));

  let bg = '';
  if (BG_IMAGE) {
    bg = 'url("' + BG_IMAGE + '")';
  } else {
    const b = BGS.filter(function (x) { return x.key === s.bg; })[0] || BGS[0];
    bg = theme === 'dark' ? b.dark : b.light;
  }
  // 背景放在固定层里，不会跟着页面滚动
  const bgLayer = document.getElementById('bgfixed');
  if (bgLayer) bgLayer.style.backgroundImage = skin === 'persona' ? '' : (bg || 'none');
  document.body.style.backgroundImage = 'none';

  // 卡片不透明度
  const a = typeof s.alpha === 'number' ? s.alpha : 1;
  root.style.setProperty('--cardA', String(Math.min(1, Math.max(0.4, a))));

  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#0f141a' : acc.hex);
}

function pickBgImage() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
  document.body.appendChild(inp);
  inp.addEventListener('change', function () {
    compressBg(inp.files && inp.files[0]);
    setTimeout(function () { inp.remove(); }, 100);
  });
  inp.click();
}

function compressBg(file) {
  if (!file) return;
  if (!/^image\//.test(file.type || '')) { toast('请选择图片文件'); return; }
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = function () {
    const MAXW = 1200;
    const scale = Math.min(1, MAXW / img.width);
    const w = Math.max(1, Math.round(img.width * scale));
    const h = Math.max(1, Math.round(img.height * scale));
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    cv.getContext('2d').drawImage(img, 0, 0, w, h);
    let data = '';
    try { data = cv.toDataURL('image/jpeg', 0.72); }
    catch (e) { toast('这张图无法处理'); URL.revokeObjectURL(url); return; }
    if (data.length > 2600000) { toast('图片太大，换一张小一点的'); URL.revokeObjectURL(url); return; }
    try {
      localStorage.setItem(KEY_IMG, data);
      BG_IMAGE = data;
      applyAppearance(); renderKeepScroll();
      toast('背景已更新');
    } catch (e) {
      toast('本机存储不足，换张更小的图');
    }
    URL.revokeObjectURL(url);
  };
  img.onerror = function () { toast('无法读取这张图片'); URL.revokeObjectURL(url); };
  img.src = url;
}

/* ---------------- 训练计划 ---------------- */
function planData() {
  if (!store.data.plan) store.data.plan = { split: 'ppl3_a', days: {}, cycle: 0, checkins: {}, coins: 0, weekPaid: {}, buffs: {} };
  const p = store.data.plan;
  p.coins = p.coins || 0;
  p.checkins = p.checkins || {};
  p.days = p.days || {};
  p.buffs = p.buffs || {};
  p.weekPaid = p.weekPaid || {};
  return p;
}

function weekKey(d) {
  const t = new Date(parseDate(d).getTime());
  const day = (t.getDay() + 6) % 7;
  t.setDate(t.getDate() - day);
  return fmtDate(t);
}
function weekCheckins() {
  const p = planData();
  const wk = weekKey(todayStr());
  return Object.keys(p.checkins).filter(function (d) { return weekKey(d) === wk; });
}
function todayDayIndex() {
  const p = planData();
  const sp = SPLITS[p.split] || SPLITS.ppl3_a;
  return p.cycle % sp.days.length;
}
function dayGroups(idx) {
  const p = planData();
  const sp = SPLITS[p.split] || SPLITS.ppl3_a;
  const custom = p.days[p.split + '#' + idx];
  if (custom) return custom.slice();
  const d = sp.days[idx] || { g: [] };
  return d.g.slice();
}
function groupName(k) {
  const g = TRAIN.filter(function (x) { return x.key === k; })[0];
  return g ? g.name : k;
}

function weeklyPlan() {
  const pr = store.data.profile;
  const t = targets(pr, { trainDay: isTrainDay() });
  const cut = pr.goal === 'cut', bulk = pr.goal === 'bulk';
  const days = cut ? 5 : 4;
  return {
    days: days,
    title: cut ? '本周减脂目标' : (bulk ? '本周增肌目标' : '本周维持目标'),
    items: [
      '完成 ' + days + ' 次训练并打卡',
      '日均热量控制在 ' + t.kcal + ' kcal 附近',
      '蛋白日均 ≥ ' + Math.round(t.protein * 0.9) + ' g',
      '饮水每天 ≥ ' + t.water + ' ml',
      cut ? '体重下降 0.3–0.7 kg' : (bulk ? '体重上升 0.2–0.4 kg' : '体重波动不超过 ±0.5 kg')
    ]
  };
}

/* 体重迷你趋势 */
function N_sumDay(list) {

function sparkline(pts) {
  if (!pts || pts.length < 2) return '';
  const vals = pts.map(function (p) { return p.weight; });
  const min = Math.min.apply(null, vals);
  const max = Math.max.apply(null, vals);
  const span = (max - min) || 1;
  const W = 300, H = 48, pad = 6;
  const step = (W - pad * 2) / (pts.length - 1);
  const d = pts.map(function (p, i) {
    const x = pad + i * step;
    const y = pad + (H - pad * 2) * (1 - (p.weight - min) / span);
    return (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
  }).join(' ');
  return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
    '<path d="' + d + '" fill="none" style="stroke:var(--green)" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

function copyText(text, done) {
  let ok = false;
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
  } catch (e) { ok = false; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(
      function () { done(true); },
      function () { done(ok); }
    );
  } else {
    done(ok);
  }
}

/* 导入备份：逐字段校验，脏数据丢掉而不是写坏存储 */
function applyBackup(text) {
  let d = text;
  if (typeof d === 'string') {
    try { d = JSON.parse(d); } catch (e) { return { ok: false, msg: '不是合法的 JSON' }; }
  }
  if (!d || typeof d !== 'object' || Array.isArray(d)) return { ok: false, msg: '内容为空或格式不对' };

  let days = 0, records = 0, touched = false;

  if (d.profile && typeof d.profile === 'object' && !Array.isArray(d.profile)) {
    const p = Object.assign({}, DEFAULT_PROFILE);
    Object.keys(DEFAULT_PROFILE).forEach(function (k) {
      const v = d.profile[k];
      if (k === 'gender') { if (v === 'male' || v === 'female') p.gender = v; }
      else if (k === 'activity') { if (ACTIVITY.some(function (a) { return a.key === v; })) p.activity = v; }
      else if (k === 'goal') { if (GOALS.some(function (g) { return g.key === v; })) p.goal = v; }
      else { const n = Number(v); if (isFinite(n) && n > 0) p[k] = n; }
    });
    store.data.profile = p;
    touched = true;
  }

  if (d.logs && typeof d.logs === 'object' && !Array.isArray(d.logs)) {
    const logs = {};
    Object.keys(d.logs).forEach(function (date) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
      const arr = d.logs[date];
      if (!Array.isArray(arr)) return;
      const items = arr.filter(function (r) { return r && r.name; }).map(function (r) {
        return {
          id: r.id || newId(),
          meal: ['breakfast', 'lunch', 'dinner', 'snack'].indexOf(r.meal) > -1 ? r.meal : 'snack',
          foodId: r.foodId || '',
          name: String(r.name),
          grams: Math.round(Number(r.grams) || 0),
          kcal: Math.round(Number(r.kcal) || 0),
          protein: Number(r.protein) || 0,
          carb: Number(r.carb) || 0,
          fat: Number(r.fat) || 0,
          fiber: Number(r.fiber) || 0,
          ts: Number(r.ts) || Date.now()
        };
      });
      if (items.length) {
        logs[date] = items;
        days += 1;
        records += items.length;
      }
    });
    store.data.logs = logs;
    touched = true;
  }

  if (d.water && typeof d.water === 'object' && !Array.isArray(d.water)) {
    const w = {};
    Object.keys(d.water).forEach(function (date) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
      const v = Number(d.water[date]);
      if (v > 0) w[date] = Math.round(v);
    });
    store.data.water = w;
    touched = true;
  }

  if (Array.isArray(d.custom)) {
    store.data.custom = d.custom.filter(function (f) { return f && f.name; }).map(function (f, i) {
      const grams = Number(f.serving && f.serving.grams);
      return {
        id: f.id || 'cu' + Date.now().toString(36) + i + Math.floor(Math.random() * 99),
        name: String(f.name), cat: 'custom', py: String(f.py || ''),
        kcal: Number(f.kcal) || 0, protein: Number(f.protein) || 0,
        carb: Number(f.carb) || 0, fat: Number(f.fat) || 0, fiber: Number(f.fiber) || 0,
        serving: (isFinite(grams) && grams > 0)
          ? { unit: String((f.serving && f.serving.unit) || '份'), grams: grams }
          : { unit: '份', grams: 100 }
      };
    });
    touched = true;
  }

  if (Array.isArray(d.weights)) {
    store.data.weights = d.weights
      .filter(function (x) { return x && x.date && Number(x.weight) > 0; })
      .map(function (x) {
        return { date: String(x.date), weight: Math.round(Number(x.weight) * 10) / 10, ts: Number(x.ts) || Date.now() };
      })
      .sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    touched = true;
  }

  if (Array.isArray(d.fav)) {
    store.data.fav = d.fav.filter(function (x) { return typeof x === 'string' && !!foodById(x); });
    touched = true;
  }

  if (d.videos && typeof d.videos === 'object' && !Array.isArray(d.videos)) {
    const vids = {};
    Object.keys(d.videos).forEach(function (k) {
      if (!/^[a-z]+#\d+$/.test(k)) return;
      const v = d.videos[k];
      if (!v || typeof v !== 'object') return;
      const m = String(v.bv || '').match(/BV[0-9A-Za-z]{10}/);
      if (!m) return;
      vids[k] = { bv: m[0], t: String(v.t || '') };
    });
    store.data.videos = vids;
    touched = true;
  }

  if (d.quizDone && typeof d.quizDone === 'object') {
    const qd = { poem: [], word: [] };
    ['poem', 'word'].forEach(function (k) {
      if (Array.isArray(d.quizDone[k])) {
        qd[k] = d.quizDone[k].filter(function (x) { return typeof x === 'string'; });
      }
    });
    store.data.quizDone = qd;
    touched = true;
  }

  if (d.settings && typeof d.settings === 'object') {
    const s = Object.assign({}, DEFAULT_SETTINGS);
    if (['auto', 'light', 'dark'].indexOf(d.settings.theme) > -1) s.theme = d.settings.theme;
    if (ACCENTS[d.settings.accent]) s.accent = d.settings.accent;
    if (BGS.some(function (b) { return b.key === d.settings.bg; })) s.bg = d.settings.bg;
    store.data.settings = s;
    touched = true;
  }

  if (!touched) return { ok: false, msg: '没识别到可导入的数据' };
  store.save();
  return { ok: true, days: days, records: records };
}

function starSVG(on, size) {
  const s = size || 15;
  return '<svg class="star' + (on ? ' on' : '') + '" width="' + s + '" height="' + s +
    '" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.4l2.95 6.05 6.65.95-4.83 4.68 1.16 6.62L12 17.55 6.07 20.7l1.16-6.62L2.4 9.4l6.65-.95z"/></svg>';

/* ================= 营养雷达（面板式统计） ================= */
function radarSVG(items) {
  const N = items.length;
  const R = 82, cx = 110, cy = 108;
  const ang = function (i) { return -Math.PI / 2 + i * 2 * Math.PI / N; };
  const ring = function (k) {
    return '<polygon points="' + items.map(function (_, i) {
      const a = ang(i);
      return (cx + Math.cos(a) * R * k).toFixed(1) + ',' + (cy + Math.sin(a) * R * k).toFixed(1);
    }).join(' ') + '" fill="none" stroke="rgba(10,14,20,.16)" stroke-width="1"/>';
  };
  const axes = items.map(function (_, i) {
    const a = ang(i);
    return '<line x1="' + cx + '" y1="' + cy + '" x2="' + (cx + Math.cos(a) * R).toFixed(1) +
      '" y2="' + (cy + Math.sin(a) * R).toFixed(1) + '" stroke="rgba(10,14,20,.16)" stroke-width="1"/>';
  }).join('');
  const poly = items.map(function (it, i) {
    const a = ang(i);
    const r = R * Math.max(0.05, Math.min(1, (it.pct || 0) / 100));
    return (cx + Math.cos(a) * r).toFixed(1) + ',' + (cy + Math.sin(a) * r).toFixed(1);
  }).join(' ');
  const labels = items.map(function (it, i) {
    const a = ang(i);
    const x = cx + Math.cos(a) * (R + 26), y = cy + Math.sin(a) * (R + 24);
    return '<text x="' + x.toFixed(0) + '" y="' + y.toFixed(0) + '" text-anchor="middle" font-size="10" fill="currentColor" opacity=".75">' +
      esc(it.label) + '</text>' +
      '<text x="' + x.toFixed(0) + '" y="' + (y + 12) + '" text-anchor="middle" font-size="11" font-weight="800" fill="rgb(0,165,200)">' +
      Math.round(it.pct || 0) + '%</text>';
  }).join('');
  return '<svg class="radar" viewBox="-16 -12 252 264">' + ring(0.34) + ring(0.67) + ring(1) + axes +
    '<polygon points="' + poly + '" fill="rgba(0,165,200,.34)" stroke="rgb(0,165,200)" stroke-width="2.5" stroke-linejoin="round"/>' +
    labels + '</svg>';
}

/* ================= P3R 涟漪 ================= */
if (typeof document !== 'undefined' && document.addEventListener) {
  document.addEventListener('pointerdown', function (e) {
    try {
      if (document.documentElement.getAttribute('data-skin') !== 'persona') return;
      const t = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
      if (!t || !t.getBoundingClientRect) return;
      const r = t.getBoundingClientRect();
      const d = Math.max(r.width, r.height) * 1.15 || 40;
      const s = document.createElement('span');
      s.className = 'ripple';
      s.style.width = d + 'px';
      s.style.height = d + 'px';
      s.style.left = ((e.clientX || 0) - r.left - d / 2) + 'px';
      s.style.top = ((e.clientY || 0) - r.top - d / 2) + 'px';
      t.appendChild(s);
      setTimeout(function () { if (s.remove) s.remove(); }, 520);
    } catch (err) { }
  });
}

/* ---------- 电子乒乓 ---------- */
function bootPong(host) {
  const padLv = buffLv('pong_paddle');
  const lifeLv = buffLv('pong_life');
  const PADW = 64 + padLv * 14;
  let lives = 3 + lifeLv;
  let score = 0, left = 90, over = false;

  host.innerHTML = '<div class="gamewrap">' +
    '<div class="gamehead"><b>电子乒乓</b><span class="gclock" id="gclock">90s</span></div>' +
    '<div class="gstage"><canvas id="pongcv"></canvas></div>' +
    '<div class="row between" style="margin-top:8px;font-size:12px;color:var(--mute)">' +
    '<span>得分 <b id="gscore" style="color:var(--ink)">0</b></span>' +
    '<span>生命 <b id="glife" style="color:var(--ink)">' + lives + '</b></span></div></div>';

  const cv = document.getElementById('pongcv');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = Math.max(240, cv.clientWidth || 300), H = 300;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.height = H + 'px';
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);

  const pad = { w: Math.min(PADW, W * 0.6), h: 10, x: W / 2 };
  const ball = { x: W / 2, y: H / 2, r: 6, vx: 2.2, vy: -2.8 };

  function movePad(clientX) {
    const rect = cv.getBoundingClientRect();
    const x = (clientX - rect.left) / rect.width * W;
    pad.x = Math.max(pad.w / 2, Math.min(W - pad.w / 2, x));
  }
  cv.addEventListener('pointermove', function (e) { movePad(e.clientX); });
  cv.addEventListener('pointerdown', function (e) { movePad(e.clientX); });

  const draw = function () {
    const css = getComputedStyle(document.documentElement);
    const line = css.getPropertyValue('--line').trim() || '#eef1f4';
    const acc = css.getPropertyValue('--green').trim() || '#12a05b';
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = line;
    ctx.fillRect(pad.x - pad.w / 2, H - 22, pad.w, pad.h);
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = acc;
    ctx.fill();
  };

  const loop = function () {
    if (!GT || over) return;
    ball.x += ball.vx; ball.y += ball.vy;
    if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y < ball.r) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }
    if (ball.y > H - 22 - ball.r && ball.y < H - 12 &&
        Math.abs(ball.x - pad.x) < pad.w / 2 + ball.r && ball.vy > 0) {
      ball.vy = -Math.abs(ball.vy) * 1.03;
      ball.vx += (ball.x - pad.x) * 0.05;
      const sp = Math.hypot(ball.vx, ball.vy);
      const cap = 9;
      if (sp > cap) { ball.vx = ball.vx / sp * cap; ball.vy = ball.vy / sp * cap; }
      score += 1;
      const se = document.getElementById('gscore');
      if (se) se.textContent = score;
    }
    if (ball.y > H + 20) {
      lives -= 1;
      const le = document.getElementById('glife');
      if (le) le.textContent = lives;
      if (lives <= 0) { finishPong(); return; }
      ball.x = W / 2; ball.y = H / 2; ball.vx = 2.2; ball.vy = -2.8;
    }
    draw();
    GT.raf = requestAnimationFrame(loop);
  };

  function finishPong() {
    over = true;
    const got = Math.max(1, Math.floor(score / 3));
    addCoins(got);
    stopGames();
    const stage = document.querySelector('.gstage');
    if (stage) {
      stage.innerHTML = '<div class="gres" style="padding:70px 0">' +
        '<div class="big">' + score + '</div>' +
        '<div class="sub">接住 ' + score + ' 球 · 获得 ' + got + ' 代币</div></div>';
    }
    setTimeout(function () { toast('获得 ' + got + ' 代币'); }, 60);
  }

  GT = { raf: null, timer: null };
  GT.timer = setInterval(function () {
    if (over) return;
    left -= 1;
    const ce = document.getElementById('gclock');
    if (ce) ce.textContent = left + 's';
    if (left <= 0) finishPong();
  }, 1000);

  ball.vx = (Math.random() > 0.5 ? 1 : -1) * 2.2;
  GT.raf = requestAnimationFrame(loop);
}

/* ---------- 打地鼠 ---------- */
function bootWhack(host) {
  const extra = buffLv('whack_time') * 8;
  const stay = 620 + buffLv('whack_slow') * 180;
  let total = 30 + extra;
  let score = 0, over = false;
  let cur = -1;

  let cells = '';
  for (let i = 0; i < 9; i++) cells += '<div class="mole" data-i="' + i + '"></div>';

  host.innerHTML = '<div class="gamewrap">' +
    '<div class="gamehead"><b>打地鼠</b><span class="gclock" id="gclock">' + total + 's</span></div>' +
    '<div class="gstage"><div class="moles" style="padding:10px">' + cells + '</div></div>' +
    '<div class="row between" style="margin-top:8px;font-size:12px;color:var(--mute)">' +
    '<span>得分 <b id="gscore" style="color:var(--ink)">0</b></span></div></div>';

  const nodes = host.querySelectorAll('.mole');
  if (!nodes || nodes.length < 9) return;   // DOM 还没就绪就别启动，避免空指针
  nodes.forEach(function (n) {
    n.addEventListener('click', function () {
      if (over) return;
      if (Number(n.dataset.i) === cur) {
        score += 1;
        cur = -1;
        n.classList.remove('up');
        n.textContent = '';
        const se = document.getElementById('gscore');
        if (se) se.textContent = score;
      }
    });
  });

  const pop = function () {
    if (over) return;
    nodes.forEach(function (n) { n.classList.remove('up'); n.textContent = ''; });
    cur = Math.floor(Math.random() * 9);
    nodes[cur].classList.add('up');
    nodes[cur].textContent = '🐹';
  };

  const finish = function () {
    over = true;
    const got = Math.max(1, Math.floor(score / 4));
    addCoins(got);
    stopGames();
    const stage = document.querySelector('.gstage');
    if (stage) {
      stage.innerHTML = '<div class="gres" style="padding:70px 0">' +
        '<div class="big">' + score + '</div>' +
        '<div class="sub">打到 ' + score + ' 只 · 获得 ' + got + ' 代币</div></div>';
    }
    setTimeout(function () { toast('获得 ' + got + ' 代币'); }, 60);
  };

  GT = { timer: null, moleTimer: null, raf: null };
  GT.moleTimer = setInterval(pop, Math.max(520, stay));
  GT.timer = setInterval(function () {
    if (over) return;
    total -= 1;
    const ce = document.getElementById('gclock');
    if (ce) ce.textContent = total + 's';
    if (total <= 0) finish();
  }, 1000);
  pop();
}

/* ---------- 单词拼写（挖空填字母） ---------- */
function maskWord(en, ratio) {
  const chars = en.split('');
  const pos = [];
  for (let i = 0; i < chars.length; i++) {
    if (/[a-zA-Z]/.test(chars[i])) pos.push(i);
  }
  if (pos.length <= 1) {
    return { html: '<span class="mk">' + esc(en) + '</span>', answer: en.toLowerCase(), blanks: 0 };
  }
  let n = Math.round(pos.length * ratio);
  if (n < 1) n = 1;
  if (n > pos.length - 1) n = pos.length - 1;

  // 首字母永远留着（更好认）；4 个字母以内的短词连尾字母也留着
  let cand = pos.slice(1);
  if (pos.length <= 4) cand = cand.slice(0, -1);
  if (!cand.length) {
    return { html: '<span class="mk">' + esc(en) + '</span>', answer: en.toLowerCase(), blanks: 0 };
  }
  if (n > cand.length) n = cand.length;

  const pick = cand.slice();
  for (let i = pick.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = pick[i]; pick[i] = pick[j]; pick[j] = t;
  }
  const blank = {};
  pick.slice(0, n).forEach(function (i) { blank[i] = true; });

  let html = '', ans = '';
  for (let i = 0; i < chars.length; i++) {
    if (blank[i]) {
      html += '<span class="bl">_</span>';
      ans += chars[i].toLowerCase();
    } else {
      html += '<span class="mk">' + esc(chars[i]) + '</span>';
    }
  }
  return { html: html, answer: ans, blanks: n };
}

/* ---------- 答题进度（通用） ---------- */
function quizPool(kind, all) {
  const qd = store.data.quizDone || (store.data.quizDone = { poem: [], word: [] });
  const done = qd[kind] || [];
  return all.filter(function (x) { return done.indexOf(x.id) < 0; });
}
function markDone(kind, id) {
  const qd = store.data.quizDone || (store.data.quizDone = { poem: [], word: [] });
  const arr = qd[kind] || [];
  if (arr.indexOf(id) < 0) arr.push(id);
  qd[kind] = arr;
  store.save();
}

function bootWord(host) {
  const reveal = buffLv('word_reveal');
  const pool = quizPool('word', WORDS);
  let total = 90, right = 0, over = false, locked = false, answered = 0;
  const totalCount = pool.length;

  if (!pool.length) {
    host.innerHTML = '<div class="gamewrap"><div class="gres">' +
      '<div class="sub">单词已经全部拼完了 🎉</div>' +
      '<div class="btn gray" style="margin:16px auto 0;width:180px" data-act="resetquiz" data-k="word">重置单词题库</div>' +
      '</div></div>';
    return;
  }

  host.innerHTML = '<div class="gamewrap">' +
    '<div class="gamehead"><b>单词拼写</b><span class="gclock" id="gclock">' + total + 's</span></div>' +
    '<div class="gstage" id="wordbox" style="padding:16px"></div>' +
    '<div class="row between" style="margin-top:8px;font-size:12px;color:var(--mute)">' +
    '<span>拼对 <b id="gscore" style="color:var(--ink)">0</b></span>' +
    '<span id="gprog">剩余 ' + totalCount + ' 个</span></div></div>';

  const box = document.getElementById('wordbox');
  let idx = 0;
  let curAns = '';

  const draw = function () {
    if (idx >= pool.length) { finish(); return; }
    const w = pool[idx];
    const ratio = Math.max(0.15, 0.55 - reveal * 0.12);
    const mk = maskWord(w.en, ratio);
    curAns = mk.answer;

    box.innerHTML = '<div class="qt" style="font-size:16px;text-align:center;margin:6px 0 12px;color:var(--mute)">' +
      esc(w.zh) + '</div>' +
      '<div class="masked">' + mk.html + '</div>' +
      '<div class="xs mute" style="text-align:center;margin-top:6px">填出 ' + mk.blanks + ' 个空（按从左到右顺序）</div>' +
      '<input id="wordin" autocomplete="off" autocapitalize="off" spellcheck="false" ' +
      'style="width:100%;height:46px;margin-top:12px;border-radius:12px;background:var(--el2);' +
      'padding:0 14px;font-size:17px;text-align:center;letter-spacing:4px" placeholder="填缺失字母">' +
      '<div class="btn" style="margin-top:12px" data-act="wordsubmit">提交</div>' +
      '<div class="xs mute" style="text-align:center;margin-top:8px">回车也能提交 · 提示：' + (w.en.length) + ' 个字母</div>';

    const inp = document.getElementById('wordin');
    if (inp) {
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') submitWord(); });
      setTimeout(function () { try { inp.focus(); } catch (e2) { } }, 80);
    }
  };

  function submitWord() {
    if (over || locked) return;
    const inp = document.getElementById('wordin');
    const val = ((inp && inp.value) || '').replace(/[\s·_.]/g, '').toLowerCase();
    if (!val) { toast('先把空填上'); return; }
    locked = true;
    const w = pool[idx];
    const ok = val === curAns;
    if (ok) {
      right += 1;
      const se = document.getElementById('gscore');
      if (se) se.textContent = right;
    }
    markDone('word', w.id);
    answered += 1;
    const pe = document.getElementById('gprog');
    if (pe) pe.textContent = '剩余 ' + (totalCount - answered) + ' 个';
    if (!ok) toast('正确：' + w.en);
    else if (inp) { inp.style.borderColor = ''; }
    setTimeout(function () { locked = false; idx += 1; draw(); }, ok ? 300 : 1100);
  }

  function finish() {
    over = true;
    const got = Math.max(1, right);
    addCoins(got);
    stopGames();
    box.innerHTML = '<div class="gres"><div class="big">' + right + '</div>' +
      '<div class="sub">拼对 ' + right + ' 个 · 获得 ' + got + ' 代币</div></div>';
    setTimeout(function () { toast('获得 ' + got + ' 代币'); }, 60);
  }

  GT = { timer: setInterval(function () {
    if (over) return;
    total -= 1;
    const ce = document.getElementById('gclock');
    if (ce) ce.textContent = total + 's';
    if (total <= 0) finish();
  }, 1000) };
  GT.submit = submitWord;
  window.__wordSubmit = submitWord;

  draw();
}

/* ---------- 刮刮乐 ---------- */
/* 盘面 = 12 组三连（共 36 格）。每组 3 个相同数字，随机打散。
   刮开时按「数值」计数，任意数值凑够 3 个立即结算：
   - 三连是空 → 没中
   - 三连是数字 → 得该数字代币
   结果在刮的过程中才产生，票面本身不含答案。 */
const SCRATCH_COMP_LOSE = [0, 0, 4, 4, 5, 8, 8, 10, 10, 10, 15, 15];
const SCRATCH_COMP_SAFE = [8, 10, 4, 4, 5, 8, 8, 10, 10, 10, 15, 15];

function makeScratchBoard(lucky) {
  const comp = lucky ? SCRATCH_COMP_SAFE : SCRATCH_COMP_LOSE;
  const cells = [];
  comp.forEach(function (v) { cells.push(v, v, v); });
  for (let i = cells.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = cells[i]; cells[i] = cells[j]; cells[j] = t;
  }
  return cells;
}

function bootScratch(host) {
  const luck = buffLv('scratch_luck');

  if (!S.scBoard) {
    const p0 = planData();
    if ((p0.coins || 0) < 10) {
      host.innerHTML = '<div class="gamewrap"><div class="gres">' +
        '<div class="sub">代币不足（一张需要 10），先去打个卡吧</div>' +
        '<div class="btn gray" style="margin:16px auto 0;width:180px" data-act="backtrain">返回训练</div>' +
        '</div></div>';
      return;
    }
    addCoins(-10);
    S.scBoard = makeScratchBoard(!!luck);
    S.scOpen = {};
    S.scDone = false;
    S.scPay = 0;
  }

  const tally = function () {
    const cnt = {};
    Object.keys(S.scOpen).forEach(function (k) {
      const v = String(S.scBoard[Number(k)]);
      cnt[v] = (cnt[v] || 0) + 1;
    });
    return cnt;
  };

  const draw = function () {
    const opened = Object.keys(S.scOpen).length;
    const cells = S.scBoard.map(function (v, i) {
      const on = !!S.scOpen[i];
      const txt = on ? (v === 0 ? '空' : v) : '';
      return '<div class="scratchcell ' + (on ? 'open' : '') + (on && v === 0 ? ' blank' : '') +
        '" data-i="' + i + '">' + txt + '</div>';
    }).join('');

    let head = '已刮 ' + opened + ' / 36';
    let foot = '';

    if (S.scDone) {
      head = S.scPay > 0 ? '+' + S.scPay + ' 代币' : '没中';
      foot = '<div class="gres" style="padding:12px 0 2px">' +
        '<div class="big" style="font-size:28px">' + (S.scPay > 0 ? '+' + S.scPay : '0') + '</div>' +
        '<div class="sub">' + (S.scPay > 0
          ? '刮出三个 ' + S.scPay + '，代币已到账'
          : '先刮出了三个「空」，这张没中') + '</div></div>' +
        '<div class="btn" style="margin-top:10px" data-act="game" data-g="scratch">再来一张（10 代币）</div>';
    } else {
      foot = '<div class="xs mute" style="text-align:center;margin-top:10px">' +
        '任意三个相同数字即结算 · 三个「空」则没中</div>';
    }

    host.innerHTML = '<div class="gamewrap">' +
      '<div class="gamehead"><b>刮刮乐</b><span class="gclock">' + head + '</span></div>' +
      '<div class="gstage" style="padding:10px"><div class="scratchgrid">' + cells + '</div></div>' +
      foot + '</div>';
  };

  if (!host.__scBound) {
    host.__scBound = true;
    host.addEventListener('click', function (e) {
      if (S.scDone) return;
      const cell = e.target.closest('.scratchcell');
      if (!cell) return;
      const i = Number(cell.dataset.i);
      if (S.scOpen[i]) return;

      S.scOpen[i] = true;
      const cnt = tally();
      Object.keys(cnt).forEach(function (v) {
        if (!S.scDone && cnt[v] >= 3) {
          S.scDone = true;
          const val = Number(v);
          S.scPay = val;
          if (val > 0) addCoins(val);
        }
      });
      draw();
    });
  }

  draw();
}

/* 只刷新目标卡（避免输入框失焦） */
function refreshTargets() {
  const t = targets(store.data.profile, { trainDay: isTrainDay(S.date) });
  const el = $('tg_kcal');
  if (!el) return;
  el.textContent = t.kcal;
  const f = $('tg_formula');
  if (f) {
    f.textContent = 'BMR ' + t.bmr + ' × 活动系数 = 日常 ' + t.noEx + '｜' +
      (t.trainDay ? '训练 +' + t.trainKcal + ' = ' + t.tdee : '休息日不加训练 = ' + t.tdee) +
      '｜' + t.goalName + (t.deficitPct ? '（' + (t.deficitPct > 0 ? '−' + t.deficitPct : '+' + Math.abs(t.deficitPct)) + '%）' : '') +
      ' = ' + t.kcal;
  }
  const ng = document.querySelector('.ng');
  if (ng) {
    ng.innerHTML =
      '<div class="n"><b>' + t.protein + '</b><span>蛋白质 g</span><i>' + t.proteinKcalPct + '% 供能</i></div>' +
      '<div class="n"><b>' + t.carb + '</b><span>碳水 g</span><i>' + t.carbKcalPct + '% 供能</i></div>' +
      '<div class="n"><b>' + t.fat + '</b><span>脂肪 g</span><i>' + t.fatKcalPct + '% 供能</i></div>' +
      '<div class="n"><b>' + t.fiber + '</b><span>纤维 g</span><i>建议下限</i></div>' +
      '<div class="n"><b>' + t.water + '</b><span>饮水 ml</span><i>体重×35</i></div>' +
      '<div class="n"><b>' + t.proteinPerKg + '</b><span>蛋白/kg</span><i>每公斤</i></div>';
  }
}

/* 克数弹层局部刷新 */
function refreshSheet() {
  if (!S.pickFood) return;
  const f = S.pickFood;
  const p = calcFood(f, S.grams);
  const pv = document.querySelector('.preview');
  if (pv) {
    pv.innerHTML = '<div class="big">' + p.kcal + '<small>kcal</small></div>' +
      '<div class="det"><span>蛋白 ' + p.protein + 'g</span><span>碳水 ' + p.carb + 'g</span>' +
      '<span>脂肪 ' + p.fat + 'g</span><span>纤维 ' + p.fiber + 'g</span></div>';
  }
}

/* ================= 事件 ================= */
document.addEventListener('click', function (e) {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  switch (act) {
    case 'tab':
      S.view = el.dataset.v; render(); break;

    case 'prevday':
      S.date = addDays(S.date, -1); render(); break;

    case 'nextday':
      if (S.date === todayStr()) return;
      S.date = addDays(S.date, 1); render(); break;

    case 'addmeal':
      S.meal = el.dataset.meal; S.view = 'add'; S.kw = ''; render(); break;

    case 'openadd':
      S.meal = guessMeal(); S.view = 'add'; S.kw = ''; render(); break;

    case 'back':
      S.view = 'today'; S.pickFood = null; S.newFood = false; render(); break;

    case 'del': {
      const id = el.dataset.id;
      if (!confirm('删除这条记录？')) return;
      setLogs(S.date, getLogs(S.date).filter(function (r) { return r.id !== id; }));
      render(); break;
    }

    case 'cup': {
      const i = +el.dataset.i;
      const target = (i + 1) * 250;
      setWater(S.date, getWater(S.date) >= target ? i * 250 : target);
      render(); break;
    }

    case 'cat':
      S.cat = el.dataset.cat; S.kw = ''; render(); break;

    case 'setmeal':
      S.meal = el.dataset.meal; render(); break;

    case 'pick': {
      const f = listForAdd()[+el.dataset.i];
      if (!f) return;
      S.pickFood = f;
      S.grams = (f.serving && f.serving.grams) || 100;
      render(); break;
    }

    case 'closesheet':
      S.pickFood = null; render(); break;

    case 'gstep': {
      const d = +el.dataset.d;
      const step = (S.pickFood && S.pickFood.serving && S.pickFood.serving.grams)
        ? Math.max(5, Math.round(S.pickFood.serving.grams / 2)) : 10;
      let g = (Number(S.grams) || 0) + d * step;
      if (g < 1) g = 1;
      if (g > 5000) g = 5000;
      S.grams = g;
      const inp = $('grams'); if (inp) inp.value = g;
      refreshSheet(); break;
    }

    case 'qg':
      S.grams = +el.dataset.g;
      const gi = $('grams'); if (gi) gi.value = S.grams;
      refreshSheet(); break;

    case 'confirm': {
      const f = S.pickFood;
      if (!f) return;
      const g = Number(S.grams);
      if (!g || g <= 0) { toast('请输入克数'); return; }
      const p = calcFood(f, g);
      const list = getLogs(S.date);
      list.push({
        id: newId(), meal: S.meal, foodId: f.id, name: f.name, grams: p.grams,
        kcal: p.kcal, protein: p.protein, carb: p.carb, fat: p.fat, fiber: p.fiber, ts: Date.now()
      });
      list.sort(function (a, b) { return a.ts - b.ts; });
      setLogs(S.date, list);
      S.pickFood = null;
      render();
      toast('已记入' + (MEALS.filter(function (m) { return m.key === S.meal; })[0] || {}).name);
      break;
    }

    case 'newfood':
      S.newFood = true; render(); break;

    case 'closefood':
      S.newFood = false; render(); break;

    case 'savenewfood': {
      const name = ($('nf_name').value || '').trim();
      const kcal = Number($('nf_kcal').value);
      if (!name) { toast('请输入名称'); return; }
      if (!kcal) { toast('请输入热量'); return; }
      store.data.custom.unshift({
        id: 'cu' + Date.now().toString(36), name: name, cat: 'custom', py: '',
        kcal: kcal, protein: Number($('nf_p').value) || 0, carb: Number($('nf_c').value) || 0,
        fat: Number($('nf_f').value) || 0, fiber: Number($('nf_fb').value) || 0,
        serving: { unit: '份', grams: 100 }
      });
      store.save();
      S.newFood = false; S.cat = 'custom'; S.kw = '';
      render();
      toast('已保存');
      break;
    }

    case 'delfood': {
      const id = el.dataset.id;
      if (!confirm('删除该自定义食物？')) return;
      store.data.custom = store.data.custom.filter(function (f) { return f.id !== id; });
      store.save(); render(); break;
    }

    case 'range':
      S.range = +el.dataset.r; render(); break;

    case 'gender':
      store.data.profile.gender = el.dataset.g; store.save();
      document.querySelectorAll('.seg2 .s').forEach(function (x) {
        x.classList.toggle('on', x.dataset.g === el.dataset.g);
      });
      refreshTargets(); break;

    case 'activity':
      store.data.profile.activity = el.dataset.k; store.save();
      document.querySelectorAll('.opt').forEach(function (x) {
        x.classList.toggle('on', x.dataset.k === el.dataset.k);
      });
      refreshTargets(); break;

    case 'goal':
      store.data.profile.goal = el.dataset.k; store.save();
      document.querySelectorAll('.goals .g').forEach(function (x) {

      });

    case 'saveweight': {

      if (!v || v <= 0) { toast('请输入体重'); return; }

      store.data.weights = store.data.weights.filter(function (x) { return x.date !== d; });
      store.data.weights.push({ date: d, weight: Math.round(v * 10) / 10, ts: Date.now() });
      store.data.weights.sort(function (a, b) { return a.date < b.date ? -1 : 1; });

      store.save(); render(); toast('已记录'); break;

    case 'export': {

    }

    case 'import': {

      if (!confirm('确认用这份备份覆盖当前所有记录？')) return;

    }

    case 'checkupdate': {
      if (!navigator.onLine) { toast('现在没联网，连网后再试'); break; }
      toast('正在检查更新…');
      const done = function () { location.reload(); };
      if (typeof caches === 'undefined') { done(); break; }
      caches.keys()
        .then(function (keys) {
          return Promise.all(keys.map(function (k) { return caches.delete(k); }));
        })
        .then(done)
        .catch(done);
      break;
    }

    case 'about':
      alert('营养日记\n\nBMR 采用 Mifflin-St Jeor 公式，TDEE = BMR × 活动系数，目标热量在 TDEE 上按减脂/维持/增肌调整。\n\n食物营养值取自常见食物成分表，为估算值。\n\n本工具不构成医疗建议。');
      break;

    case 'theme':
      store.data.settings = store.data.settings || Object.assign({}, DEFAULT_SETTINGS);
      store.data.settings.theme = el.dataset.k;
      store.save(); applyAppearance(); renderKeepScroll(); break;

    case 'accent':
      store.data.settings = store.data.settings || Object.assign({}, DEFAULT_SETTINGS);
      store.data.settings.accent = el.dataset.k;
      store.save(); applyAppearance(); renderKeepScroll(); break;

    case 'toggleTrainDay':
      S.forceTrainDay = !isTrainDay();
      render(); toast(S.forceTrainDay ? '已切到训练日' : '已切到休息日');
      break;

    case 'setexp':
      store.data.profile.exp = el.dataset.k;
      store.save(); renderKeepScroll(); break;

    case 'setdeficit':
      store.data.profile.deficit = el.dataset.k;
      store.save(); renderKeepScroll(); break;

    case 'setskin':

      store.save(); applyAppearance(); renderKeepScroll();

      break;

    case 'alpha':
      store.data.settings = store.data.settings || Object.assign({}, DEFAULT_SETTINGS);
      store.data.settings.alpha = Number(el.dataset.v) || 1;
      store.save(); applyAppearance(); renderKeepScroll(); break;

    case 'bg':
      store.data.settings = store.data.settings || Object.assign({}, DEFAULT_SETTINGS);
      store.data.settings.bg = el.dataset.k;
      BG_IMAGE = '';
      try { localStorage.removeItem(KEY_IMG); } catch (e) { }
      store.save(); applyAppearance(); renderKeepScroll(); break;

    case 'bgimg':
      pickBgImage(); break;

    case 'bgimgclear':
      BG_IMAGE = '';
      try { localStorage.removeItem(KEY_IMG); } catch (e) { }
      applyAppearance(); renderKeepScroll(); toast('已恢复纯色背景'); break;

    case 'trainkw':
      S.train = el.dataset.k; render(); break;

    case 'kb': {
      const k = el.dataset.k;
      S.kbOpen = (S.kbOpen === k) ? '' : k;
      renderKeepScroll(); break;
    }

    case 'kbcat':
      S.kbCat = el.dataset.k;
      S.kbOpen = '';
      renderKeepScroll(); break;

    case 'wordsubmit':
      if (window.__wordSubmit) window.__wordSubmit();
      break;

    case 'resetquiz': {
      const k = el.dataset.k;
      if (!confirm('重置这个题库？已答过的会重新出现')) break;
      const qd = store.data.quizDone || (store.data.quizDone = { poem: [], word: [] });
      qd[k] = [];
      store.save();
      S.scratchPaid = false;
      render();
      toast('已重置');
      break;
    }

    case 'traintab':
      S.trainTab = el.dataset.k;
      render(); break;

    case 'setsplit': {
      const p = planData();
      p.split = el.dataset.k;
      p.cycle = 0;
      store.save(); render(); break;
    }

    case 'adddaygrp': {
      const list = TRAIN.map(function (g, i) { return (i + 1) + '. ' + g.name; }).join('\n');
      const ans = prompt('添加训练部位，输入编号（可只输一个）：\n\n' + list);
      if (!ans) break;
      const picks = String(ans).split(/[^0-9]+/).map(Number).filter(function (n) { return n >= 1 && n <= TRAIN.length; });
      if (!picks.length) { toast('编号不对'); break; }
      const p = planData();
      const idx = todayDayIndex();
      const key = p.split + '#' + idx;
      const cur = dayGroups(idx);
      picks.forEach(function (n) {
        const g = TRAIN[n - 1];
        if (cur.indexOf(g.key) < 0) cur.push(g.key);
      });
      p.days[key] = cur;
      store.save(); render(); break;
    }

    case 'deldaygrp': {
      const p = planData();
      const idx = todayDayIndex();
      const key = p.split + '#' + idx;
      const cur = dayGroups(idx);
      cur.splice(Number(el.dataset.i), 1);
      p.days[key] = cur;
      store.save(); render(); break;
    }

    case 'checkin': {
      const p = planData();
      const t = todayStr();
      if (p.checkins[t]) { toast('今天已经打过卡了'); break; }
      const streak = !!p.checkins[addDays(t, -1)];
      p.checkins[t] = dayGroups(todayDayIndex());
      p.cycle = (p.cycle || 0) + 1;
      store.save();
      addCoins(streak ? 15 : 10);
      render();
      toast(streak ? '打卡成功 +15（连打加成）' : '打卡成功 +10');
      break;
    }

    case 'claimweek': {
      const p = planData();
      const wk = weekKey(todayStr());
      if (p.weekPaid[wk]) { toast('本周已经领过了'); break; }
      if (weekCheckins().length < weeklyPlan().days) { toast('还没达标'); break; }
      p.weekPaid[wk] = true;
      store.save();
      addCoins(100);
      render();
      toast('本周目标达成 +100');
      break;
    }

    case 'game':
      S.gameKind = el.dataset.g || 'pong';
      if (S.gameKind === 'scratch') {
        S.scBoard = null; S.scOpen = {}; S.scDone = false; S.scPay = 0;
      }
      S.view = 'game';
      render(); break;

    case 'shop':
      S.view = 'shop';
      render(); break;

    case 'backtrain':
      S.view = 'train';
      S.trainTab = 'plan';
      render(); break;

    case 'buy': {
      const b = BUFFS.filter(function (x) { return x.id === el.dataset.id; })[0];
      if (!b) break;
      const p = planData();
      const lv = p.buffs[b.id] || 0;
      if (lv >= b.max) { toast('已经满级'); break; }
      const cost = b.cost * (lv + 1);
      if ((p.coins || 0) < cost) { toast('代币不够，还差 ' + (cost - p.coins)); break; }
      p.coins -= cost;
      p.buffs[b.id] = lv + 1;
      store.save(); render();
      toast(b.name + ' 升到 Lv.' + (lv + 1));
      break;
    }

    case 'addvideo': {
      const g = el.dataset.g;
      const title = prompt('给这个视频起个名字（会显示在清单里）：');
      if (!title) break;
      const link = prompt('粘贴 B 站视频链接或 BV 号：');
      if (!link) break;
      const m = String(link).match(/BV[0-9A-Za-z]{10}/);
      if (!m) { toast('没识别到 BV 号'); break; }
      const videos = Object.assign({}, store.data.videos || {});
      const key = 'list#' + g;
      const list = (videos[key] || []).concat([{ t: String(title), bv: m[0], up: '自定义', dur: 0, v: 0 }]);
      videos[key] = list;
      store.data.videos = videos;
      store.save(); render();
      toast('已添加');
      break;
    }

    case 'delvideo': {
      const g = el.dataset.g;
      const i = Number(el.dataset.i);
      const grp = TRAIN.filter(function (a) { return a.key === g; })[0];
      if (!grp) break;
      const ci = i - grp.items.length;
      const videos = Object.assign({}, store.data.videos || {});
      const list = (videos['list#' + g] || []).slice();
      if (ci < 0 || ci >= list.length) break;
      if (!confirm('删除「' + list[ci].t + '」这条自定义视频？')) break;
      list.splice(ci, 1);
      if (list.length) videos['list#' + g] = list; else delete videos['list#' + g];
      store.data.videos = videos;
      store.save(); render();
      toast('已删除');
      break;
    }

    case 'openvideo': {
      const href = el.dataset.href;
      if (!href) return;
      const w = window.open(href, '_blank', 'noopener');
      if (!w) toast('浏览器拦截了弹窗，请再点一次');
      break;
    }

    case 'bind': {
      const g = el.dataset.g;
      const i = Number(el.dataset.i);
      const grp = TRAIN.filter(function (a) { return a.key === g; })[0];
      if (!grp) return;
      const it = grp.items[i] || {};
      const key = g + '#' + i;
      const saved = (store.data.videos || {})[key];
      const curBv = (saved && saved.bv) || it.bv || '';
      const input = prompt(
        (it.t || it.q || '') + '\n\n粘贴 B 站视频链接或 BV 号：\n（清空后确定 = 恢复默认）',
        curBv ? biliUrl(curBv) : ''
      );
      if (input === null) return;
      const videos = Object.assign({}, store.data.videos || {});
      if (!String(input).trim()) {
        delete videos[key];
        store.data.videos = videos;
        store.save(); render(); toast('已恢复默认');
        return;
      }
      const m = String(input).match(/BV[0-9A-Za-z]{10}/);
      if (!m) { toast('没识别到 BV 号，请粘贴完整链接'); return; }
      videos[key] = { bv: m[0], t: it.t || it.q || '' };
      store.data.videos = videos;
      store.save(); render(); toast('已绑定这个视频');
      break;
    }

    case 'tsearch': {
      const box = $('tkw');
      const v = ((box && box.value) || '').trim();
      if (!v) { toast('先输入关键词'); return; }
      window.open('https://search.bilibili.com/all?keyword=' + encodeURIComponent(v), '_blank', 'noopener');
      break;
    }

    case 'fav': {
      const id = el.dataset.id;
      const fav = store.data.fav || [];
      const i = fav.indexOf(id);
      if (i > -1) fav.splice(i, 1); else fav.push(id);
      store.data.fav = fav;
      store.save();
      const nowOn = i === -1;
      el.classList.toggle('on', nowOn);
      el.textContent = nowOn ? '★' : '☆';
      if (S.cat === 'fav') render();
      break;
    }

    case 'copyyesterday': {
      const from = addDays(S.date, -1);
      const srcList = getLogs(from);
      if (!srcList.length) { toast('前一天没有记录'); return; }
      if (!confirm('把 ' + srcList.length + ' 条记录复制到 ' + dayLabel(S.date) + '？')) return;
      const list = getLogs(S.date);
      const base = Date.now();
      srcList.forEach(function (r, i) {
        list.push(Object.assign({}, r, { id: newId(), ts: base + i }));
      });
      list.sort(function (a, b) { return a.ts - b.ts; });
      setLogs(S.date, list);
      render();
      toast('已复制 ' + srcList.length + ' 条');
      break;
    }

    case 'noshow':
      break;
  }
});

/* 输入事件 */
document.addEventListener('input', function (e) {
  const t = e.target;

  if (t.id === 'kw') {
    S.kw = t.value;
    const list = listForAdd();
    const box = document.querySelector('.flist');
    if (box) {
      box.innerHTML = list.length ? list.map(foodRow).join('') : '<div class="empty">没找到，试试「自定义」</div>';
    }
    return;
  }

  if (t.id === 'grams') {
    S.grams = t.value;
    refreshSheet();
    return;
  }

  if (t.dataset && t.dataset.pf) {
    const key = t.dataset.pf;
    const v = Number(t.value);
    if (!isFinite(v) || v <= 0) return;
    const lim = { age: [10, 100], height: [120, 230], weight: [30, 250], targetWeight: [30, 250] }[key];
    store.data.profile[key] = Math.min(lim[1], Math.max(lim[0], v));
    store.save();
    refreshTargets();
  }
});

    location.reload();
  });
}

render();
</script>

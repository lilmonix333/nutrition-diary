<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#12a05b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="营养日记">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>营养日记</title>
<style>
:root{
  --acc:18,160,91;
  --acc2:36,201,122;
  --green:rgb(var(--acc));
  --green2:rgb(var(--acc2));
  --soft:rgba(var(--acc),.12);
  --blue:#3b82f6;--amber:#f59e0b;--purple:#a855f7;--red:#ef4444;
  --r:16px;
  --safeB:env(safe-area-inset-bottom,0px);

  /* 浅色 */
  --bg:#f4f6f8;
  --card:#ffffff;
  --el:#f4f6f8;
  --el2:#f8fafb;
  --line:#eef1f4;
  --track:#e7ecf1;
  --ink:#1c2024;
  --ink2:#4b5563;
  --mute:#9aa3ad;
  --mute2:#b6bec7;
  --solid:#1c2024;
  --tabbar:rgba(255,255,255,.96);
  --warn-bg:#fef3c7;
  --warn-ink:#92400e;
}

[data-theme="dark"]{
  --bg:#0f141a;
  --card:#181f27;
  --el:#1f2831;
  --el2:#1b232b;
  --line:#2a3441;
  --ink:#e9eef4;
  --ink2:#a9b4c0;
  --mute:#7b8794;
  --mute2:#5b6672;
  --solid:#2c3745;
  --tabbar:rgba(19,25,32,.94);
  --warn-bg:#3a3018;
  --warn-ink:#f0d189;
  --track:#2c3746;
  --soft:rgba(var(--acc),.22);
  --blue:#60a5fa;--amber:#fbbf24;--purple:#c084fc;--red:#f87171;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
input,button{font:inherit;color:inherit;border:none;background:none;outline:none}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* 布局 */
.wrap{padding:12px 14px calc(96px + var(--safeB));max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(28,32,36,.05)}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.mute{color:var(--mute)}
.sm{font-size:12px}
.xs{font-size:11px}
.green{color:var(--green)}
.red{color:var(--red)}
.bold{font-weight:700}
.hidden{display:none!important}

/* 顶部日期条 */
.datebar{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 12px}
.datebar .nav{width:38px;height:38px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink2);box-shadow:0 2px 8px rgba(28,32,36,.06)}
.datebar .nav.off{opacity:.35}
.datebar .mid{text-align:center}
.datebar .d1{font-size:17px;font-weight:700}
.datebar .d2{font-size:11px;color:var(--mute);margin-top:2px}

/* 环形 */
.herohead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.pill{font-size:12px;color:var(--green);background:var(--soft);padding:5px 11px;border-radius:99px}
.link{font-size:12px;color:var(--mute);padding:5px 2px}
.ringbox{position:relative;width:min(64vw,240px);margin:8px auto 14px;aspect-ratio:1/1}
.ringbox svg{width:100%;height:100%;display:block}
.ringmid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.ringmid .lbl{font-size:12px;color:var(--mute)}
.ringmid .num{font-size:44px;font-weight:800;line-height:1.05;letter-spacing:-1.5px;color:var(--green);margin:2px 0}
.ringmid .num.over{color:var(--red)}
.ringmid .u{font-size:12px;color:var(--mute);font-weight:400;letter-spacing:0;margin-left:3px}
.ringmid .sub{font-size:11px;color:var(--mute2)}

/* 进度条 */
.bar{height:7px;border-radius:7px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:7px;transition:width .35s ease}
.macro{margin-bottom:11px}
.macro:last-child{margin-bottom:0}
.mhead{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.mhead b{font-weight:700}
.mhead span{color:var(--mute);font-weight:400}

/* 餐次 */
.meal{padding:14px 16px}
.mealhead{display:flex;align-items:center;justify-content:space-between}
.mealhead .l{display:flex;align-items:center;gap:7px}
.mealhead .ic{font-size:16px}
.mealhead .nm{font-size:15px;font-weight:700}
.mealhead .cnt{font-size:11px;color:var(--mute);background:var(--el);padding:2px 7px;border-radius:6px}
.mealhead .hint{font-size:11px;color:var(--mute2)}
.mealhead .r{display:flex;align-items:center;gap:10px}
.mealhead .kc{font-size:14px;font-weight:700}
.mealhead .kcu{font-size:10px;color:var(--mute);margin-left:-6px}
.addbtn{width:27px;height:27px;border-radius:50%;background:var(--soft);color:var(--green);font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center}
.addbtn:active{background:rgba(var(--acc),.22)}
.items{margin-top:10px;border-top:1px solid var(--line);padding-top:2px}
.item{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--el2)}
.item:last-child{border-bottom:none;padding-bottom:0}
.item .nm{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:52vw}
.item .g{font-size:11px;color:var(--mute);margin-left:6px}
.item .kc{font-size:12px;color:var(--ink2)}
.del{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--mute2);font-size:18px;margin-left:4px}
.del:active{color:var(--red)}

/* 饮水 */
.cups{display:flex;flex-wrap:wrap;gap:8px}
.cup{width:38px;height:38px;border-radius:9px;background:var(--el);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--mute2)}
.cup.on{background:rgba(59,130,246,.16);color:var(--blue)}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--tabbar);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:var(--safeB)}
.tabbar .t{flex:1;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mute);font-size:10px}
.tabbar .t.on{color:var(--green)}
.tabbar .t svg{width:24px;height:24px}
.fab{position:fixed;right:16px;bottom:calc(74px + var(--safeB));z-index:41;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--green2),var(--green));color:#fff;font-size:28px;font-weight:300;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(18,160,91,.38)}
.fab:active{transform:scale(.95)}

/* 添加页 */
.pagehead{position:sticky;top:0;z-index:30;background:var(--bg);padding:10px 0 8px;margin:-12px -14px 0;padding-left:14px;padding-right:14px}
.ptitle{display:flex;align-items:center;gap:10px}
.back{width:34px;height:34px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink2);box-shadow:0 2px 8px rgba(28,32,36,.06)}
.ptitle .tt{font-size:17px;font-weight:700;flex:1}
.sumcard{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:var(--r);padding:12px 16px;margin:10px 0}
.sumcard .k{font-size:22px;font-weight:800}
.sumcard .k small{font-size:12px;font-weight:400;color:var(--mute)}
.ghost{font-size:12px;color:var(--green);background:var(--soft);padding:8px 12px;border-radius:99px}
.mealtabs{display:flex;gap:7px;margin-bottom:10px}
.mealtabs .mt{flex:1;height:36px;border-radius:10px;background:var(--card);display:flex;align-items:center;justify-content:center;gap:3px;font-size:13px;color:var(--ink2)}
.mealtabs .mt.on{background:var(--solid);color:#fff;font-weight:700}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:0 14px;height:42px;margin-bottom:10px}
.search input{flex:1;height:42px;font-size:15px}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 14px;border-radius:99px;background:var(--card);color:var(--ink2);font-size:13px}
.chip.on{background:var(--soft);color:var(--green);font-weight:700}
.flist{background:var(--card);border-radius:var(--r);overflow:hidden}
.f{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--el);gap:10px}
.f:last-child{border-bottom:none}
.f:active{background:rgba(var(--acc),.06)}
.f .nm{font-size:14px;font-weight:500}
.f .ds{font-size:11px;color:var(--mute);margin-top:2px}
.f .pl{width:26px;height:26px;flex:0 0 auto;border-radius:50%;background:var(--soft);color:var(--green);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center}
.fdel{font-size:11px;color:var(--red);padding:4px 2px;flex:0 0 auto}

/* 底部弹层 */
.mask{position:fixed;inset:0;background:rgba(16,20,24,.45);z-index:60;animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + var(--safeB));animation:up .22s ease;max-height:88vh;overflow:auto}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet h3{margin:0 0 4px;font-size:17px;display:flex;align-items:center;justify-content:space-between}
.sheet .x{color:var(--mute2);font-size:24px;line-height:1;padding:0 4px}
.per100{font-size:11px;color:var(--mute);margin-bottom:14px}
.gramrow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.step{width:44px;height:44px;border-radius:12px;background:var(--el);font-size:20px;display:flex;align-items:center;justify-content:center}
.step:active{background:var(--line)}
.ginput{flex:1;height:44px;border-radius:12px;background:var(--el2);font-size:22px;font-weight:700;text-align:center}
.quicks{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.quick{padding:7px 13px;border-radius:99px;background:var(--el);color:var(--ink2);font-size:13px}
.quick:active{background:var(--soft);color:var(--green)}
.preview{background:rgba(var(--acc),.06);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.preview .big{font-size:30px;font-weight:800;color:var(--green);line-height:1}
.preview .big small{font-size:12px;font-weight:400;color:var(--mute);margin-left:4px}
.preview .det{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-top:8px}
.btn{height:46px;border-radius:23px;background:linear-gradient(135deg,var(--green2),var(--green));color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(18,160,91,.3)}
.btn:active{opacity:.86}
.btn.gray{background:var(--el);color:var(--ink);box-shadow:none}
.field{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.field:last-of-type{border-bottom:none}
.field .lb{font-size:14px;color:var(--ink2)}
.field input{text-align:right;font-size:16px;width:130px}
.field .un{font-size:12px;color:var(--mute);width:26px;text-align:right}

/* 报告 */
.seg{display:flex;background:var(--el);border-radius:99px;padding:3px}
.seg .s{padding:5px 13px;border-radius:99px;font-size:12px;color:var(--mute)}
.seg .s.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 5px rgba(0,0,0,.07)}
.chart{position:relative;display:flex;align-items:flex-end;height:150px;margin:16px 0 0}
.chart .col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.chart .b{width:52%;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,rgba(var(--acc),.55),var(--green));min-height:2px}
.chart .b.over{background:linear-gradient(180deg,#fca5a5,#ef4444)}
.chart .b.zero{background:var(--line)}
.tline{position:absolute;left:0;right:0;border-top:1px dashed #c8d0d8;z-index:2}
.tline b{position:absolute;right:0;top:-16px;font-size:10px;color:var(--mute);font-weight:400}
.xlabels{display:flex;margin-top:6px}
.xlabels span{flex:1;text-align:center;font-size:10px;color:var(--mute)}
.legend{display:flex;justify-content:center;gap:14px;margin-top:12px}
.legend i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px;vertical-align:1px}
.grid2{display:flex;flex-wrap:wrap}
.grid2 .gi{width:50%;padding:8px 0}
.grid2 .v{font-size:21px;font-weight:800;line-height:1.2}
.grid2 .n{font-size:12px;color:var(--ink2);margin-top:1px}
.grid2 .t{font-size:10px;color:var(--mute)}
.three{display:flex;gap:8px}
.three .a{flex:1;text-align:center;background:var(--el2);border-radius:12px;padding:10px 0}
.three .a b{display:block;font-size:22px;font-weight:800;line-height:1.2}
.three .a span{font-size:10px;color:var(--mute)}
.ratiobar{margin-bottom:11px}
.ratiobar .h{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.ratio-pct{font-weight:700}
.wline{display:flex;align-items:baseline;justify-content:space-between}
.wline .wv{font-size:32px;font-weight:800;line-height:1}
.wline .wv small{font-size:12px;color:var(--mute);font-weight:400;margin-left:4px}
.wchg{font-size:13px;padding:4px 10px;border-radius:99px;background:var(--el);color:var(--ink2)}
.wchg.down{background:var(--soft);color:var(--green)}
.wchg.up{background:rgba(239,68,68,.15);color:var(--red)}
.adv{display:flex;gap:8px;margin-bottom:8px}
.adv i{color:var(--green);font-style:normal;line-height:1.5}
.adv p{margin:0;font-size:13px;color:var(--ink2);line-height:1.55}

/* 我的 */
.seg2{display:flex;background:var(--el);border-radius:12px;padding:3px;margin-bottom:4px}
.seg2 .s{flex:1;height:34px;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:14px;color:var(--ink2)}
.seg2 .s.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 6px rgba(0,0,0,.07)}
.opt{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;background:var(--el2);margin-bottom:7px;border:1.5px solid transparent}
.opt.on{background:var(--soft);border-color:var(--green)}
.opt .n{font-size:14px;font-weight:700}
.opt .d{font-size:10px;color:var(--mute);margin-top:1px}
.opt .x{font-size:12px;color:var(--mute)}
.opt.on .x{color:var(--green)}
.goals{display:flex;gap:8px}
.goals .g{flex:1;text-align:center;padding:11px 6px;border-radius:12px;background:var(--el2);border:1.5px solid transparent}
.goals .g.on{background:var(--soft);border-color:var(--green)}
.goals .g .n{font-size:15px;font-weight:800}
.goals .g .d{font-size:9px;color:var(--mute);margin-top:4px;line-height:1.35}
.rescard{background:linear-gradient(160deg,var(--card),rgba(var(--acc),.07))}
.kbig{text-align:center;padding:4px 0 8px}
.kbig b{font-size:42px;font-weight:800;color:var(--green);letter-spacing:-1px;line-height:1}
.kbig small{font-size:12px;color:var(--mute);margin-left:6px;font-weight:400}
.formula{font-size:10.5px;color:var(--mute);text-align:center;line-height:1.6;margin-bottom:12px}
.ng{display:flex;flex-wrap:wrap}
.ng .n{width:33.33%;text-align:center;padding:7px 0}
.ng .n b{display:block;font-size:16px;font-weight:700}
.ng .n span{display:block;font-size:10px;color:var(--ink2)}
.ng .n i{display:block;font-size:9px;color:var(--mute2);font-style:normal}
.wrow2{display:flex;gap:8px;margin-bottom:10px}
.wrow2 input{flex:1;height:42px;background:var(--el2);border-radius:10px;padding:0 12px;font-size:15px}
.wrow2 .sb{width:74px;height:42px;border-radius:10px;background:var(--solid);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
.wlist .w{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--el2);font-size:13px}
.wlist .w:last-child{border-bottom:none}
.rbtn{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px}
.rbtn:last-child{border-bottom:none}
.rbtn:active{opacity:.6}
.arrow{color:var(--mute2);font-size:18px}
.empty{text-align:center;color:var(--mute2);font-size:12px;padding:22px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + var(--safeB));z-index:99;background:rgba(28,32,36,.92);color:#fff;font-size:13px;padding:9px 18px;border-radius:99px;animation:fade .18s;pointer-events:none;white-space:nowrap}
.banner{position:fixed;left:0;right:0;top:0;z-index:98;background:var(--warn-bg);color:var(--warn-ink);font-size:12px;line-height:1.5;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;text-align:center}


/* ========== 主题 / 皮肤 ========== */
body{background-color:var(--bg);background-size:cover;background-position:center;background-repeat:no-repeat;background-attachment:scroll}
[data-theme="dark"] .card,[data-theme="dark"] .sumcard,[data-theme="dark"] .flist{box-shadow:none}
[data-theme="dark"] .mask{background:rgba(0,0,0,.6)}

.themebar{display:flex;background:var(--el);border-radius:12px;padding:3px;margin-bottom:14px}
.themebar .s{flex:1;height:34px;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:13px;color:var(--mute)}
.themebar .s.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 6px rgba(0,0,0,.1)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:50%;position:relative;border:2px solid transparent;transition:transform .15s}
.sw:active{transform:scale(.92)}
.sw.on{border-color:var(--ink)}
.sw.on::after{content:'';position:absolute;inset:5px;border-radius:50%;border:2px solid rgba(255,255,255,.9)}
.bgopts{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}
.bgopt{width:64px;text-align:center}
.bgprev{width:64px;height:52px;border-radius:12px;border:2px solid transparent;background:var(--el);overflow:hidden}
.bgopt.on .bgprev{border-color:var(--acc)}
.bgopt span{display:block;font-size:10px;color:var(--mute);margin-top:4px}
.bgopt.on span{color:var(--green);font-weight:700}

/* 收藏星标 */
.star{width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--mute2);flex:0 0 auto}
.star.on{color:#f59e0b}

/* 营养缺口提示 */
.tipbox{margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(var(--acc),.08);border:1px solid rgba(var(--acc),.18)}
.tipbox .tr{display:flex;gap:6px;font-size:12px;color:var(--ink2);line-height:1.6}
.tipbox .tr b{color:var(--green)}

/* 训练页 */
.kwgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 16px}
.kwtile{background:var(--card);border-radius:14px;padding:11px 4px 9px;text-align:center;border:1.5px solid transparent;transition:transform .12s}
.kwtile:active{transform:scale(.96)}
.kwtile .ki{display:flex;width:26px;height:26px;border-radius:9px;margin:0 auto 5px;align-items:center;justify-content:center;font-size:12px;font-weight:800;background:var(--el);color:var(--ink2)}
.kwtile.on .ki{background:rgba(var(--acc),.22);color:var(--green)}
.kwtile .kn{display:block;font-size:13.5px;font-weight:700}
.kwtile .kc{display:block;font-size:9.5px;color:var(--mute);margin-top:2px}
.kwtile.on{background:var(--soft);border-color:rgba(var(--acc),.42)}
.kwtile.on .kn{color:var(--green)}
.kwtile.on .kc{color:var(--green);opacity:.8}

.grpbar{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 6px}
.grpbar b{font-size:15px}
.grpbar span{font-size:10.5px;color:var(--mute)}

.rec{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:none}
.rec:active{opacity:.6}
.rec .ico{width:46px;height:34px;flex:0 0 auto;border-radius:9px;background:rgba(251,114,153,.15);color:#fb7299;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.rec .ico.q{background:var(--el2);color:var(--mute);font-size:15px;font-weight:400}
.rec .rt{flex:1;min-width:0}
.rec .t1{display:block;font-size:14px;font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .t2{display:block;font-size:10.5px;color:var(--mute);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .tag{font-size:9.5px;padding:1px 5px;border-radius:4px;background:rgba(251,114,153,.16);color:#fb7299;margin-right:5px;font-weight:700}
.rec .tag.q{background:var(--el2);color:var(--mute)}
.rec .more{width:32px;height:32px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--mute2);font-size:16px}
.rec .more:active{color:var(--green)}
.tsearch{display:flex;gap:8px}
.tsearch input{flex:1;height:42px;background:var(--el2);border-radius:12px;padding:0 12px;font-size:15px}
.tsearch .gb{width:64px;height:42px;border-radius:12px;background:var(--solid);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
.note{font-size:10.5px;color:var(--mute);line-height:1.75;text-align:center;padding:4px 16px 18px}
/* 分段 tab */
.seg3{display:flex;background:var(--el);border-radius:12px;padding:3px;margin-bottom:12px}
.seg3 .s{flex:1;height:34px;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:13px;color:var(--mute)}
.seg3 .s.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 6px rgba(0,0,0,.1)}

/* 代币条 */
.coinbar{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,rgba(var(--acc),.14),rgba(var(--acc),.05));border-radius:14px;padding:12px 14px;margin-bottom:12px}
.coinbar .cb{display:flex;align-items:baseline;gap:5px}
.coinbar b{font-size:22px;font-weight:800;color:var(--green);line-height:1}
.coinbar .cl{font-size:11px;color:var(--mute)}
.coinbar .cw{font-size:11px;color:var(--ink2);text-align:right;line-height:1.5}

/* 分化选择 */
.splits{display:flex;gap:8px;margin-bottom:6px}
.split{flex:1;padding:10px;border-radius:12px;background:var(--el2);text-align:center;border:1.5px solid transparent}
.split.on{background:var(--soft);border-color:rgba(var(--acc),.4)}
.split b{display:block;font-size:14px}
.split span{display:block;font-size:10px;color:var(--mute);margin-top:2px}

/* 计划卡 */
.plantags{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 12px}
.ptag{display:flex;align-items:center;gap:5px;padding:7px 11px;border-radius:99px;background:rgba(var(--acc),.12);color:var(--green);font-size:12.5px;font-weight:600}
.ptag .x{font-size:14px;opacity:.55;padding:0 1px}
.ptag.add{background:var(--el2);color:var(--mute);font-weight:400}
.goalbox{background:var(--el2);border-radius:12px;padding:11px 13px;margin-bottom:12px}
.goalbox .gt{font-size:13px;font-weight:700;margin-bottom:6px}
.goalbox li{font-size:11.5px;color:var(--ink2);line-height:1.85;margin-left:14px}
.progbar{height:8px;border-radius:8px;background:var(--el);overflow:hidden;margin:8px 0 4px}
.progbar i{display:block;height:100%;background:var(--green);border-radius:8px;transition:width .3s}

/* 游戏 */
.gamewrap{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;position:relative}
.gamehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.gamehead b{font-size:14px}
.gclock{font-size:12px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums}
.gstage{position:relative;width:100%;border-radius:12px;overflow:hidden;background:var(--el2)}
#pongcv{display:block;width:100%;height:300px;touch-action:none}
.moles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mole{aspect-ratio:1/1;border-radius:12px;background:var(--el);display:flex;align-items:center;justify-content:center;font-size:26px;user-select:none}
.mole.up{background:rgba(var(--acc),.22)}
.quiz .qt{font-size:15px;line-height:1.7;margin:6px 0 12px;font-weight:600}
.quiz .qo{padding:11px 13px;border-radius:11px;background:var(--el2);font-size:14px;margin-bottom:8px;border:1.5px solid transparent}
.quiz .qo:active{background:var(--soft)}
.quiz .qo.ok{background:rgba(16,185,129,.18);border-color:#10b981}
.quiz .qo.bad{background:rgba(239,68,68,.16);border-color:var(--red)}
.gres{text-align:center;padding:16px 0}
.gres .big{font-size:34px;font-weight:800;color:var(--green);line-height:1}
.gres .sub{font-size:12px;color:var(--mute);margin-top:6px}

/* 商店 */
.shopitem{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.shopitem:last-child{border-bottom:none}
.shopitem .si{flex:1;min-width:0}
.shopitem .sn{font-size:13.5px;font-weight:600}
.shopitem .sd{font-size:10.5px;color:var(--mute);margin-top:2px}
.shopitem .buy{padding:6px 12px;border-radius:99px;background:var(--soft);color:var(--green);font-size:12px;font-weight:700;flex:0 0 auto}
.shopitem .buy.full{background:var(--el2);color:var(--mute)}
.shopitem .buy:active{opacity:.7}


/* 体重迷你趋势 */
.spark{width:100%;height:48px;display:block;margin-top:8px}

/* 添加页快捷操作 */
.quickacts{display:flex;gap:8px;margin-bottom:10px}
.qa{flex:1;height:58px;background:var(--card);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--ink2);border:1.5px solid transparent}
.qa span{font-size:17px;line-height:1}
.qa:active{background:var(--soft);border-color:rgba(var(--acc),.3)}


/* 扫码 */
.scanbox{position:fixed;left:0;right:0;top:0;bottom:0;z-index:120;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center}
.scanbox video{width:100%;max-height:68vh;object-fit:cover}
.scanframe{position:absolute;width:74%;height:26%;border:2px solid #4ade80;border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.5)}
.scanhint{position:relative;color:#fff;font-size:13px;margin-top:16px;z-index:2}
.scanbtns{position:relative;margin-top:16px;z-index:2}

/* 小知识 */
.kbchips{display:flex;gap:6px;margin:8px 0 10px;overflow-x:auto;scrollbar-width:none}
.kbchips::-webkit-scrollbar{display:none}
.kbchip{flex:0 0 auto;padding:5px 12px;border-radius:99px;background:var(--el2);color:var(--mute);font-size:12px}
.kbchip.on{background:var(--soft);color:var(--green);font-weight:700}
.kbi{border-bottom:1px solid var(--line);padding:11px 0}
.kbi:last-child{border-bottom:none;padding-bottom:0}
.kbh{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;line-height:1.4}
.kbh .kc2{font-size:9.5px;padding:1px 5px;border-radius:4px;background:var(--el2);color:var(--mute);font-weight:400;flex:0 0 auto}
.kbh .karr{margin-left:auto;color:var(--mute2);font-size:15px;flex:0 0 auto;transition:transform .15s}
.kbh.open .karr{transform:rotate(90deg)}
.kbb{margin:7px 0 0;font-size:12.5px;line-height:1.8;color:var(--ink2)}

/* ---------------- 日期 ---------------- */
function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function fmtDate(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function parseDate(s) { const p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function todayStr() { return fmtDate(new Date()); }
function addDays(dateStr, n) { const d = parseDate(dateStr); d.setDate(d.getDate() + n); return fmtDate(d); }
const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
function dayLabel(s) {
  const t = todayStr();
  if (s === t) return '今天';
  if (s === addDays(t, -1)) return '昨天';
  if (s === addDays(t, 1)) return '明天';
  const d = parseDate(s);
  return (d.getMonth() + 1) + '月' + d.getDate() + '日 周' + WEEK[d.getDay()];
}
function shortDate(s) { const d = parseDate(s); return (d.getMonth() + 1) + '/' + d.getDate(); }
function weekLabel(s) { return '周' + WEEK[parseDate(s).getDay()]; }
function lastNDates(n, end) {
  const e = end || todayStr(); const out = [];
  for (let i = n - 1; i >= 0; i--) out.push(addDays(e, -i));
  return out;
}

/* ---------------- 营养计算 ---------------- */
function num(v, fb) { const n = Number(v); return isFinite(n) && n > 0 ? n : fb; }

function bmr(p) {
  const w = num(p.weight, 70), h = num(p.height, 175), a = num(p.age, 25);
  const base = 10 * w + 6.25 * h - 5 * a;
  return Math.round(p.gender === 'female' ? base - 161 : base + 5);
}
function actFactor(p) {
  const f = ACTIVITY.filter(function (x) { return x.key === (p.activity || 'moderate'); })[0];
  return f ? f.factor : 1.55;
}
function tdee(p) { return Math.round(bmr(p) * actFactor(p)); }
function goalOf(p) {
  return GOALS.filter(function (x) { return x.key === (p.goal || 'maintain'); })[0] || GOALS[1];
}
function targets(p) {
  const pr = p || DEFAULT_PROFILE;
  const base = bmr(pr), total = tdee(pr), goal = goalOf(pr);
  let kcal = Math.round(total * (1 + goal.adjust));
  kcal = Math.max(kcal, Math.round(base * 1.1), 1200);
  const weight = num(pr.weight, 70);
  let protein = Math.round(weight * goal.proteinPerKg);
  protein = Math.min(protein, Math.round((kcal * 0.4) / 4));
  const fat = Math.round((kcal * goal.fatRatio) / 9);
  let carb = Math.round((kcal - protein * 4 - fat * 9) / 4);
  if (carb < 50) carb = 50;
  const fiber = Math.round(Math.min(40, Math.max(25, (kcal / 1000) * 14)));
  return {
    kcal: kcal, protein: protein, carb: carb, fat: fat, fiber: fiber,
    water: Math.round(weight * 35), bmr: base, tdee: total,
    goalName: goal.name, goalDesc: goal.desc, proteinPerKg: goal.proteinPerKg,
    proteinKcalPct: Math.round(((protein * 4) / kcal) * 100),
    carbKcalPct: Math.round(((carb * 4) / kcal) * 100),
    fatKcalPct: Math.round(((fat * 9) / kcal) * 100)
  };
}
function calcFood(food, grams) {
  const g = num(grams, 100) / 100;
  return {
    grams: Math.round(num(grams, 100)),
    kcal: Math.round((food.kcal || 0) * g),
    protein: Math.round((food.protein || 0) * g * 10) / 10,
    carb: Math.round((food.carb || 0) * g * 10) / 10,
    fat: Math.round((food.fat || 0) * g * 10) / 10,
    fiber: Math.round((food.fiber || 0) * g * 10) / 10
  };
}
function sumRecords(list) {
  const o = { kcal: 0, protein: 0, carb: 0, fat: 0, fiber: 0 };
  (list || []).forEach(function (r) {
    o.kcal += r.kcal || 0; o.protein += r.protein || 0; o.carb += r.carb || 0;
    o.fat += r.fat || 0; o.fiber += r.fiber || 0;
  });
  ['protein', 'carb', 'fat', 'fiber'].forEach(function (k) { o[k] = Math.round(o[k] * 10) / 10; });
  o.kcal = Math.round(o.kcal);
  return o;
}
function pct(v, t) { if (!t || t <= 0) return 0; return Math.min(100, Math.round((v / t) * 100)); }
function searchFoods(kw) {
  const q = String(kw || '').trim().toLowerCase();
  if (!q) return [];
  return FOODS.filter(function (f) {
    return f.name.toLowerCase().indexOf(q) > -1 || (f.py && f.py.indexOf(q) > -1);
  });
}

const $ = function (id) { return document.getElementById(id); };
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
let toastTimer = null;
function toast(msg) {
  const old = document.querySelector('.toast');
  if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.remove(); }, 1600);
}
function newId() { return 'r' + Date.now().toString(36) + Math.floor(Math.random() * 999).toString(36); }
function getLogs(d) { return (store.data.logs[d] || []).slice(); }
function setLogs(d, list) {
  if (!list.length) delete store.data.logs[d]; else store.data.logs[d] = list;
  store.save();
}
function allFoods() { return FOODS.concat(store.data.custom); }
function foodById(id) {
  return FOODS.filter(function (f) { return f.id === id; })[0] ||
    store.data.custom.filter(function (f) { return f.id === id; })[0] || null;
}
function getWater(d) { return Number(store.data.water[d]) || 0; }
function setWater(d, v) {
  v = Math.max(0, Math.round(v));
  if (v === 0) delete store.data.water[d]; else store.data.water[d] = v;
  store.save();
}
function freqFoodIds(limit) {
  const count = {};
  lastNDates(30).forEach(function (d) {
    (store.data.logs[d] || []).forEach(function (r) {
      if (!r.foodId) return;
      if (!count[r.foodId]) count[r.foodId] = { c: 0, last: 0 };
      count[r.foodId].c++;
      count[r.foodId].last = Math.max(count[r.foodId].last, r.ts || 0);
    });
  });
  return Object.keys(count).sort(function (a, b) {
    return count[b].c - count[a].c || count[b].last - count[a].last;
  }).slice(0, limit || 14);
}
function guessMeal() {
  const h = new Date().getHours();
  if (h < 10) return 'breakfast';
  if (h < 15) return 'lunch';
  if (h < 21) return 'dinner';
  return 'snack';
}

function sheetGrams() {
  const f = S.pickFood;
  if (!f) return '';
  const g = Number(S.grams) || 0;
  const p = calcFood(f, g);
  const q = [];
  const push = function (label, grams) {
    const gg = Math.round(grams);
    if (gg > 0 && !q.some(function (x) { return x.g === gg; })) q.push({ l: label, g: gg });
  };
  if (f.serving && f.serving.grams) {
    const s = f.serving.grams, u = f.serving.unit;
    push('0.5' + u, s * 0.5); push('1' + u, s); push('1.5' + u, s * 1.5); push('2' + u, s * 2);
  }

/* ================= 报告 ================= */
function viewReport() {
  const t = targets(store.data.profile);
  const range = S.range;
  const dates = lastNDates(range);
  const rows = dates.map(function (d) {
    const s = sumRecords(getLogs(d));
    return {
      date: d, kcal: s.kcal, protein: s.protein, carb: s.carb, fat: s.fat, fiber: s.fiber,
      count: getLogs(d).length,
      label: range === 7 ? weekLabel(d) : shortDate(d)
    };
  });

  let maxK = t.kcal;
  rows.forEach(function (r) { if (r.kcal > maxK) maxK = r.kcal; });
  maxK = Math.max(maxK, 1);

  const cols = rows.map(function (r, i) {
    const h = Math.round((r.kcal / maxK) * 100);
    const cls = r.kcal === 0 ? 'zero' : (r.kcal > t.kcal * 1.1 ? 'over' : '');
    const show = range === 7 || i % 5 === 4 || i === rows.length - 1;
    return '<div class="col"><div class="b ' + cls + '" style="height:' + (r.kcal > 0 ? Math.max(2, h) : 2) + '%"></div></div>';
  }).join('');
  const labels = rows.map(function (r, i) {
    const show = range === 7 || i % 5 === 4 || i === rows.length - 1;
    return '<span>' + (show ? r.label : '') + '</span>';
  }).join('');

  const logged = rows.filter(function (r) { return r.count > 0; });
  const n = logged.length || 1;
  const tot = logged.reduce(function (a, r) {
    a.kcal += r.kcal; a.protein += r.protein; a.carb += r.carb; a.fat += r.fat; a.fiber += r.fiber; return a;
  }, { kcal: 0, protein: 0, carb: 0, fat: 0, fiber: 0 });
  const avg = {
    kcal: Math.round(tot.kcal / n), protein: Math.round(tot.protein / n * 10) / 10,
    carb: Math.round(tot.carb / n * 10) / 10, fat: Math.round(tot.fat / n * 10) / 10,
    fiber: Math.round(tot.fiber / n * 10) / 10
  };
  const onTarget = logged.filter(function (r) { return Math.abs(r.kcal - t.kcal) <= t.kcal * 0.1; }).length;
  const proteinOK = logged.filter(function (r) { return r.protein >= t.protein * 0.9; }).length;

  const pk = avg.protein * 4, ck = avg.carb * 4, fk = avg.fat * 9;
  const sumK = (pk + ck + fk) || 1;
  const ratio = [
    { n: '蛋白质', p: Math.round(pk / sumK * 100), c: 'var(--blue)', t: t.proteinKcalPct },
    { n: '碳水', p: Math.round(ck / sumK * 100), c: 'var(--amber)', t: t.carbKcalPct },
    { n: '脂肪', p: Math.round(fk / sumK * 100), c: 'var(--purple)', t: t.fatKcalPct }
  ];

  const ws = store.data.weights;
  let w = null, delta = 0;
  if (ws.length) {
    w = ws[ws.length - 1];
    if (ws.length > 1) delta = Math.round((w.weight - ws[0].weight) * 10) / 10;
  }

  const tips = [];
  if (!logged.length) {
    tips.push('还没有记录，先去「今日」添加一餐吧');
  } else {
    if (avg.kcal > t.kcal * 1.1) tips.push('日均热量超出目标 ' + (avg.kcal - t.kcal) + ' kcal，注意烹饪油与加餐分量');
    else if (avg.kcal < t.kcal * 0.8) tips.push('日均热量偏低，长期过低会掉肌肉、拖慢代谢，建议补足到 ' + t.kcal + ' kcal');
    if (avg.protein < t.protein * 0.8) tips.push('蛋白质日均 ' + avg.protein + 'g，低于目标 ' + t.protein + 'g，可增加鸡胸、蛋、奶、豆制品');
    if (avg.fiber < t.fiber * 0.7) tips.push('膳食纤维不足，多吃蔬菜、全谷物与水果');
    if (avg.fat > t.fat * 1.3) tips.push('脂肪偏高，减少油炸食品与坚果过量摄入');
    if (!tips.length) tips.push('各项指标都在目标区间内，保持这个节奏');
  }

  return '<div class="wrap">' +
    '<div class="card"><div class="row between">' +
    '<b style="font-size:15px">热量趋势</b>' +
    '<div class="seg">' + [7, 30].map(function (r) {
      return '<div class="s ' + (range === r ? 'on' : '') + '" data-act="range" data-r="' + r + '">近' + r + '天</div>';
    }).join('') + '</div></div>' +
    '<div class="chart"><div class="tline" style="bottom:' + Math.min(100, Math.round(t.kcal / maxK * 100)) + '%"><b>目标 ' + t.kcal + '</b></div>' + cols + '</div>' +
    '<div class="xlabels">' + labels + '</div>' +
    '<div class="legend sm mute"><span><i style="background:var(--green)"></i>达标</span>' +
    '<span><i style="background:#f87171"></i>超出10%</span><span><i style="background:#e5e9ee"></i>未记录</span></div></div>' +

    '<div class="card"><div class="row between" style="margin-bottom:6px">' +
    '<b style="font-size:15px">记录日均</b><span class="sm mute">' + logged.length + ' 天有记录</span></div>' +
    '<div class="grid2">' +
    '<div class="gi"><div class="v">' + avg.kcal + '</div><div class="n">热量 kcal</div><div class="t">目标 ' + t.kcal + '</div></div>' +
    '<div class="gi"><div class="v">' + avg.protein + '</div><div class="n">蛋白 g</div><div class="t">目标 ' + t.protein + '</div></div>' +
    '<div class="gi"><div class="v">' + avg.carb + '</div><div class="n">碳水 g</div><div class="t">目标 ' + t.carb + '</div></div>' +
    '<div class="gi"><div class="v">' + avg.fat + '</div><div class="n">脂肪 g</div><div class="t">目标 ' + t.fat + '</div></div>' +
    '</div></div>' +

    '<div class="card"><b style="font-size:15px">达成情况</b>' +
    '<div class="three" style="margin-top:10px">' +
    '<div class="a"><b>' + logged.length + '</b><span>记录天数</span></div>' +
    '<div class="a"><b class="green">' + onTarget + '</b><span>热量达标</span></div>' +
    '<div class="a"><b class="green">' + proteinOK + '</b><span>蛋白达标</span></div></div>' +
    '<div class="xs mute" style="margin-top:10px;line-height:1.6">热量达标 = 摄入在目标 ±10% 内；蛋白达标 = 达到目标 90% 以上</div></div>' +

    '<div class="card"><div class="row between" style="margin-bottom:10px">' +
    '<b style="font-size:15px">供能比</b><span class="xs mute">建议 蛋白' + t.proteinKcalPct + '% 碳水' + t.carbKcalPct + '% 脂肪' + t.fatKcalPct + '%</span></div>' +
    ratio.map(function (r) {
      return '<div class="ratiobar"><div class="h"><span>' + r.n + '</span><span class="ratio-pct">' + r.p + '%</span></div>' +
        '<div class="bar"><i style="width:' + r.p + '%;background:' + r.c + '"></i></div></div>';
    }).join('') + '</div>' +

    (w ? '<div class="card"><div class="row between"><b style="font-size:15px">体重</b>' +
      '<span class="sm mute">目标 ' + store.data.profile.targetWeight + ' kg</span></div>' +
      '<div class="wline" style="margin-top:10px"><div class="wv">' + w.weight + '<small>kg</small></div>' +
      '<div class="wchg ' + (delta < 0 ? 'down' : (delta > 0 ? 'up' : '')) + '">' +
      (delta > 0 ? '↑ ' + delta : (delta < 0 ? '↓ ' + (-delta) : '— 0')) + ' kg</div></div>' +
      '<div class="xs mute" style="margin-top:8px">最近记录 ' + w.date + '，变化为区间首尾差</div></div>' : '') +

    '<div class="card"><b style="font-size:15px">建议</b><div style="margin-top:10px">' +
    tips.map(function (x) { return '<div class="adv"><i>•</i><p>' + esc(x) + '</p></div>'; }).join('') +
    '</div></div>' +
    '<div class="xs mute" style="text-align:center;padding:8px 0 20px">BMR ' + t.bmr + ' · TDEE ' + t.tdee + ' · 目标 ' + t.kcal + ' kcal</div>' +
    '</div>';
}

/* ================= 外观（主题 / 皮肤） ================= */
function resolvedTheme() {
  const t = (store.data.settings && store.data.settings.theme) || 'auto';
  if (t === 'auto') {
    try {
      return (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    } catch (e) { return 'light'; }
  }
  return t;
}

function lighten(rgb, p) {
  return 'rgb(' + rgb.split(',').map(function (v) {
    return Math.round(Number(v) + (255 - Number(v)) * p);
  }).join(',') + ')';
}

function applyAppearance() {
  const s = store.data.settings || DEFAULT_SETTINGS;
  const theme = resolvedTheme();
  const root = document.documentElement;
  root.setAttribute('data-theme', theme);

  const acc = ACCENTS[s.accent] || ACCENTS.green;
  root.style.setProperty('--acc', acc.a);
  root.style.setProperty('--green2', lighten(acc.a, 0.26));

  let bg = '';
  if (BG_IMAGE) {
    bg = 'url("' + BG_IMAGE + '")';
  } else {
    const b = BGS.filter(function (x) { return x.key === s.bg; })[0] || BGS[0];
    bg = theme === 'dark' ? b.dark : b.light;
  }
  document.body.style.backgroundImage = bg || 'none';

  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#0f141a' : acc.hex);
}

function renderKeepScroll() {
  const y = window.scrollY || window.pageYOffset || 0;
  render();
  window.scrollTo(0, y);
}

function viewAppearanceCard() {
  const s = store.data.settings || DEFAULT_SETTINGS;

  return '<div class="card">' +
    '<div class="row between" style="margin-bottom:10px">' +

    '<span class="xs mute">当前' + (cur === 'dark' ? '深色' : '浅色') + '</span></div>' +

    '<div class="themebar">' +

    }).join('') + '</div>' +

        'style="background:rgb(' + ACCENTS[k].a + ')"></div>';
    }).join('') + '</div>' +

    '<div class="bgopts">' + BGS.map(function (b) {

      return '<div class="bgopt ' + (!BG_IMAGE && s.bg === b.key ? 'on' : '') + '" data-act="bg" data-k="' + b.key + '">' +
        '<div class="bgprev" style="background:' + css + '"></div><span>' + b.name + '</span></div>';
    }).join('') +

    '</div>';
}

function pickBgImage() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
  document.body.appendChild(inp);
  inp.addEventListener('change', function () {
    compressBg(inp.files && inp.files[0]);
    setTimeout(function () { inp.remove(); }, 100);
  });
  inp.click();
}

function compressBg(file) {
  if (!file) return;
  if (!/^image\//.test(file.type || '')) { toast('请选择图片文件'); return; }
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = function () {
    const MAXW = 1200;
    const scale = Math.min(1, MAXW / img.width);
    const w = Math.max(1, Math.round(img.width * scale));
    const h = Math.max(1, Math.round(img.height * scale));
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    cv.getContext('2d').drawImage(img, 0, 0, w, h);
    let data = '';
    try { data = cv.toDataURL('image/jpeg', 0.72); }
    catch (e) { toast('这张图无法处理'); URL.revokeObjectURL(url); return; }
    if (data.length > 2600000) { toast('图片太大，换一张小一点的'); URL.revokeObjectURL(url); return; }
    try {
      localStorage.setItem(KEY_IMG, data);
      BG_IMAGE = data;
      applyAppearance(); renderKeepScroll();
      toast('背景已更新');
    } catch (e) {
      toast('本机存储不足，换张更小的图');
    }
    URL.revokeObjectURL(url);
  };
  img.onerror = function () { toast('无法读取这张图片'); URL.revokeObjectURL(url); };
  img.src = url;
}

/* ================= 训练 ================= */
function biliUrl(bv) { return 'https://www.bilibili.com/video/' + bv; }

function fmtDur(s) {
  if (!s) return '';
  const m = Math.floor(s / 60), r = s % 60;
  return m ? m + ':' + (r < 10 ? '0' : '') + r : r + '秒';
}
function fmtViews(v) {
  if (!v) return '';
  return v >= 10000 ? (v / 10000).toFixed(v >= 100000 ? 0 : 1) + '万' : String(v);
}

function trainRow(group, it, i, isCustom) {

/* ---------------- 训练计划 ---------------- */
function planData() {
  if (!store.data.plan) store.data.plan = { split: 'ppl3', days: {}, cycle: 0, checkins: {}, coins: 0, weekPaid: {}, buffs: {} };
  const p = store.data.plan;
  p.coins = p.coins || 0;
  p.checkins = p.checkins || {};
  p.days = p.days || {};
  p.buffs = p.buffs || {};
  p.weekPaid = p.weekPaid || {};
  return p;
}

function weekKey(d) {
  const t = new Date(parseDate(d).getTime());
  const day = (t.getDay() + 6) % 7;
  t.setDate(t.getDate() - day);
  return fmtDate(t);
}
function weekCheckins() {
  const p = planData();
  const wk = weekKey(todayStr());
  return Object.keys(p.checkins).filter(function (d) { return weekKey(d) === wk; });
}
function todayDayIndex() {
  const p = planData();
  const sp = SPLITS[p.split] || SPLITS.ppl3;
  return p.cycle % sp.days.length;
}
function dayGroups(idx) {
  const p = planData();
  const sp = SPLITS[p.split] || SPLITS.ppl3;
  const custom = p.days[p.split + '#' + idx];
  if (custom) return custom.slice();
  const d = sp.days[idx] || { g: [] };
  return d.g.slice();
}
function groupName(k) {
  const g = TRAIN.filter(function (x) { return x.key === k; })[0];
  return g ? g.name : k;
}

function weeklyPlan() {
  const pr = store.data.profile;
  const t = targets(pr);
  const cut = pr.goal === 'cut', bulk = pr.goal === 'bulk';
  const days = cut ? 5 : 4;
  return {
    days: days,
    title: cut ? '本周减脂目标' : (bulk ? '本周增肌目标' : '本周维持目标'),
    items: [
      '完成 ' + days + ' 次训练并打卡',
      '日均热量控制在 ' + t.kcal + ' kcal 附近',
      '蛋白日均 ≥ ' + Math.round(t.protein * 0.9) + ' g',
      '饮水每天 ≥ ' + t.water + ' ml',
      cut ? '体重下降 0.3–0.7 kg' : (bulk ? '体重上升 0.2–0.4 kg' : '体重波动不超过 ±0.5 kg')
    ]
  };
}

function viewPlan() {
  const p = planData();
  const sp = SPLITS[p.split] || SPLITS.ppl3;
  const idx = todayDayIndex();
  const today = todayStr();
  const groups = dayGroups(idx);
  const doneToday = !!p.checkins[today];
  const wk = weekCheckins().length;
  const goal = weeklyPlan();
  const pct = Math.min(100, Math.round(wk / goal.days * 100));

  const splitBtns = Object.keys(SPLITS).map(function (k) {
    const s = SPLITS[k];
    return '<div class="split ' + (p.split === k ? 'on' : '') + '" data-act="setsplit" data-k="' + k + '">' +
      '<b>' + s.name + '</b><span>' + s.desc + '</span></div>';
  }).join('');

  const tags = groups.map(function (g, i) {
    return '<div class="ptag">' + groupName(g) +
      '<span class="x" data-act="deldaygrp" data-i="' + i + '">×</span></div>';
  }).join('') + '<div class="ptag add" data-act="adddaygrp">＋ 添加部位</div>';

  return '<div class="coinbar"><div><div class="cb"><b>' + p.coins + '</b><span class="cl">代币</span></div>' +
    '<div class="cl" style="margin-top:4px">打卡 +10 · 连打 +5 · 周目标 +100</div></div>' +
    '<div class="cw">本周已练<br><b style="font-size:16px;color:var(--ink)">' + wk + '</b> / ' + goal.days + ' 次</div></div>' +

    '<div class="card"><div class="row between" style="margin-bottom:8px">' +
    '<b style="font-size:15px">训练分化</b><span class="xs mute">改分化不会清空打卡</span></div>' +
    '<div class="splits">' + splitBtns + '</div></div>' +

    '<div class="card">' +
    '<div class="row between"><b style="font-size:15px">今日 · ' + (sp.days[idx] ? sp.days[idx].n : '训练') + '</b>' +
    '<span class="xs mute">第 ' + (p.cycle + 1) + ' 次循环</span></div>' +
    '<div class="plantags">' + tags + '</div>' +
    '<div class="btn ' + (doneToday ? 'gray' : '') + '" data-act="checkin" style="' + (doneToday ? 'background:var(--el2);color:var(--mute);box-shadow:none' : '') + '">' +
    (doneToday ? '今天已打卡 ✓' : '完成训练，打卡 +10') + '</div></div>' +

    '<div class="card"><div class="row between" style="margin-bottom:6px">' +
    '<b style="font-size:15px">' + goal.title + '</b><span class="xs mute">' + wk + '/' + goal.days + ' 次</span></div>' +
    '<div class="progbar"><i style="width:' + pct + '%"></i></div>' +
    '<div class="goalbox" style="margin-top:10px;margin-bottom:0"><div class="gt">本周要做到</div><ul style="margin:0;padding:0;list-style:none">' +
    goal.items.map(function (x) { return '<li>· ' + esc(x) + '</li>'; }).join('') + '</ul></div>' +
    (wk >= goal.days && !p.weekPaid[weekKey(today)]
      ? '<div class="btn" style="margin-top:12px" data-act="claimweek">领取本周奖励 +100</div>'
      : (p.weekPaid[weekKey(today)] ? '<div class="xs mute" style="text-align:center;padding-top:10px">本周奖励已领取 ✓</div>' : '')) +
    '</div>' +

    '<div class="card"><div class="row between" style="margin-bottom:8px">' +
    '<b style="font-size:15px">训练间歇小游戏</b><span class="xs mute">1–2 分钟</span></div>' +
    '<div class="quickacts" style="margin:0">' +

    '<div class="qa" data-act="game" data-g="poem"><span>📜</span>古诗填空</div>' +
    '</div>' +
    '<div class="btn gray" style="margin-top:10px" data-act="shop">场外商店 · 用代币换永久加成</div></div>';
}

/* 今日营养缺口提示 */
function gapBox(intake, t, over) {
  if (over) return '';
  const rows = [];
  const pg = t.protein - intake.protein;
  if (pg > t.protein * 0.2) {
    rows.push('蛋白还差 <b>' + Math.round(pg) + 'g</b> ≈ 鸡胸肉 ' + Math.round(pg / 0.24) + 'g 或希腊酸奶 ' + Math.round(pg / 0.10) + 'g');
  }
  const fg = t.fiber - intake.fiber;
  if (fg > 5) {
    rows.push('纤维还差 <b>' + Math.round(fg) + 'g</b> ≈ 燕麦片 ' + Math.round(fg / 0.106) + 'g 或西兰花 ' + Math.round(fg / 0.016) + 'g');
  }
  if (!rows.length) return '';
  return '<div class="tipbox">' + rows.map(function (r) {
    return '<div class="tr"><span>·</span><span>' + r + '</span></div>';
  }).join('') + '</div>';
}

/* 体重迷你趋势 */
function sparkline(pts) {
  if (!pts || pts.length < 2) return '';
  const vals = pts.map(function (p) { return p.weight; });
  const min = Math.min.apply(null, vals);
  const max = Math.max.apply(null, vals);
  const span = (max - min) || 1;
  const W = 300, H = 48, pad = 6;
  const step = (W - pad * 2) / (pts.length - 1);
  const d = pts.map(function (p, i) {
    const x = pad + i * step;
    const y = pad + (H - pad * 2) * (1 - (p.weight - min) / span);
    return (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
  }).join(' ');
  return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
    '<path d="' + d + '" fill="none" style="stroke:var(--green)" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

function buildBackup() {
  return JSON.stringify({
    v: 2,
    exportedAt: new Date().toISOString(),
    profile: store.data.profile,
    logs: store.data.logs,
    water: store.data.water,
    custom: store.data.custom,
    weights: store.data.weights,
    fav: store.data.fav || [],
    videos: store.data.videos || {},
    barcodes: store.data.barcodes || {},
    plan: store.data.plan || {},
    settings: store.data.settings || DEFAULT_SETTINGS,
    hasBgImage: !!BG_IMAGE
  });
}

function copyText(text, done) {
  let ok = false;
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
  } catch (e) { ok = false; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(
      function () { done(true); },
      function () { done(ok); }
    );
  } else {
    done(ok);
  }
}

/* 导入备份：逐字段校验，脏数据丢掉而不是写坏存储 */
function applyBackup(text) {
  let d = text;
  if (typeof d === 'string') {
    try { d = JSON.parse(d); } catch (e) { return { ok: false, msg: '不是合法的 JSON' }; }
  }
  if (!d || typeof d !== 'object' || Array.isArray(d)) return { ok: false, msg: '内容为空或格式不对' };

  let days = 0, records = 0, touched = false;

  if (d.profile && typeof d.profile === 'object' && !Array.isArray(d.profile)) {
    const p = Object.assign({}, DEFAULT_PROFILE);
    Object.keys(DEFAULT_PROFILE).forEach(function (k) {
      const v = d.profile[k];
      if (k === 'gender') { if (v === 'male' || v === 'female') p.gender = v; }
      else if (k === 'activity') { if (ACTIVITY.some(function (a) { return a.key === v; })) p.activity = v; }
      else if (k === 'goal') { if (GOALS.some(function (g) { return g.key === v; })) p.goal = v; }
      else { const n = Number(v); if (isFinite(n) && n > 0) p[k] = n; }
    });
    store.data.profile = p;
    touched = true;
  }

  if (d.logs && typeof d.logs === 'object' && !Array.isArray(d.logs)) {
    const logs = {};
    Object.keys(d.logs).forEach(function (date) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
      const arr = d.logs[date];
      if (!Array.isArray(arr)) return;
      const items = arr.filter(function (r) { return r && r.name; }).map(function (r) {
        return {
          id: r.id || newId(),
          meal: ['breakfast', 'lunch', 'dinner', 'snack'].indexOf(r.meal) > -1 ? r.meal : 'snack',
          foodId: r.foodId || '',
          name: String(r.name),
          grams: Math.round(Number(r.grams) || 0),
          kcal: Math.round(Number(r.kcal) || 0),
          protein: Number(r.protein) || 0,
          carb: Number(r.carb) || 0,
          fat: Number(r.fat) || 0,
          fiber: Number(r.fiber) || 0,
          ts: Number(r.ts) || Date.now()
        };
      });
      if (items.length) {
        logs[date] = items;
        days += 1;
        records += items.length;
      }
    });
    store.data.logs = logs;
    touched = true;
  }

  if (d.water && typeof d.water === 'object' && !Array.isArray(d.water)) {
    const w = {};
    Object.keys(d.water).forEach(function (date) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
      const v = Number(d.water[date]);
      if (v > 0) w[date] = Math.round(v);
    });
    store.data.water = w;
    touched = true;
  }

  if (Array.isArray(d.custom)) {
    store.data.custom = d.custom.filter(function (f) { return f && f.name; }).map(function (f, i) {
      const grams = Number(f.serving && f.serving.grams);
      return {
        id: f.id || 'cu' + Date.now().toString(36) + i + Math.floor(Math.random() * 99),
        name: String(f.name), cat: 'custom', py: String(f.py || ''),
        kcal: Number(f.kcal) || 0, protein: Number(f.protein) || 0,
        carb: Number(f.carb) || 0, fat: Number(f.fat) || 0, fiber: Number(f.fiber) || 0,
        serving: (isFinite(grams) && grams > 0)
          ? { unit: String((f.serving && f.serving.unit) || '份'), grams: grams }
          : { unit: '份', grams: 100 }
      };
    });
    touched = true;
  }

  if (Array.isArray(d.weights)) {
    store.data.weights = d.weights
      .filter(function (x) { return x && x.date && Number(x.weight) > 0; })
      .map(function (x) {
        return { date: String(x.date), weight: Math.round(Number(x.weight) * 10) / 10, ts: Number(x.ts) || Date.now() };
      })
      .sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    touched = true;
  }

  if (Array.isArray(d.fav)) {
    store.data.fav = d.fav.filter(function (x) { return typeof x === 'string' && !!foodById(x); });
    touched = true;
  }

  if (d.videos && typeof d.videos === 'object' && !Array.isArray(d.videos)) {
    const vids = {};
    Object.keys(d.videos).forEach(function (k) {
      if (!/^[a-z]+#\d+$/.test(k)) return;
      const v = d.videos[k];
      if (!v || typeof v !== 'object') return;
      const m = String(v.bv || '').match(/BV[0-9A-Za-z]{10}/);
      if (!m) return;
      vids[k] = { bv: m[0], t: String(v.t || '') };
    });
    store.data.videos = vids;
    touched = true;
  }

  if (d.barcodes && typeof d.barcodes === 'object' && !Array.isArray(d.barcodes)) {
    const bc = {};
    Object.keys(d.barcodes).forEach(function (k) {
      if (!/^\d{8,14}$/.test(k)) return;
      if (typeof d.barcodes[k] !== 'string') return;
      bc[k] = d.barcodes[k];
    });
    store.data.barcodes = bc;
    touched = true;
  }

  if (d.settings && typeof d.settings === 'object') {
    const s = Object.assign({}, DEFAULT_SETTINGS);
    if (['auto', 'light', 'dark'].indexOf(d.settings.theme) > -1) s.theme = d.settings.theme;
    if (ACCENTS[d.settings.accent]) s.accent = d.settings.accent;
    if (BGS.some(function (b) { return b.key === d.settings.bg; })) s.bg = d.settings.bg;
    store.data.settings = s;
    touched = true;
  }

  if (!touched) return { ok: false, msg: '没识别到可导入的数据' };
  store.save();
  return { ok: true, days: days, records: records };
}

/* ================= 扫码 ================= */
let scanStream = null;

function closeScanner() {
  if (scanStream) {
    try { scanStream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) { }
    scanStream = null;
  }
  const b = document.querySelector('.scanbox');
  if (b) b.remove();
}

function manualBarcode() {
  const code = prompt('输入商品条码（8–14 位数字）：');
  if (!code) return;
  handleBarcode(String(code).replace(/\D/g, ''));
}

function handleBarcode(code) {
  if (!code || code.length < 8) { toast('条码不完整'); return; }
  const map = store.data.barcodes || {};
  const fid = map[code];
  if (fid) {
    const f = foodById(fid);
    if (f) {
      const wasInAdd = S.view === 'add';
      if (!wasInAdd) S.view = 'add';
      S.pickFood = f;
      S.grams = (f.serving && f.serving.grams) || 100;
      render();
      toast('已找到：' + f.name);
      return;
    }
  }
  S.pendingBarcode = code;
  S.view = 'add';
  S.newFood = true;
  render();
  toast('这个条码还没收录，填一次就会记住');
}

function startScan() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !('BarcodeDetector' in window)) {
    manualBarcode();
    return;
  }
  closeScanner();
  const box = document.createElement('div');
  box.className = 'scanbox';
  box.innerHTML = '<video id="scanv" playsinline muted autoplay></video>' +
    '<div class="scanframe"></div>' +
    '<div class="scanhint">把商品条码放进框内</div>' +
    '<div class="scanbtns"><div class="btn gray" style="width:220px" data-act="closescan">取消 / 手动输入</div></div>';
  document.body.appendChild(box);

  navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } } })
    .then(function (st) {
      scanStream = st;
      const v = document.getElementById('scanv');
      if (!v) { closeScanner(); return; }
      v.srcObject = st;
      const detector = new window.BarcodeDetector({
        formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39']
      });
      let stopped = false;
      const tick = function () {
        if (stopped || !document.body.contains(box)) return;
        detector.detect(v).then(function (codes) {
          if (codes && codes.length && codes[0].rawValue) {
            stopped = true;
            const val = codes[0].rawValue;
            closeScanner();
            handleBarcode(String(val).replace(/\D/g, ''));
          } else {
            setTimeout(tick, 260);
          }
        }).catch(function () { setTimeout(tick, 400); });
      };
      v.addEventListener('loadeddata', function () { tick(); }, { once: true });
      setTimeout(tick, 1200);
    })
    .catch(function () {
      closeScanner();
      toast('打不开摄像头，改用手动输入');
      manualBarcode();
    });
}

/* ---------- 电子乒乓 ---------- */
function bootPong(host) {
  const padLv = buffLv('pong_paddle');
  const lifeLv = buffLv('pong_life');
  const PADW = 64 + padLv * 14;
  let lives = 3 + lifeLv;
  let score = 0, left = 90, over = false;

  host.innerHTML = '<div class="gamewrap">' +
    '<div class="gamehead"><b>电子乒乓</b><span class="gclock" id="gclock">90s</span></div>' +
    '<div class="gstage"><canvas id="pongcv"></canvas></div>' +
    '<div class="row between" style="margin-top:8px;font-size:12px;color:var(--mute)">' +
    '<span>得分 <b id="gscore" style="color:var(--ink)">0</b></span>' +
    '<span>生命 <b id="glife" style="color:var(--ink)">' + lives + '</b></span></div></div>';

  const cv = document.getElementById('pongcv');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = Math.max(240, cv.clientWidth || 300), H = 300;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.height = H + 'px';
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);

  const pad = { w: Math.min(PADW, W * 0.6), h: 10, x: W / 2 };
  const ball = { x: W / 2, y: H / 2, r: 6, vx: 2.2, vy: -2.8 };

  function movePad(clientX) {
    const rect = cv.getBoundingClientRect();
    const x = (clientX - rect.left) / rect.width * W;
    pad.x = Math.max(pad.w / 2, Math.min(W - pad.w / 2, x));
  }
  cv.addEventListener('pointermove', function (e) { movePad(e.clientX); });
  cv.addEventListener('pointerdown', function (e) { movePad(e.clientX); });

  const draw = function () {
    const css = getComputedStyle(document.documentElement);
    const line = css.getPropertyValue('--line').trim() || '#eef1f4';
    const acc = css.getPropertyValue('--green').trim() || '#12a05b';
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = line;
    ctx.fillRect(pad.x - pad.w / 2, H - 22, pad.w, pad.h);
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = acc;
    ctx.fill();
  };

  const loop = function () {
    if (!GT || over) return;
    ball.x += ball.vx; ball.y += ball.vy;
    if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y < ball.r) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }
    if (ball.y > H - 22 - ball.r && ball.y < H - 12 &&
        Math.abs(ball.x - pad.x) < pad.w / 2 + ball.r && ball.vy > 0) {
      ball.vy = -Math.abs(ball.vy) * 1.03;
      ball.vx += (ball.x - pad.x) * 0.05;
      const sp = Math.hypot(ball.vx, ball.vy);
      const cap = 9;
      if (sp > cap) { ball.vx = ball.vx / sp * cap; ball.vy = ball.vy / sp * cap; }
      score += 1;
      const se = document.getElementById('gscore');
      if (se) se.textContent = score;
    }
    if (ball.y > H + 20) {
      lives -= 1;
      const le = document.getElementById('glife');
      if (le) le.textContent = lives;
      if (lives <= 0) { finishPong(); return; }
      ball.x = W / 2; ball.y = H / 2; ball.vx = 2.2; ball.vy = -2.8;
    }
    draw();
    GT.raf = requestAnimationFrame(loop);
  };

  function finishPong() {
    over = true;
    const got = Math.max(1, Math.floor(score / 3));
    addCoins(got);
    stopGames();
    const stage = document.querySelector('.gstage');
    if (stage) {
      stage.innerHTML = '<div class="gres" style="padding:70px 0">' +
        '<div class="big">' + score + '</div>' +
        '<div class="sub">接住 ' + score + ' 球 · 获得 ' + got + ' 代币</div></div>';
    }
    setTimeout(function () { toast('获得 ' + got + ' 代币'); }, 60);
  }

  GT = { raf: null, timer: null };
  GT.timer = setInterval(function () {
    if (over) return;
    left -= 1;
    const ce = document.getElementById('gclock');
    if (ce) ce.textContent = left + 's';
    if (left <= 0) finishPong();
  }, 1000);

  ball.vx = (Math.random() > 0.5 ? 1 : -1) * 2.2;
  GT.raf = requestAnimationFrame(loop);
}

/* ---------- 打地鼠 ---------- */
function bootWhack(host) {
  const extra = buffLv('whack_time') * 8;
  const stay = 620 + buffLv('whack_slow') * 180;
  let total = 30 + extra;
  let score = 0, over = false;
  let cur = -1;

  let cells = '';
  for (let i = 0; i < 9; i++) cells += '<div class="mole" data-i="' + i + '"></div>';

  host.innerHTML = '<div class="gamewrap">' +
    '<div class="gamehead"><b>打地鼠</b><span class="gclock" id="gclock">' + total + 's</span></div>' +
    '<div class="gstage"><div class="moles" style="padding:10px">' + cells + '</div></div>' +
    '<div class="row between" style="margin-top:8px;font-size:12px;color:var(--mute)">' +
    '<span>得分 <b id="gscore" style="color:var(--ink)">0</b></span></div></div>';

  const nodes = host.querySelectorAll('.mole');
  if (!nodes || nodes.length < 9) return;   // DOM 还没就绪就别启动，避免空指针
  nodes.forEach(function (n) {
    n.addEventListener('click', function () {
      if (over) return;
      if (Number(n.dataset.i) === cur) {
        score += 1;
        cur = -1;
        n.classList.remove('up');
        n.textContent = '';
        const se = document.getElementById('gscore');
        if (se) se.textContent = score;
      }
    });
  });

  const pop = function () {
    if (over) return;
    nodes.forEach(function (n) { n.classList.remove('up'); n.textContent = ''; });
    cur = Math.floor(Math.random() * 9);
    nodes[cur].classList.add('up');
    nodes[cur].textContent = '🐹';
  };

  const finish = function () {
    over = true;
    const got = Math.max(1, Math.floor(score / 4));
    addCoins(got);
    stopGames();
    const stage = document.querySelector('.gstage');
    if (stage) {
      stage.innerHTML = '<div class="gres" style="padding:70px 0">' +
        '<div class="big">' + score + '</div>' +
        '<div class="sub">打到 ' + score + ' 只 · 获得 ' + got + ' 代币</div></div>';
    }
    setTimeout(function () { toast('获得 ' + got + ' 代币'); }, 60);
  };

  GT = { timer: null, moleTimer: null, raf: null };
  GT.moleTimer = setInterval(pop, Math.max(520, stay));
  GT.timer = setInterval(function () {
    if (over) return;
    total -= 1;
    const ce = document.getElementById('gclock');
    if (ce) ce.textContent = total + 's';
    if (total <= 0) finish();
  }, 1000);
  pop();
}

/* ---------- 古诗填空 ---------- */
function bootPoem(host) {
  const extra = buffLv('poem_time') * 15;
  const hints = buffLv('poem_hint');
  let total = 60 + extra;
  let cur = 0, right = 0, over = false, locked = false;
  const order = POEMS.map(function (_, i) { return i; }).sort(function () { return Math.random() - 0.5; });

  host.innerHTML = '<div class="gamewrap">' +
    '<div class="gamehead"><b>古诗填空</b><span class="gclock" id="gclock">' + total + 's</span></div>' +
    '<div class="gstage quiz" id="quizbox" style="padding:14px"></div>' +
    '<div class="row between" style="margin-top:8px;font-size:12px;color:var(--mute)">' +
    '<span>答对 <b id="gscore" style="color:var(--ink)">0</b></span>' +
    '<span id="gprog">1 / ' + POEMS.length + '</span></div></div>';

  const box = document.getElementById('quizbox');

  const draw = function () {
    const q = POEMS[order[cur % order.length]];
    const opts = q.w.slice().sort(function () { return Math.random() - 0.5; });
    const removeN = hints;
    box.innerHTML = '<div class="qt">' + esc(q.q) + '</div>' +
      opts.map(function (o, i) {
        return '<div class="qo" data-o="' + i + '" data-v="' + esc(o) + '">' + esc(o) + '</div>';
      }).join('') +
      (removeN ? '<div class="xs mute" style="margin-top:6px" id="hintbtn" data-n="' + removeN + '">排除一个错误选项（' + removeN + ' 次）</div>' : '');

    box.querySelectorAll('.qo').forEach(function (el) {
      el.addEventListener('click', function () {
        if (over || locked) return;
        locked = true;
        const v = el.getAttribute('data-v');
        if (v === q.a) {
          right += 1;
          el.classList.add('ok');
          const se = document.getElementById('gscore');
          if (se) se.textContent = right;
        } else {
          el.classList.add('bad');
          box.querySelectorAll('.qo').forEach(function (x) {
            if (x.getAttribute('data-v') === q.a) x.classList.add('ok');
          });
        }
        setTimeout(function () {
          locked = false;
          cur += 1;
          if (!over) {
            const pe = document.getElementById('gprog');
            if (pe) pe.textContent = ((cur % POEMS.length) + 1) + ' / ' + POEMS.length;
            draw();
          }
        }, 520);
      });
    });

    const hb = document.getElementById('hintbtn');
    if (hb) {
      hb.addEventListener('click', function () {
        if (over || locked) return;
        const wrongOnes = [];
        box.querySelectorAll('.qo').forEach(function (x) {
          if (x.getAttribute('data-v') !== q.a && !x.classList.contains('gone')) wrongOnes.push(x);
        });
        const n = Math.min(Number(hb.getAttribute('data-n')), wrongOnes.length - 1);
        if (n <= 0) return;
        for (let i = 0; i < n; i++) {
          if (wrongOnes[i]) {
            wrongOnes[i].classList.add('gone');
            wrongOnes[i].style.opacity = '.28';
            wrongOnes[i].style.textDecoration = 'line-through';
          }
        }
        hb.remove();
      });
    }
  };

  const finish = function () {
    over = true;
    const got = Math.max(1, right * 2);
    addCoins(got);
    stopGames();
    box.innerHTML = '<div class="gres" style="padding:60px 0">' +
      '<div class="big">' + right + '</div>' +
      '<div class="sub">答对 ' + right + ' 题 · 获得 ' + got + ' 代币</div></div>';
    setTimeout(function () { toast('获得 ' + got + ' 代币'); }, 60);
  };

  GT = { timer: null, raf: null };
  GT.timer = setInterval(function () {
    if (over) return;
    total -= 1;
    const ce = document.getElementById('gclock');
    if (ce) ce.textContent = total + 's';
    if (total <= 0) finish();
  }, 1000);

  draw();
}

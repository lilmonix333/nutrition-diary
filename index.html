<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#12a05b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="营养日记">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>营养日记</title>
<style>
:root{
  --acc:18,160,91;
  --acc2:36,201,122;
  --green:rgb(var(--acc));
  --green2:rgb(var(--acc2));
  --soft:rgba(var(--acc),.12);
  --blue:#3b82f6;--amber:#f59e0b;--purple:#a855f7;--red:#ef4444;
  --r:16px;
  --safeB:env(safe-area-inset-bottom,0px);

  /* 浅色 */
  --bg:#f4f6f8;
  --card-rgb:255,255,255;
  --cardA:1;
  --card:rgba(var(--card-rgb),var(--cardA));
  --el:#f4f6f8;
  --el2:#f8fafb;
  --line:#eef1f4;
  --track:#e7ecf1;
  --ink:#1c2024;
  --ink2:#4b5563;
  --mute:#9aa3ad;
  --mute2:#b6bec7;
  --solid:#1c2024;
  --tabbar:rgba(255,255,255,.96);
  --warn-bg:#fef3c7;
  --warn-ink:#92400e;
}

[data-theme="dark"]{
  --bg:#0f141a;
  --card-rgb:24,31,39;
  --card:rgba(var(--card-rgb),var(--cardA));
  --el:#1f2831;
  --el2:#1b232b;
  --line:#2a3441;
  --ink:#e9eef4;
  --ink2:#a9b4c0;
  --mute:#7b8794;
  --mute2:#5b6672;
  --solid:#2c3745;
  --tabbar:rgba(19,25,32,.94);
  --warn-bg:#3a3018;
  --warn-ink:#f0d189;
  --track:#2c3746;
  --soft:rgba(var(--acc),.22);
  --blue:#60a5fa;--amber:#fbbf24;--purple:#c084fc;--red:#f87171;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
input,button{font:inherit;color:inherit;border:none;background:none;outline:none}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* 布局 */
.wrap{padding:12px 14px calc(96px + var(--safeB));max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(28,32,36,.05)}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.mute{color:var(--mute)}
.sm{font-size:12px}
.xs{font-size:11px}
.green{color:var(--green)}
.red{color:var(--red)}
.bold{font-weight:700}
.hidden{display:none!important}

/* 顶部日期条 */
.datebar{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 12px}
.datebar .nav{width:38px;height:38px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink2);box-shadow:0 2px 8px rgba(28,32,36,.06)}
.datebar .nav.off{opacity:.35}
.datebar .mid{text-align:center}
.datebar .d1{font-size:17px;font-weight:700}
.datebar .d2{font-size:11px;color:var(--mute);margin-top:2px}

/* 环形 */
.herohead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.pill{font-size:12px;color:var(--green);background:var(--soft);padding:5px 11px;border-radius:99px}
.link{font-size:12px;color:var(--mute);padding:5px 2px}
.ringbox{position:relative;width:min(64vw,240px);margin:8px auto 14px;aspect-ratio:1/1}
.ringbox svg{width:100%;height:100%;display:block}
.ringmid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.ringmid .lbl{font-size:12px;color:var(--mute)}
.ringmid .num{font-size:44px;font-weight:800;line-height:1.05;letter-spacing:-1.5px;color:var(--green);margin:2px 0}
.ringmid .num.over{color:var(--red)}
.ringmid .u{font-size:12px;color:var(--mute);font-weight:400;letter-spacing:0;margin-left:3px}
.ringmid .sub{font-size:11px;color:var(--mute2)}

/* 进度条 */
.bar{height:7px;border-radius:7px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:7px;transition:width .35s ease}
.macro{margin-bottom:11px}
.macro:last-child{margin-bottom:0}
.mhead{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.mhead b{font-weight:700}
.mhead span{color:var(--mute);font-weight:400}

/* 餐次 */
.meal{padding:14px 16px}
.mealhead{display:flex;align-items:center;justify-content:space-between}
.mealhead .l{display:flex;align-items:center;gap:7px}
.mealhead .ic{font-size:16px}
.mealhead .nm{font-size:15px;font-weight:700}
.mealhead .cnt{font-size:11px;color:var(--mute);background:var(--el);padding:2px 7px;border-radius:6px}
.mealhead .hint{font-size:11px;color:var(--mute2)}
.mealhead .r{display:flex;align-items:center;gap:10px}
.mealhead .kc{font-size:14px;font-weight:700}
.mealhead .kcu{font-size:10px;color:var(--mute);margin-left:-6px}
.addbtn{width:27px;height:27px;border-radius:50%;background:var(--soft);color:var(--green);font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center}
.addbtn:active{background:rgba(var(--acc),.22)}
.items{margin-top:10px;border-top:1px solid var(--line);padding-top:2px}
.item{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--el2)}
.item:last-child{border-bottom:none;padding-bottom:0}
.item .nm{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:52vw}
.item .g{font-size:11px;color:var(--mute);margin-left:6px}
.item .kc{font-size:12px;color:var(--ink2)}
.del{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--mute2);font-size:18px;margin-left:4px}
.del:active{color:var(--red)}

/* 饮水 */
.cups{display:flex;flex-wrap:wrap;gap:8px}
.cup{width:38px;height:38px;border-radius:9px;background:var(--el);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--mute2)}
.cup.on{background:rgba(59,130,246,.16);color:var(--blue)}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--tabbar);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:var(--safeB)}
.tabbar .t{flex:1;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mute);font-size:10px}
.tabbar .t.on{color:var(--green)}
.tabbar .t svg{width:24px;height:24px}
.fab{position:fixed;right:16px;bottom:calc(74px + var(--safeB));z-index:41;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--green2),var(--green));color:#fff;font-size:28px;font-weight:300;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(var(--acc),.38)}
.fab:active{transform:scale(.95)}

/* 添加页 */
.pagehead{position:sticky;top:0;z-index:30;background:var(--bg);padding:10px 0 8px;margin:-12px -14px 0;padding-left:14px;padding-right:14px}
.ptitle{display:flex;align-items:center;gap:10px}
.back{width:34px;height:34px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink2);box-shadow:0 2px 8px rgba(28,32,36,.06)}
.ptitle .tt{font-size:17px;font-weight:700;flex:1}
.sumcard{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:var(--r);padding:12px 16px;margin:10px 0}
.sumcard .k{font-size:22px;font-weight:800}
.sumcard .k small{font-size:12px;font-weight:400;color:var(--mute)}
.ghost{font-size:12px;color:var(--green);background:var(--soft);padding:8px 12px;border-radius:99px}
.mealtabs{display:flex;gap:7px;margin-bottom:10px}
.mealtabs .mt{flex:1;height:36px;border-radius:10px;background:var(--card);display:flex;align-items:center;justify-content:center;gap:3px;font-size:13px;color:var(--ink2)}
.mealtabs .mt.on{background:var(--solid);color:#fff;font-weight:700}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:0 14px;height:42px;margin-bottom:10px}
.search input{flex:1;height:42px;font-size:15px}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 14px;border-radius:99px;background:var(--card);color:var(--ink2);font-size:13px}
.chip.on{background:var(--soft);color:var(--green);font-weight:700}
.flist{background:var(--card);border-radius:var(--r);overflow:hidden}
.f{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--el);gap:10px}
.f:last-child{border-bottom:none}
.f:active{background:rgba(var(--acc),.06)}
.f .nm{font-size:14px;font-weight:500}
.f .ds{font-size:11px;color:var(--mute);margin-top:2px}
.f .pl{width:26px;height:26px;flex:0 0 auto;border-radius:50%;background:var(--soft);color:var(--green);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center}
.fdel{font-size:11px;color:var(--red);padding:4px 2px;flex:0 0 auto}

/* 底部弹层 */
.mask{position:fixed;inset:0;background:rgba(16,20,24,.45);z-index:60;animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + var(--safeB));animation:up .22s ease;max-height:88vh;overflow:auto}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet h3{margin:0 0 4px;font-size:17px;display:flex;align-items:center;justify-content:space-between}
.sheet .x{color:var(--mute2);font-size:24px;line-height:1;padding:0 4px}
.per100{font-size:11px;color:var(--mute);margin-bottom:14px}
.gramrow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.step{width:44px;height:44px;border-radius:12px;background:var(--el);font-size:20px;display:flex;align-items:center;justify-content:center}
.step:active{background:var(--line)}
.ginput{flex:1;height:44px;border-radius:12px;background:var(--el2);font-size:22px;font-weight:700;text-align:center}
.quicks{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.quick{padding:7px 13px;border-radius:99px;background:var(--el);color:var(--ink2);font-size:13px}
.quick:active{background:var(--soft);color:var(--green)}
.preview{background:rgba(var(--acc),.06);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.preview .big{font-size:30px;font-weight:800;color:var(--green);line-height:1}
.preview .big small{font-size:12px;font-weight:400;color:var(--mute);margin-left:4px}
.preview .det{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-top:8px}
.btn{height:46px;border-radius:23px;background:linear-gradient(135deg,var(--green2),var(--green));color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(var(--acc),.3)}
.btn:active{opacity:.86}
.btn.gray{background:var(--el);color:var(--ink);box-shadow:none}
.field{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.field:last-of-type{border-bottom:none}
.field .lb{font-size:14px;color:var(--ink2)}
.field input{text-align:right;font-size:16px;width:130px}
.field .un{font-size:12px;color:var(--mute);width:26px;text-align:right}

/* 报告 */
.seg{display:flex;background:var(--el);border-radius:99px;padding:3px}
.seg .s{padding:5px 13px;border-radius:99px;font-size:12px;color:var(--mute)}
.seg .s.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 5px rgba(0,0,0,.07)}
.chart{position:relative;display:flex;align-items:flex-end;height:150px;margin:16px 0 0}
.chart .col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.chart .b{width:52%;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,rgba(var(--acc),.55),var(--green));min-height:2px}
.chart .b.over{background:linear-gradient(180deg,#fca5a5,#ef4444)}
.chart .b.zero{background:var(--line)}
.tline{position:absolute;left:0;right:0;border-top:1px dashed #c8d0d8;z-index:2}
.tline b{position:absolute;right:0;top:-16px;font-size:10px;color:var(--mute);font-weight:400}
.xlabels{display:flex;margin-top:6px}
.xlabels span{flex:1;text-align:center;font-size:10px;color:var(--mute)}
.legend{display:flex;justify-content:center;gap:14px;margin-top:12px}
.legend i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px;vertical-align:1px}
.grid2{display:flex;flex-wrap:wrap}
.grid2 .gi{width:50%;padding:8px 0}
.grid2 .v{font-size:21px;font-weight:800;line-height:1.2}
.grid2 .n{font-size:12px;color:var(--ink2);margin-top:1px}
.grid2 .t{font-size:10px;color:var(--mute)}
.three{display:flex;gap:8px}
.three .a{flex:1;text-align:center;background:var(--el2);border-radius:12px;padding:10px 0}
.three .a b{display:block;font-size:22px;font-weight:800;line-height:1.2}
.three .a span{font-size:10px;color:var(--mute)}
.ratiobar{margin-bottom:11px}
.ratiobar .h{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.ratio-pct{font-weight:700}
.wline{display:flex;align-items:baseline;justify-content:space-between}
.wline .wv{font-size:32px;font-weight:800;line-height:1}
.wline .wv small{font-size:12px;color:var(--mute);font-weight:400;margin-left:4px}
.wchg{font-size:13px;padding:4px 10px;border-radius:99px;background:var(--el);color:var(--ink2)}
.wchg.down{background:var(--soft);color:var(--green)}
.wchg.up{background:rgba(239,68,68,.15);color:var(--red)}
.adv{display:flex;gap:8px;margin-bottom:8px}
.adv i{color:var(--green);font-style:normal;line-height:1.5}
.adv p{margin:0;font-size:13px;color:var(--ink2);line-height:1.55}

/* 我的 */
.seg2{display:flex;background:var(--el);border-radius:12px;padding:3px;margin-bottom:4px}
.seg2 .s{flex:1;height:34px;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:14px;color:var(--ink2)}
.seg2 .s.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 6px rgba(0,0,0,.07)}
.opt{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;background:var(--el2);margin-bottom:7px;border:1.5px solid transparent}
.opt.on{background:var(--soft);border-color:var(--green)}
.opt .n{font-size:14px;font-weight:700}
.opt .d{font-size:10px;color:var(--mute);margin-top:1px}
.opt .x{font-size:12px;color:var(--mute)}
.opt.on .x{color:var(--green)}
.goals{display:flex;gap:8px}
.goals .g{flex:1;text-align:center;padding:11px 6px;border-radius:12px;background:var(--el2);border:1.5px solid transparent}
.goals .g.on{background:var(--soft);border-color:var(--green)}
.goals .g .n{font-size:15px;font-weight:800}
.goals .g .d{font-size:9px;color:var(--mute);margin-top:4px;line-height:1.35}
.rescard{background:linear-gradient(160deg,var(--card),rgba(var(--acc),.07))}
.kbig{text-align:center;padding:4px 0 8px}
.kbig b{font-size:42px;font-weight:800;color:var(--green);letter-spacing:-1px;line-height:1}
.kbig small{font-size:12px;color:var(--mute);margin-left:6px;font-weight:400}
.formula{font-size:10.5px;color:var(--mute);text-align:center;line-height:1.6;margin-bottom:12px}
.ng{display:flex;flex-wrap:wrap}
.ng .n{width:33.33%;text-align:center;padding:7px 0}
.ng .n b{display:block;font-size:16px;font-weight:700}
.ng .n span{display:block;font-size:10px;color:var(--ink2)}
.ng .n i{display:block;font-size:9px;color:var(--mute2);font-style:normal}
.wrow2{display:flex;gap:8px;margin-bottom:10px}
.wrow2 input{flex:1;height:42px;background:var(--el2);border-radius:10px;padding:0 12px;font-size:15px}
.wrow2 .sb{width:74px;height:42px;border-radius:10px;background:var(--solid);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
.wlist .w{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--el2);font-size:13px}
.wlist .w:last-child{border-bottom:none}
.rbtn{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px}
.rbtn:last-child{border-bottom:none}
.rbtn:active{opacity:.6}
.arrow{color:var(--mute2);font-size:18px}
.empty{text-align:center;color:var(--mute2);font-size:12px;padding:22px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + var(--safeB));z-index:99;background:rgba(28,32,36,.92);color:#fff;font-size:13px;padding:9px 18px;border-radius:99px;animation:fade .18s;pointer-events:none;white-space:nowrap}
.banner{position:fixed;left:0;right:0;top:0;z-index:98;background:var(--warn-bg);color:var(--warn-ink);font-size:12px;line-height:1.5;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;text-align:center}


/* ========== 主题 / 皮肤 ========== */
body{background-color:var(--bg)}
#bgfixed{position:fixed;left:0;top:0;right:0;bottom:0;z-index:-1;pointer-events:none;
  background-position:center center;background-size:cover;background-repeat:no-repeat;background-color:var(--bg)}
[data-theme="dark"] .card,[data-theme="dark"] .sumcard,[data-theme="dark"] .flist{box-shadow:none}
[data-theme="dark"] .mask{background:rgba(0,0,0,.6)}

.themebar{display:flex;background:var(--el);border-radius:12px;padding:3px;margin-bottom:14px}
.themebar .s{flex:1;height:34px;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:13px;color:var(--mute)}
.themebar .s.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 6px rgba(0,0,0,.1)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:50%;position:relative;border:2px solid transparent;transition:transform .15s}
.sw:active{transform:scale(.92)}
.sw.on{border-color:var(--ink)}
.sw.on::after{content:'';position:absolute;inset:5px;border-radius:50%;border:2px solid rgba(255,255,255,.9)}
.bgopts{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}
.bgopt{width:64px;text-align:center}
.bgprev{width:64px;height:52px;border-radius:12px;border:2px solid transparent;background:var(--el);overflow:hidden}
.bgopt.on .bgprev{border-color:var(--acc)}
.bgopt span{display:block;font-size:10px;color:var(--mute);margin-top:4px}
.bgopt.on span{color:var(--green);font-weight:700}

/* 收藏星标 */
.star{width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--mute2);flex:0 0 auto}
.star.on{color:#f59e0b}

/* 营养缺口提示 */
.tipbox{margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(var(--acc),.08);border:1px solid rgba(var(--acc),.18)}
.tipbox .tr{display:flex;gap:6px;font-size:12px;color:var(--ink2);line-height:1.6}
.tipbox .tr b{color:var(--green)}

/* 训练页 */
.kwgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 16px}
.kwtile{background:var(--card);border-radius:14px;padding:11px 4px 9px;text-align:center;border:1.5px solid transparent;transition:transform .12s}
.kwtile:active{transform:scale(.96)}
.kwtile .ki{display:flex;width:26px;height:26px;border-radius:9px;margin:0 auto 5px;align-items:center;justify-content:center;font-size:12px;font-weight:800;background:var(--el);color:var(--ink2)}
.kwtile.on .ki{background:rgba(var(--acc),.22);color:var(--green)}
.kwtile .kn{display:block;font-size:13.5px;font-weight:700}
.kwtile .kc{display:block;font-size:9.5px;color:var(--mute);margin-top:2px}
.kwtile.on{background:var(--soft);border-color:rgba(var(--acc),.42)}
.kwtile.on .kn{color:var(--green)}
.kwtile.on .kc{color:var(--green);opacity:.8}

.grpbar{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 6px}
.grpbar b{font-size:15px}
.grpbar span{font-size:10.5px;color:var(--mute)}

.rec{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:none}
.rec:active{opacity:.6}
.rec .ico{width:46px;height:34px;flex:0 0 auto;border-radius:9px;background:rgba(251,114,153,.15);color:#fb7299;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.rec .ico.q{background:var(--el2);color:var(--mute);font-size:15px;font-weight:400}
.rec .rt{flex:1;min-width:0}
.rec .t1{display:block;font-size:14px;font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .t2{display:block;font-size:10.5px;color:var(--mute);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .tag{font-size:9.5px;padding:1px 5px;border-radius:4px;background:rgba(251,114,153,.16);color:#fb7299;margin-right:5px;font-weight:700}
.rec .tag.q{background:var(--el2);color:var(--mute)}
.rec .more{width:32px;height:32px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--mute2);font-size:16px}
.rec .more:active{color:var(--green)}
.tsearch{display:flex;gap:8px}
.tsearch input{flex:1;height:42px;background:var(--el2);border-radius:12px;padding:0 12px;font-size:15px}
.tsearch .gb{width:64px;height:42px;border-radius:12px;background:var(--solid);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
.note{font-size:10.5px;color:var(--mute);line-height:1.75;text-align:center;padding:4px 16px 18px}
/* ==================== PERSONA 风格（P3R：白 · 黑 · 水色） ==================== */
[data-skin="persona"]{
  --acc:0,165,200;
  --green:rgb(0,165,200);
  --green2:rgb(86,214,236);
  --soft:rgba(0,165,200,.16);
  --bg:#e8f3f8;
  --card-rgb:255,255,255;
  --el:#dceef6;
  --el2:#e9f4f9;
  --line:#0a0e14;
  --track:#cfe4ee;
  --ink:#0a0e14;
  --ink2:#31424e;
  --mute:#7b8f9c;
  --mute2:#a8b9c4;
  --solid:#0a0e14;
  --tabbar:rgba(255,255,255,.98);
  --warn-bg:#fff3c4;
  --warn-ink:#7a5a00;
}
/* 背景：水色斜条纹 + 两团光 */
[data-skin="persona"] #bgfixed{
  background-color:#e9f4fb;
  background-image:
    radial-gradient(circle at 1px 1px, rgba(0,105,165,.11) 1.1px, rgba(0,0,0,0) 1.3px),
    repeating-linear-gradient(0deg, rgba(0,60,110,.028) 0 1px, rgba(0,0,0,0) 1px 3px),
    radial-gradient(140% 70% at 18% -14%, rgba(255,255,255,.98), rgba(255,255,255,0) 58%),
    radial-gradient(120% 60% at 88% 108%, rgba(12,54,140,.70), rgba(12,54,140,0) 62%),
    radial-gradient(70% 40% at 62% 34%, rgba(120,220,250,.55), rgba(120,220,250,0) 70%),
    linear-gradient(168deg,#ffffff 0%,#e4f5fc 22%,#b8e8f8 40%,#6cc8ea 60%,#2b93cf 78%,#0d4a96 100%);
  background-size:7px 7px,auto,auto,auto,auto,auto;
}
}
/* 卡片：白底 + 2px 黑边 + 硬投影 + 左上角水色三角 */
[data-skin="persona"] .card,
[data-skin="persona"] .sumcard,
[data-skin="persona"] .flist{
  border:2px solid #0a0e14;
  border-radius:0;
  background:rgba(var(--card-rgb),var(--cardA));
  box-shadow:5px 5px 0 #0a0e14;
  position:relative;
}
[data-skin="persona"] .card::before{
  content:'';position:absolute;left:-2px;top:-2px;width:0;height:0;
  border-left:20px solid rgb(0,165,200);
  border-bottom:20px solid transparent;
  pointer-events:none;
}
/* 数字：黑体斜 + 水色偏移硬阴影 */
[data-skin="persona"] .ringmid .num,
[data-skin="persona"] .kbig b,
[data-skin="persona"] .grid2 .v,
[data-skin="persona"] .three .a b,
[data-skin="persona"] .coinbar b,
[data-skin="persona"] .w-num,
[data-skin="persona"] .gres .big,
[data-skin="persona"] .ring-num{
  font-style:italic;font-weight:900;letter-spacing:-1.5px;
  color:#0a0e14;
  text-shadow:3px 3px 0 rgba(0,165,200,.9);
}
[data-skin="persona"] .ringmid .num.over{color:#c8102e;text-shadow:3px 3px 0 rgba(200,16,46,.55)}
/* 标题：粗斜体 + 水色高亮条 */
[data-skin="persona"] .datebar .d1,
[data-skin="persona"] .card-title,
[data-skin="persona"] .card > b,
[data-skin="persona"] .sheet h3,
[data-skin="persona"] .ptitle .tt,
[data-skin="persona"] .grpbar b{
  font-style:italic;font-weight:900;letter-spacing:.3px;color:#0a0e14;
}
[data-skin="persona"] .datebar .d1{
  position:relative;display:inline-block;z-index:0;
}
[data-skin="persona"] .datebar .d1::before{
  content:'';position:absolute;left:-10px;right:-10px;bottom:1px;height:12px;
  background:rgba(0,165,200,.55);transform:skewX(-14deg);z-index:-1;
}
/* 主按钮：水色实底 + 黑边 + 硬投影 */
[data-skin="persona"] .btn{
  border:2px solid #0a0e14;border-radius:0;
  background:rgb(0,165,200);color:#fff;
  font-weight:900;font-style:italic;letter-spacing:1.5px;
  box-shadow:4px 4px 0 #0a0e14;
}
[data-skin="persona"] .btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #0a0e14}
[data-skin="persona"] .btn.gray{background:#fff;color:#0a0e14}
/* 胶囊 / 标签 / 分类：平行四边形 */
[data-skin="persona"] .pill,
[data-skin="persona"] .chip,
[data-skin="persona"] .cat,
[data-skin="persona"] .mealtabs .mt,
[data-skin="persona"] .quick,
[data-skin="persona"] .ptag,
[data-skin="persona"] .kbchip,
[data-skin="persona"] .awk,
[data-skin="persona"] .seg3,
[data-skin="persona"] .seg,
[data-skin="persona"] .seg2,
[data-skin="persona"] .themebar{
  border-radius:0;
  clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%);
}
[data-skin="persona"] .pill,
[data-skin="persona"] .chip.on,
[data-skin="persona"] .cat.on,
[data-skin="persona"] .mealtabs .mt.on,
[data-skin="persona"] .seg3 .s.on,
[data-skin="persona"] .seg .s.on,
[data-skin="persona"] .seg2 .s.on,
[data-skin="persona"] .themebar .s.on{
  background:rgb(0,165,200);color:#fff;
}
[data-skin="persona"] .chip.on,
[data-skin="persona"] .cat.on,
[data-skin="persona"] .mealtabs .mt.on,
[data-skin="persona"] .seg3 .s.on,
[data-skin="persona"] .seg .s.on,
[data-skin="persona"] .seg2 .s.on,
[data-skin="persona"] .themebar .s.on{font-weight:900}
/* 卡片内的小方块：黑底白字 / 白底黑边 */
[data-skin="persona"] .addbtn,
[data-skin="persona"] .cup,
[data-skin="persona"] .step,
[data-skin="persona"] .rec .ico,
[data-skin="persona"] .kwtile .ki,
[data-skin="persona"] .opt,
[data-skin="persona"] .goals .g,
[data-skin="persona"] .kwtile,
[data-skin="persona"] .qa,
[data-skin="persona"] .split{
  border-radius:0;border:2px solid #0a0e14;
  background:#fff;box-shadow:3px 3px 0 #0a0e14;
}
[data-skin="persona"] .addbtn,
[data-skin="persona"] .rec .ico{background:#0a0e14;color:#fff;box-shadow:none;border:none}
[data-skin="persona"] .kwtile.on,
[data-skin="persona"] .opt.on,
[data-skin="persona"] .goals .g.on,
[data-skin="persona"] .split.on{
  background:rgb(0,165,200);border-color:#0a0e14;color:#fff;
}
[data-skin="persona"] .kwtile.on .kn,
[data-skin="persona"] .kwtile.on .kc{color:#fff}
[data-skin="persona"] .kwtile.on .ki{background:#fff;color:#0a0e14}
/* 进度条：黑边 + 水色填充 */
[data-skin="persona"] .bar,
[data-skin="persona"] .progbar,
[data-skin="persona"] .mixbar,
[data-skin="persona"] .bar > i,
[data-skin="persona"] .progbar i,
[data-skin="persona"] .mixbar i{border-radius:0}
[data-skin="persona"] .bar,
[data-skin="persona"] .progbar{background:#fff;border:2px solid #0a0e14;height:14px}
[data-skin="persona"] .bar > i,
[data-skin="persona"] .progbar i{background:rgb(0,165,200) !important}
/* 底部导航：白底 + 黑顶线，选中水色块 */
[data-skin="persona"] .tabbar{border-top:3px solid #0a0e14;background:#fff}
[data-skin="persona"] .tabbar .t.on{color:#0a0e14;font-weight:900;font-style:italic}
[data-skin="persona"] .tabbar .t.on::before{
  content:'';position:absolute;left:50%;top:2px;transform:translateX(-50%) skewX(-12deg);
  width:46px;height:26px;background:rgba(0,165,200,.35);z-index:-1;
}
[data-skin="persona"] .tabbar .t{position:relative;z-index:0}
/* 悬浮「＋」：菱形 + 黑硬投影 */
[data-skin="persona"] .fab{
  border-radius:0;
  clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);
  background:rgb(0,165,200);color:#fff;
  box-shadow:none;
  filter:drop-shadow(4px 4px 0 #0a0e14);
  font-weight:900;
}
/* 输入 / 弹层 / 搜索 */
[data-skin="persona"] .search,
[data-skin="persona"] .ginput,
[data-skin="persona"] .wrow2 input,
[data-skin="persona"] .tsearch input,
[data-skin="persona"] .tsearch .gb,
[data-skin="persona"] .wrow2 .sb,
[data-skin="persona"] .back,
[data-skin="persona"] .datebar .nav{
  border-radius:0;border:2px solid #0a0e14;background:#fff;box-shadow:3px 3px 0 #0a0e14;
}
[data-skin="persona"] .tsearch .gb,
[data-skin="persona"] .wrow2 .sb{background:#0a0e14;color:#fff;box-shadow:3px 3px 0 rgba(0,165,200,.9)}
[data-skin="persona"] .sheet{
  border-radius:0;border-top:4px solid #0a0e14;
  background:#fff;box-shadow:0 -6px 0 rgba(0,165,200,.25);
}
[data-skin="persona"] .sheet .x{color:#0a0e14}
/* 列表分隔线：黑色细线 */
[data-skin="persona"] .item,
[data-skin="persona"] .f,
[data-skin="persona"] .rec,
[data-skin="persona"] .rbtn,
[data-skin="persona"] .field,
[data-skin="persona"] .kbi,
[data-skin="persona"] .dayrow,
[data-skin="persona"] .topfood{border-color:rgba(10,14,20,.35)}
/* 时钟 / 分数等小数字 */
[data-skin="persona"] .gclock{color:#0a0e14;font-weight:900;font-style:italic}
[data-skin="persona"] .tag,
[data-skin="persona"] .tag.q{border-radius:0;background:rgba(0,165,200,.18);color:#0a0e14;font-weight:700}

/* ---------- 可读性修正：中文不用合成斜体 ---------- */
[data-skin="persona"] .card > b,
[data-skin="persona"] .card-title,
[data-skin="persona"] .ptitle .tt,
[data-skin="persona"] .sheet h3,
[data-skin="persona"] .grpbar b,
[data-skin="persona"] .dtag,
[data-skin="persona"] .dn{
  font-style:normal;
  font-weight:800;
}
/* 标题用「青色斜条」代替斜体，保住风格又不累眼 */
[data-skin="persona"] .card > b,
[data-skin="persona"] .card-title{
  position:relative;
  padding-left:14px;
}
[data-skin="persona"] .card > b::before,
[data-skin="persona"] .card-title > *:first-child::before,
[data-skin="persona"] .card-title::before{
  content:'';position:absolute;left:0;top:50%;margin-top:-8px;
  width:7px;height:16px;background:rgb(0,165,200);
  transform:skewX(-14deg);
}
/* 正文：加大行高与字距，长文更耐看 */
[data-skin="persona"] .kbb,
[data-skin="persona"] .adv p,
[data-skin="persona"] .note,
[data-skin="persona"] .tipbox .tr,
[data-skin="persona"] .dex,
[data-skin="persona"] .formula{
  line-height:1.9;
  font-size:12.8px;
  letter-spacing:.2px;
  color:#2c3d49;
}
[data-skin="persona"] .mute,
[data-skin="persona"] .xs.mute{color:#6c8090}
/* 分隔线柔化，dense 列表不再像表格 */
[data-skin="persona"] .item,
[data-skin="persona"] .f,
[data-skin="persona"] .rec,
[data-skin="persona"] .rbtn,
[data-skin="persona"] .field,
[data-skin="persona"] .kbi,
[data-skin="persona"] .dayrow,
[data-skin="persona"] .topfood{border-color:rgba(10,14,20,.16)}
/* 卡片右上角水色三角（原左上会让标题条挤在一起） */
[data-skin="persona"] .card::before{
  left:auto;right:-2px;
  border-left:0;
  border-right:20px solid rgb(0,165,200);
  border-bottom:20px solid transparent;
}

/* ---------- 背景幽灵英文大字 ---------- */
[data-skin="persona"] #bgfixed{overflow:hidden}
[data-skin="persona"] #bgfixed::after{
  content:'TODAY';
  position:absolute;right:-6vw;bottom:8vh;
  font-size:33vw;font-weight:900;font-style:italic;line-height:.8;
  letter-spacing:-1.5vw;
  color:rgba(0,165,200,.085);
  white-space:nowrap;pointer-events:none;
}
[data-skin="persona"] body[data-view="report"] #bgfixed::after{content:'STATUS'}
[data-skin="persona"] body[data-view="train"] #bgfixed::after{content:'TRAINING'}
[data-skin="persona"] body[data-view="profile"] #bgfixed::after{content:'PROFILE'}
[data-skin="persona"] body[data-view="game"] #bgfixed::after{content:'MINIGAME'}
[data-skin="persona"] body[data-view="shop"] #bgfixed::after{content:'SHOP'}
[data-skin="persona"] body[data-view="add"] #bgfixed::after{content:'SELECT'}

/* ---------- P3R 数据面板 ---------- */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.statcell{position:relative;padding:12px 12px 30px}
.sk{display:block;font-size:11px;color:var(--mute);letter-spacing:.5px}
.sv{display:block;font-size:26px;font-weight:800;line-height:1.1;margin:2px 0 1px}
.sv i{font-size:11px;font-style:normal;font-weight:600;color:var(--mute);margin-left:3px}
.st{display:block;font-size:10px;color:var(--mute)}
.sbar{position:absolute;left:12px;right:12px;bottom:12px;height:8px;border-radius:4px;background:var(--el);overflow:hidden;display:block}
.sbar > i{display:block;height:100%;border-radius:4px;background:var(--green)}

[data-skin="persona"] .statgrid{gap:0;border:2px solid #0a0e14;background:#fff;box-shadow:5px 5px 0 #0a0e14}
[data-skin="persona"] .statcell{padding:14px 14px 34px;border-right:2px solid #0a0e14;border-bottom:2px solid #0a0e14}
[data-skin="persona"] .statcell:nth-child(2n){border-right:none}
[data-skin="persona"] .statcell:nth-last-child(-n+2){border-bottom:none}
[data-skin="persona"] .sk{
  font-size:10px;font-weight:800;letter-spacing:1.5px;color:#0a0e14;
  text-transform:uppercase;
}
[data-skin="persona"] .sv{
  font-size:30px;font-style:italic;font-weight:900;letter-spacing:-1.5px;color:#0a0e14;
  text-shadow:2px 2px 0 rgba(0,165,200,.85);
}
[data-skin="persona"] .st{font-size:10px;color:#6c8090;letter-spacing:.3px}
[data-skin="persona"] .sbar{left:14px;right:14px;bottom:14px;height:10px;border-radius:0;background:#e2eef5;border:2px solid #0a0e14}
[data-skin="persona"] .sbar > i{border-radius:0;background:rgb(0,165,200)}


/* ==================== 补齐缺失的基础排版（此前完全没写样式） ==================== */
/* 训练分化选择 */
.splits{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.split{padding:9px 11px;border-radius:10px;background:var(--el2);cursor:pointer}
.split b{display:block;font-size:12.5px;font-weight:700;line-height:1.35}
.split span{display:block;font-size:10px;color:var(--mute);margin-top:3px;line-height:1.45}
.split.on{background:var(--soft);box-shadow:inset 0 0 0 1.5px var(--green)}
.split.on b{color:var(--green)}

/* 今日推荐动作 */
.exlist{margin-top:10px}
.exgrp{margin-bottom:12px}
.exgrp:last-child{margin-bottom:2px}
.exgh{font-size:11px;font-weight:700;color:var(--green);letter-spacing:.6px;margin-bottom:5px}
.ex{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:12px}
.ex:last-child{border-bottom:none}
.en{color:var(--ink2)}
.es{color:var(--mute);font-size:11px;white-space:nowrap}

/* 分化逐日安排 */
.dayrow{padding:10px 0;border-bottom:1px solid var(--line)}
.dayrow:last-child{border-bottom:none}
.dh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.dn{font-size:11px;font-weight:800;color:var(--green);min-width:20px;flex:0 0 auto}
.dname{font-size:13px;font-weight:700;flex:1;line-height:1.35}
.dtag{font-size:9.5px;padding:1px 6px;border-radius:6px;background:var(--green);color:#fff;font-weight:700;flex:0 0 auto}
.dg{font-size:10.5px;color:var(--mute);margin-bottom:4px;letter-spacing:.4px}
.dex{font-size:11px;color:var(--ink2);line-height:1.75}
.rest{font-size:11px;color:var(--mute2)}

/* 最常吃 */
.topfood{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.topfood:last-child{border-bottom:none}
.rk{width:20px;height:20px;flex:0 0 20px;border-radius:5px;background:var(--el);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:var(--green)}
.nm{flex:1;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct{font-size:11px;color:var(--mute);white-space:nowrap;flex:0 0 auto}

/* 餐次分布图例 */
.mixlg{display:flex;flex-wrap:wrap;gap:7px 16px;margin-top:10px}
.mixlg > *{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ink2)}
.cb{width:9px;height:9px;border-radius:2px;flex:0 0 9px;display:inline-block}
.cl{font-size:11px;color:var(--mute)}

/* 小游戏通用 */
.gamewrap{padding:2px 0 8px}
.gamehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:13px}
.gamehead b{font-size:14px}
.gstage{position:relative;margin:0 auto}
.gclock{font-size:13px;font-weight:800;color:var(--green);font-variant-numeric:tabular-nums}
.qt{font-size:14px;line-height:1.75;margin-bottom:10px}
.masked{text-align:center;font-size:27px;font-weight:800;letter-spacing:4px;line-height:1.6;word-break:break-all}
.mk{color:var(--ink)}
.bl{color:var(--green);border-bottom:2px solid var(--green);padding:0 3px;margin:0 1px}
.scratchgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.scratchcell{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border-radius:5px;background:var(--el);font-size:12px;font-weight:800;color:transparent;user-select:none}
.scratchcell.open{background:var(--soft);color:var(--green)}
.moles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mole{aspect-ratio:1/1;border-radius:12px;background:var(--el);display:flex;align-items:center;justify-content:center;font-size:26px}

/* 商店 */
.shopitem{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.shopitem:last-child{border-bottom:none}
.si{font-size:18px;flex:0 0 auto;line-height:1}
.sn{font-size:12.5px;font-weight:700;line-height:1.4}
.sd{font-size:10.5px;color:var(--mute);line-height:1.6;margin-top:2px}
.buy{margin-left:auto;flex:0 0 auto;padding:7px 13px;border-radius:15px;background:var(--green);color:#fff;font-size:11px;font-weight:700;white-space:nowrap}

/* 视频 / 知识 */
.kbh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:6px;line-height:1.4}
.kbchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.plantags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.karr{color:var(--mute);flex:0 0 auto}

/* 其他零散 */
.quickacts{display:flex;gap:8px;margin-top:12px}
.goalbox{font-size:12px;line-height:1.95;color:var(--ink2)}
.streak{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--mute)}
.spark{display:inline-block}
.cw{display:inline-flex;align-items:center;gap:4px}
.full{width:100%}
.add{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--green);font-weight:700}

/* ==================== P3R 动效与骨架 ==================== */
/* 卡片标题：黑底斜切贴纸（替换之前的青色竖条） */
[data-skin="persona"] .card > b{
  display:inline-block;
  background:#0a0e14;color:#fff;
  padding:5px 18px 5px 12px;
  font-size:12.5px;font-weight:800;font-style:normal;
  clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);
  margin-bottom:10px;
  padding-left:12px;
}
[data-skin="persona"] .card > b::before{display:none}
[data-skin="persona"] .card-title{
  display:inline-block;background:#0a0e14;color:#fff;
  padding:5px 18px 5px 12px;font-size:12.5px;font-weight:800;
  clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);
  margin-bottom:10px;
}
[data-skin="persona"] .card-title::before{display:none}

/* 列表行按下：青色反白 */
[data-skin="persona"] .f:active,
[data-skin="persona"] .item:active,
[data-skin="persona"] .rec:active{background:rgba(0,165,200,.14)}

/* 页面切换：从左横向擦出（the-velvet 的 p3MenuReveal） */
[data-skin="persona"] .p3in{animation:p3reveal .46s cubic-bezier(.22,.9,.24,1) both}
/* 卡片错峰入场 */
@keyframes p3card{
  0%{opacity:0;transform:translateY(18px) skewX(-2deg)}
  100%{opacity:1;transform:none}
}
[data-skin="persona"] .p3in > .card,
[data-skin="persona"] .p3in > .coinbar,
[data-skin="persona"] .p3in > .seg3,
[data-skin="persona"] .p3in > .datebar{animation:p3card .42s cubic-bezier(.2,.8,.2,1) both}
[data-skin="persona"] .p3in > *:nth-child(1){animation-delay:.02s}
[data-skin="persona"] .p3in > *:nth-child(2){animation-delay:.06s}
[data-skin="persona"] .p3in > *:nth-child(3){animation-delay:.10s}
[data-skin="persona"] .p3in > *:nth-child(4){animation-delay:.14s}
[data-skin="persona"] .p3in > *:nth-child(5){animation-delay:.18s}
[data-skin="persona"] .p3in > *:nth-child(6){animation-delay:.22s}
[data-skin="persona"] .p3in > *:nth-child(n+7){animation-delay:.26s}
/* 切页时扫过一条青色斜带 */
@keyframes p3flash{
  0%{opacity:.85;transform:translateX(-120%) skewX(-16deg)}
  100%{opacity:0;transform:translateX(220%) skewX(-16deg)}
}
[data-skin="persona"] .p3in::before{
  content:'';position:fixed;top:0;left:0;width:42%;height:100%;
  background:linear-gradient(90deg,rgba(0,165,200,0),rgba(0,165,200,.28),rgba(0,165,200,0));
  pointer-events:none;z-index:60;
  animation:p3flash .55s ease-out both;
}

/* 按下：位移 1px 2px + 变暗提饱和（P3R 斜轴下沉） */
[data-skin="persona"] .btn,
[data-skin="persona"] .split,
[data-skin="persona"] .qa,
[data-skin="persona"] .chip,
[data-skin="persona"] .cat,
[data-skin="persona"] .mt,
[data-skin="persona"] .g,
[data-skin="persona"] .opt,
[data-skin="persona"] .kwtile,
[data-skin="persona"] [data-act]{
  transition:translate .22s cubic-bezier(.16,1,.3,1),filter .22s cubic-bezier(.16,1,.3,1);
}
[data-skin="persona"] .btn:active,
[data-skin="persona"] .split:active,
[data-skin="persona"] .qa:active,
[data-skin="persona"] .chip:active,
[data-skin="persona"] .cat:active,
[data-skin="persona"] .mt:active,
[data-skin="persona"] .g:active,
[data-skin="persona"] .opt:active,
[data-skin="persona"] .kwtile:active{
  translate:1px 2px;
  filter:brightness(.93) saturate(1.15);
}

/* 点击涟漪 */
[data-skin="persona"] [data-act]:not(.fab){position:relative;overflow:hidden}
[data-skin="persona"] .fab{
  position:fixed;right:16px;bottom:calc(78px + var(--safeB));
  width:58px;height:58px;z-index:41;
}
@keyframes p3ripple{
  0%{transform:scale(0);opacity:.45}
  70%{transform:scale(1);opacity:.18}
  100%{opacity:0}
}
[data-skin="persona"] .ripple{
  position:absolute;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(0,165,200,.75),rgba(0,165,200,.15) 70%);
  animation:p3ripple .5s ease-out forwards;
}

/* 底部导航：选中项青色斜块 */
[data-skin="persona"] .tabbar .t{position:relative;overflow:hidden;z-index:0}
[data-skin="persona"] .tabbar .t.on{color:#fff;font-weight:900}
[data-skin="persona"] .tabbar .t.on::before{
  content:'';position:absolute;left:50%;top:0;transform:translateX(-50%);
  width:54px;height:100%;background:rgb(0,165,200);
  clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);
  z-index:-1;
}
/* 底部留白，避免胶囊按钮压住最后一张卡 */
[data-skin="persona"] .wrap{padding-bottom:104px}
/* 分化 / 商店 / 游戏在 persona 下的黑边处理 */
[data-skin="persona"] .splits{gap:8px}
[data-skin="persona"] .split{padding:9px 11px}
[data-skin="persona"] .split.on{background:rgb(0,165,200);color:#fff}
[data-skin="persona"] .split.on b{color:#fff}
[data-skin="persona"] .split.on span{color:rgba(255,255,255,.85)}
[data-skin="persona"] .rk{background:#0a0e14;color:#fff;border-radius:0}
[data-skin="persona"] .dtag{border-radius:0;background:#0a0e14}
[data-skin="persona"] .buy{border-radius:0;border:2px solid #0a0e14;box-shadow:3px 3px 0 #0a0e14;font-weight:800}
[data-skin="persona"] .scratchcell{border-radius:0;border:2px solid #0a0e14;background:#e6f2f8}
[data-skin="persona"] .scratchcell.open{background:rgb(0,165,200);color:#fff}
[data-skin="persona"] .mole{border-radius:0;border:2px solid #0a0e14;background:#e6f2f8}
[data-skin="persona"] .exgh{color:#0a0e14;font-weight:800}


/* ================= 面板式统计（雷达） ================= */
.radar{display:block;width:100%;max-width:270px;margin:4px auto 0;color:var(--ink2)}

/* ================= 排版向 the-velvet 靠拢 ================= */
[data-skin="persona"] .datebar .d1{
  font-size:29px;font-style:italic;font-weight:900;letter-spacing:-1.2px;
  color:#0a0e14;
  text-shadow:2px 2px 0 #ffffff, 4px 4px 0 rgba(0,165,200,.95);
}
[data-skin="persona"] .datebar .d1::before{display:none}
[data-skin="persona"] .datebar .d2{font-size:10.5px;letter-spacing:2.5px;color:#6c8090;margin-top:2px}
[data-skin="persona"] #bgfixed::before{

/* ================= 日期模块（the-velvet 排版） ================= */
.datebar .dblock{display:flex;align-items:center;justify-content:center;gap:7px;line-height:1}
.datebar .dnum{font-size:21px;font-weight:900;line-height:1;letter-spacing:-.5px}
.datebar .dside{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
.datebar .dside b{font-size:8.5px;font-weight:800;letter-spacing:1.2px}
.datebar .dside i{font-style:normal;font-size:8px;color:var(--mute);letter-spacing:1.2px;margin-top:1px}
[data-skin="persona"] .datebar .dnum{
  font-size:33px;font-style:italic;letter-spacing:-2px;color:#0a0e14;
  text-shadow:2px 2px 0 #ffffff, 3px 3px 0 rgba(0,165,200,.9);
}
[data-skin="persona"] .datebar .dside b{font-size:10px;color:#0a0e14}
[data-skin="persona"] .datebar .dside i{font-size:9px;color:#6c8090}
[data-skin="persona"] .datebar .d2{font-size:10px;letter-spacing:1.2px;color:#8aa0ad}

/* ================= 星形 ================= */
.starrow{display:flex;align-items:center;justify-content:center;gap:6px;margin:2px 0 10px}
.star{fill:none;stroke:var(--mute2);stroke-width:1.8;stroke-linejoin:round}
.star.on{fill:var(--green);stroke:var(--green)}
[data-skin="persona"] .star{stroke:rgba(10,40,60,.22)}
[data-skin="persona"] .star.on{fill:rgb(0,165,200);stroke:rgb(0,165,200);filter:drop-shadow(0 1px 2px rgba(0,165,200,.55))}
[data-skin="persona"] .btn .star{vertical-align:-2px;margin-left:4px}

/* ================= 卡片软化：去黑边、柔阴影、左侧蓝线 ================= */
[data-skin="persona"] .card,
[data-skin="persona"] .sumcard,
[data-skin="persona"] .flist{
  border:none;
  border-radius:16px;
  border-left:4px solid rgba(0,165,200,.9);
  box-shadow:0 3px 16px rgba(10,40,60,.09), 0 1px 3px rgba(10,40,60,.06);
}
[data-skin="persona"] .card::before{display:none}
[data-skin="persona"] .card > b{
  background:none;color:#0a0e14;clip-path:none;
  padding:0 0 0 13px;font-size:13.5px;font-weight:800;position:relative;
  margin-bottom:10px;display:inline-block;font-style:normal;
}
[data-skin="persona"] .card > b::before{
  content:'';position:absolute;left:0;top:50%;margin-top:-7px;
  width:4px;height:14px;background:rgb(0,165,200);display:block;
}
[data-skin="persona"] .card-title{
  background:none;color:#0a0e14;clip-path:none;
  padding:0 0 0 13px;position:relative;display:inline-block;font-weight:800;margin-bottom:10px;
}
[data-skin="persona"] .card-title::before{
  content:'';position:absolute;left:0;top:50%;margin-top:-7px;
  width:4px;height:14px;background:rgb(0,165,200);
}
[data-skin="persona"] .btn{border:none;border-radius:12px;box-shadow:0 4px 12px rgba(0,165,200,.35)}
[data-skin="persona"] .btn.gray{background:rgba(0,165,200,.10);box-shadow:none;color:#2c3d49}
[data-skin="persona"] .split,
[data-skin="persona"] .opt,
[data-skin="persona"] .goals .g,
[data-skin="persona"] .qa,
[data-skin="persona"] .kwtile{
  border:1.5px solid rgba(10,40,60,.12);border-radius:12px;box-shadow:none;background:#fff;
}
[data-skin="persona"] .split.on,
[data-skin="persona"] .opt.on,
[data-skin="persona"] .goals .g.on,
[data-skin="persona"] .kwtile.on{background:rgb(0,165,200);border-color:rgb(0,165,200);color:#fff}
[data-skin="persona"] .split.on b,
[data-skin="persona"] .split.on span{color:#fff}
[data-skin="persona"] .tabbar{border-top:1px solid rgba(10,40,60,.10);background:rgba(255,255,255,.96)}
[data-skin="persona"] .statgrid{
  border:1.5px solid rgba(10,40,60,.12);border-radius:14px;
  box-shadow:none;overflow:hidden;background:#fff;
}
[data-skin="persona"] .statcell{border-color:rgba(10,40,60,.12)}


/* ================= 补齐基础样式（第二批：此前只有 persona 规则） ================= */
/* 代币条 */
.coinbar{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--card);border-radius:14px;padding:12px 15px;margin-bottom:12px;overflow:hidden}
.coinbar > div:first-child{flex:1;min-width:0}
.cb{display:flex;align-items:baseline;gap:5px;flex-wrap:nowrap}
.cb b{font-size:25px;font-weight:900;line-height:1.15;color:var(--green);flex:0 0 auto}
.cl{font-size:10.5px;color:var(--mute);letter-spacing:.5px;white-space:nowrap;flex:0 0 auto}
.coinbar .cl[style]{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin-left:0 !important}
.cw{font-size:10.5px;color:var(--mute);text-align:right;line-height:1.45;white-space:nowrap;flex:0 0 auto}
.cw b{font-size:15px;color:var(--ink)}

/* 三档切换 */
.seg3{display:flex;gap:5px;background:var(--el2);border-radius:12px;padding:4px;margin-bottom:12px}
.seg3 .s{flex:1;text-align:center;padding:8px 2px;font-size:12px;color:var(--mute);
  border-radius:9px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg3 .s.on{background:var(--green);color:#fff;font-weight:800}

/* 小游戏入口 */
.qa{display:flex;align-items:center;gap:9px;padding:11px 13px;border-radius:12px;
  background:var(--el2);font-size:12.5px;font-weight:600;margin-bottom:8px}
.qa span{font-size:16px;line-height:1}

/* 游戏结算 */
.gres{text-align:center;padding:16px 8px}
.gres .big{font-size:38px;font-weight:900;color:var(--green);line-height:1.1}
.gres .sub{font-size:12px;color:var(--mute);margin-top:6px;line-height:1.6}

/* 营养素条 */
.progbar{height:8px;border-radius:5px;background:var(--el);overflow:hidden;margin-top:6px}
.progbar i{display:block;height:100%;border-radius:5px;background:var(--green)}
.mixbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--el);margin-top:8px}
.mixbar i{height:100%}

/* 部位标签 */
.ptag{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:8px;
  background:var(--el2);font-size:11px;color:var(--ink2);margin:0 6px 6px 0}
.ptag.add{color:var(--green);font-weight:700}
.ptag .x{color:var(--mute2);margin-left:2px}

/* 知识条目 */
.kbi{padding:11px 0;border-bottom:1px solid var(--line)}
.kbi:last-child{border-bottom:none}
.kbb{font-size:12px;line-height:1.85;color:var(--ink2);margin-top:5px}
.kbchip{display:inline-block;padding:2px 8px;border-radius:7px;background:var(--el);
  font-size:10px;color:var(--mute);margin-right:6px}

/* persona 适配 */
[data-skin="persona"] .coinbar{
  background:#fff;border-radius:16px;
  box-shadow:0 3px 16px rgba(10,40,60,.10);
  border-left:4px solid rgba(0,165,200,.9);
}
[data-skin="persona"] .seg3{background:rgba(0,165,200,.10)}
[data-skin="persona"] .seg3 .s.on{background:rgb(0,165,200)}
[data-skin="persona"] .qa{background:#fff;border:1.5px solid rgba(10,40,60,.12)}
[data-skin="persona"] .ptag{background:rgba(0,165,200,.12);border-radius:8px}
[data-skin="persona"] .progbar{background:rgba(10,40,60,.10)}


/* ================= P3R 图形语言补充 ================= */
/* 日期条右侧的两枚小色块（模仿标题旁的装饰方块） */
[data-skin="persona"] .datebar .mid{position:relative}
[data-skin="persona"] .datebar .mid::after{
  content:'';position:absolute;right:-2px;top:2px;width:7px;height:7px;
  background:rgb(0,165,200);
  box-shadow:11px 0 0 rgba(0,165,200,.45), 11px 11px 0 rgba(0,165,200,.22);
  transform:skewX(-12deg);
  pointer-events:none;
}
/* 卡片标题后的斜向短线 */
[data-skin="persona"] .card > b::after{
  content:'';display:inline-block;vertical-align:middle;
  width:22px;height:6px;margin-left:8px;
  background:repeating-linear-gradient(115deg, rgba(0,165,200,.85) 0 3px, rgba(0,0,0,0) 3px 6px);
}
/* 星星呼吸光 */
@keyframes starPulse{
  0%,100%{opacity:.55;transform:scale(.94)}
  50%{opacity:1;transform:scale(1.06)}
}
[data-skin="persona"] .star.on{animation:starPulse 2.4s ease-in-out infinite}
[data-skin="persona"] .star.on:nth-child(2){animation-delay:.18s}
[data-skin="persona"] .star.on:nth-child(3){animation-delay:.36s}
[data-skin="persona"] .star.on:nth-child(4){animation-delay:.54s}
[data-skin="persona"] .star.on:nth-child(5){animation-delay:.72s}
/* 主按钮的斜切碎片贴角 */
[data-skin="persona"] .btn{position:relative;overflow:hidden}
[data-skin="persona"] .btn::before{
  content:'';position:absolute;right:0;top:0;width:0;height:0;
  border-top:14px solid rgba(255,255,255,.55);
  border-left:14px solid transparent;
  pointer-events:none;
}
/* 数据面板数字下的斜线底纹 */
[data-skin="persona"] .statcell::after{
  content:'';position:absolute;right:6px;bottom:34px;width:26px;height:3px;
  background:repeating-linear-gradient(115deg, rgba(0,165,200,.55) 0 2px, rgba(0,0,0,0) 2px 5px);
  pointer-events:none;
}
[data-skin="persona"] .statcell{position:relative}
/* 幽灵大字加一层描边质感 */
[data-skin="persona"] #bgfixed::after{
  -webkit-text-stroke:1px rgba(0,105,165,.10);
}


/* ================= P3R 字体栈 ================= */
[data-skin="persona"] body{
  font-family:"Arial Black","Helvetica Neue",-apple-system,BlinkMacSystemFont,
    "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  letter-spacing:.1px;
}
[data-skin="persona"] .card > b,
[data-skin="persona"] .card-title,
[data-skin="persona"] .datebar .dnum,
[data-skin="persona"] .kbig b,
[data-skin="persona"] .sv,
[data-skin="persona"] .ringmid .num,
[data-skin="persona"] .coinbar .cb b,
[data-skin="persona"] .gres .big,
[data-skin="persona"] .three .a b,
[data-skin="persona"] .grid2 .v{
  font-family:"Arial Black","Helvetica Neue","PingFang SC","Hiragino Sans GB",sans-serif;
  font-weight:900;
  letter-spacing:-.5px;
}
[data-skin="persona"] .datebar .dside b,
[data-skin="persona"] .datebar .dside i,
[data-skin="persona"] .datebar .d2{
  font-family:"Helvetica Neue",Arial,sans-serif;
  letter-spacing:2px;
}
/* 数字等宽，避免跳动 */
[data-skin="persona"] .sv,
[data-skin="persona"] .kbig b,
[data-skin="persona"] .coinbar .cb b,
[data-skin="persona"] .gclock{font-variant-numeric:tabular-nums}

/* ================= 动画柔化 ================= */
@keyframes p3reveal{
  0%{opacity:0;transform:translateY(12px) scale(.988)}
  100%{opacity:1;transform:none}
}
[data-skin="persona"] .p3in{
  animation:p3reveal .46s cubic-bezier(.33,.75,.15,1) both;
  will-change:opacity,transform;
}
@keyframes p3card{
  0%{opacity:0;transform:translateY(14px)}
  100%{opacity:1;transform:none}
}
[data-skin="persona"] .p3in > .card,
[data-skin="persona"] .p3in > .coinbar,
[data-skin="persona"] .p3in > .seg3,
[data-skin="persona"] .p3in > .datebar,
[data-skin="persona"] .p3in > .statgrid{
  animation:p3card .5s cubic-bezier(.33,.75,.15,1) both;
}
/* 卡片按下给一点物理回弹 */
[data-skin="persona"] .card{transition:transform .28s cubic-bezier(.34,1.4,.5,1),box-shadow .28s ease}
[data-skin="persona"] .split,
[data-skin="persona"] .opt,
[data-skin="persona"] .g,
[data-skin="persona"] .qa{
  transition:transform .26s cubic-bezier(.34,1.4,.5,1),background .2s ease,color .2s ease;
}
[data-skin="persona"] .split:active,
[data-skin="persona"] .opt:active,
[data-skin="persona"] .g:active,
[data-skin="persona"] .qa:active{transform:scale(.965)}

<script>
/*__LOGIC_START__*/
/* ================= 食物库（每100g，参考中国食物成分表 / USDA） ================= */

/* ---------------- 日期 ---------------- */
function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function fmtDate(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function parseDate(s) { const p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function todayStr() { return fmtDate(new Date()); }
function addDays(dateStr, n) { const d = parseDate(dateStr); d.setDate(d.getDate() + n); return fmtDate(d); }
const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
function dayLabel(s) {
  const t = todayStr();
  if (s === t) return '今天';
  if (s === addDays(t, -1)) return '昨天';
  if (s === addDays(t, 1)) return '明天';
  const d = parseDate(s);
  return (d.getMonth() + 1) + '月' + d.getDate() + '日 周' + WEEK[d.getDay()];
}
function shortDate(s) { const d = parseDate(s); return (d.getMonth() + 1) + '/' + d.getDate(); }
function weekLabel(s) { return '周' + WEEK[parseDate(s).getDay()]; }
function lastNDates(n, end) {
  const e = end || todayStr(); const out = [];
  for (let i = n - 1; i >= 0; i--) out.push(addDays(e, -i));
  return out;
}

/* ---------------- 营养计算 ---------------- */
function num(v, fb) { const n = Number(v); return isFinite(n) && n > 0 ? n : fb; }

function bmr(p) {
  const w = num(p.weight, 70), h = num(p.height, 175), a = num(p.age, 25);
  const base = 10 * w + 6.25 * h - 5 * a;
  return Math.round(p.gender === 'female' ? base - 161 : base + 5);
}
function actFactor(p) {
  const f = ACTIVITY.filter(function (x) { return x.key === (p.activity || 'moderate'); })[0];
  return f ? f.factor : 1.55;
}
function tdee(p) { return Math.round(bmr(p) * actFactor(p)); }
function goalOf(p) {
  return GOALS.filter(function (x) { return x.key === (p.goal || 'maintain'); })[0] || GOALS[1];
}
/**
 * 每日目标（套表口径）
 * - 无训练日消耗 = BMR × 活动系数（活动系数只含日常活动）
 * - 训练日额外 +150/200/250 大卡
 * - 减脂：总消耗 × (1 − 赤字)，赤字 20/28/36%
 * - 蛋白 1.8/1.6 g/kg（训练日/休息日），脂肪固定 0.74 g/kg，碳水吃剩余
 * @param {object} p 档案
 * @param {{trainDay?:boolean}} opts 今天是不是力量训练日
 */
function targets(p, opts) {
  const pr = p || DEFAULT_PROFILE;
  const trainDay = !!(opts && opts.trainDay);
  const base = bmr(pr);
  const noEx = Math.round(base * actFactor(pr));
  const exp = EXP_LEVELS.filter(function (x) { return x.key === (pr.exp || 'mid'); })[0] || EXP_LEVELS[1];
  const trainKcal = trainDay ? exp.kcal : 0;
  const total = noEx + trainKcal;
  const goal = goalOf(pr);
  const weight = num(pr.weight, 70);

  let kcal;
  let deficitPct = 0;
  if (goal.key === 'cut') {
    const d = DEFICIT_LEVELS.filter(function (x) { return x.key === (pr.deficit || 'standard'); })[0] || DEFICIT_LEVELS[1];
    deficitPct = d.deficit;
    kcal = Math.round(total * (1 - d.deficit));
  } else if (goal.key === 'bulk') {
    kcal = Math.round(total * 1.10);
    deficitPct = -0.10;
  } else {
    kcal = total;
  }
  // 安全下限：套表休息日可低至约 0.91×BMR，所以下限放到 0.9×BMR 与 1200 取大
  kcal = Math.max(kcal, Math.round(base * 0.9), 1200);

  const perKg = trainDay ? goal.proteinPerKg : (goal.proteinPerKgRest || goal.proteinPerKg);
  const protein = Math.round(weight * perKg);
  const fat = Math.round(weight * FAT_PER_KG);
  let carb = Math.round((kcal - protein * 4 - fat * 9) / 4);
  if (carb < 40) carb = 40;

  const fiber = Math.round(Math.min(40, Math.max(25, (kcal / 1000) * 14)));

  return {
    kcal: kcal, protein: protein, carb: carb, fat: fat, fiber: fiber,
    water: Math.round(weight * 35),
    bmr: base, tdee: total, noEx: noEx, trainKcal: trainKcal, trainDay: trainDay,
    goalName: goal.name, goalDesc: goal.desc,
    proteinPerKg: perKg, fatPerKg: FAT_PER_KG,
    carbPerKg: Math.round((carb / weight) * 100) / 100,
    deficitPct: Math.round(deficitPct * 100),
    deficitName: (goal.key === 'cut'
      ? ((DEFICIT_LEVELS.filter(function (x) { return x.key === (pr.deficit || 'standard'); })[0] || DEFICIT_LEVELS[1]).name)
      : (goal.key === 'bulk' ? '盈余' : '持平')),
    expName: exp.name,
    proteinKcalPct: Math.round(((protein * 4) / kcal) * 100),
    carbKcalPct: Math.round(((carb * 4) / kcal) * 100),
    fatKcalPct: Math.round(((fat * 9) / kcal) * 100)
  };
}
function calcFood(food, grams) {
  const g = num(grams, 100) / 100;
  return {
    grams: Math.round(num(grams, 100)),
    kcal: Math.round((food.kcal || 0) * g),
    protein: Math.round((food.protein || 0) * g * 10) / 10,
    carb: Math.round((food.carb || 0) * g * 10) / 10,
    fat: Math.round((food.fat || 0) * g * 10) / 10,
    fiber: Math.round((food.fiber || 0) * g * 10) / 10
  };
}
function sumRecords(list) {
  const o = { kcal: 0, protein: 0, carb: 0, fat: 0, fiber: 0 };
  (list || []).forEach(function (r) {
    o.kcal += r.kcal || 0; o.protein += r.protein || 0; o.carb += r.carb || 0;
    o.fat += r.fat || 0; o.fiber += r.fiber || 0;
  });
  ['protein', 'carb', 'fat', 'fiber'].forEach(function (k) { o[k] = Math.round(o[k] * 10) / 10; });
  o.kcal = Math.round(o.kcal);
  return o;
}
function pct(v, t) { if (!t || t <= 0) return 0; return Math.min(100, Math.round((v / t) * 100)); }
function searchFoods(kw) {
  const q = String(kw || '').trim().toLowerCase();
  if (!q) return [];
  return FOODS.filter(function (f) {
    return f.name.toLowerCase().indexOf(q) > -1 || (f.py && f.py.indexOf(q) > -1);
  });
}

const KEY = 'nutrition_diary_v1';
const KEY_IMG = 'nutrition_diary_bgimg';
let BG_IMAGE = '';

function defaultData() {
  return {
    profile: Object.assign({}, DEFAULT_PROFILE),
    logs: {}, water: {}, custom: [], weights: [],
    fav: [], videos: {}, settings: Object.assign({}, DEFAULT_SETTINGS),
    plan: { split: 'ppl3_a', days: {}, cycle: 0, checkins: {}, coins: 0, weekPaid: {}, buffs: {} },
    quizDone: { poem: [], word: [] }
  };
}

const store = {
  data: defaultData(),
  load: function () {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return;
      let d = null;
      try {
        d = JSON.parse(raw);
      } catch (e) {
        // 数据损坏：原始字符串留一份底，再回退默认值，别让用户以为记录凭空没了
        try { localStorage.setItem(KEY + '_broken_' + Date.now(), raw); } catch (e2) { }
        this.data = defaultData();
        return;
      }
      if (!d || typeof d !== 'object' || Array.isArray(d)) return;
      this.data = {
        profile: Object.assign({}, DEFAULT_PROFILE,
          (d.profile && typeof d.profile === 'object' && !Array.isArray(d.profile)) ? d.profile : {}),
        logs: (d.logs && typeof d.logs === 'object' && !Array.isArray(d.logs)) ? d.logs : {},
        water: (d.water && typeof d.water === 'object' && !Array.isArray(d.water)) ? d.water : {},
        custom: Array.isArray(d.custom) ? d.custom.filter(function (f) { return f && f.name; }) : [],
        weights: Array.isArray(d.weights) ? d.weights.filter(function (x) { return x && x.date && Number(x.weight) > 0; }) : [],
        fav: Array.isArray(d.fav) ? d.fav.filter(function (x) { return typeof x === 'string'; }) : [],
        videos: (d.videos && typeof d.videos === 'object' && !Array.isArray(d.videos)) ? d.videos : {},
        plan: Object.assign({ split: 'ppl3_a', days: {}, cycle: 0, checkins: {}, coins: 0, weekPaid: {}, buffs: {} },
          (d.plan && typeof d.plan === 'object') ? d.plan : {}),
        quizDone: Object.assign({ poem: [], word: [] }, (d.quizDone && typeof d.quizDone === 'object') ? d.quizDone : {}),
        settings: Object.assign({}, DEFAULT_SETTINGS,
          (d.settings && typeof d.settings === 'object') ? d.settings : {})
      };
    } catch (e) { /* 忽略损坏数据 */ }
  },
  save: function () {
    try { localStorage.setItem(KEY, JSON.stringify(this.data)); }
    catch (e) {
      if (!this._warned) {
        this._warned = true;
        toast('无法保存：当前浏览器禁止本地存储');
      }
    }
  }
};

/* ================= 工具 ================= */
const $ = function (id) { return document.getElementById(id); };
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
let toastTimer = null;
function toast(msg) {
  const old = document.querySelector('.toast');
  if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.remove(); }, 1600);
}
function newId() { return 'r' + Date.now().toString(36) + Math.floor(Math.random() * 999).toString(36); }
function getLogs(d) { return (store.data.logs[d] || []).slice(); }
function setLogs(d, list) {
  if (!list.length) delete store.data.logs[d]; else store.data.logs[d] = list;
  store.save();
}
function allFoods() { return FOODS.concat(store.data.custom); }
function foodById(id) {
  return FOODS.filter(function (f) { return f.id === id; })[0] ||
    store.data.custom.filter(function (f) { return f.id === id; })[0] || null;
}
function getWater(d) { return Number(store.data.water[d]) || 0; }
function setWater(d, v) {
  v = Math.max(0, Math.round(v));
  if (v === 0) delete store.data.water[d]; else store.data.water[d] = v;
  store.save();
}
function freqFoodIds(limit) {
  const count = {};
  lastNDates(30).forEach(function (d) {
    (store.data.logs[d] || []).forEach(function (r) {
      if (!r.foodId) return;
      if (!count[r.foodId]) count[r.foodId] = { c: 0, last: 0 };
      count[r.foodId].c++;
      count[r.foodId].last = Math.max(count[r.foodId].last, r.ts || 0);
    });
  });
  return Object.keys(count).sort(function (a, b) {
    return count[b].c - count[a].c || count[b].last - count[a].last;
  }).slice(0, limit || 14);
}
function guessMeal() {
  const h = new Date().getHours();
  if (h < 10) return 'breakfast';
  if (h < 15) return 'lunch';
  if (h < 21) return 'dinner';
  return 'snack';
}

function viewToday() {
  const d = S.date;
  const t = targets(store.data.profile, { trainDay: isTrainDay(d) });
  const recs = getLogs(d);
  const in_ = sumRecords(recs);
  const over = in_.kcal > t.kcal;
  const remain = Math.abs(t.kcal - in_.kcal);
  const ratio = t.kcal > 0 ? Math.min(1, in_.kcal / t.kcal) : 0;
  const C = 2 * Math.PI * 46;
  const accRgb = ((store.data.settings || {}).skin === 'persona')
    ? PERSONA_ACC.a
    : (ACCENTS[(store.data.settings || {}).accent] || ACCENTS.green).a;
  const ringFrom = over ? 'rgb(252,165,165)' : lighten(accRgb, 0.34);
  const ringTo = over ? 'rgb(220,38,38)' : 'rgb(' + accRgb + ')';

  const macros = [
    { n: '蛋白质', v: in_.protein, t: t.protein, c: 'var(--blue)' },
    { n: '碳水', v: in_.carb, t: t.carb, c: 'var(--amber)' },
    { n: '脂肪', v: in_.fat, t: t.fat, c: 'var(--purple)' }
  ];

  const water = getWater(d);
  const cupMl = 250;
  const cupCount = Math.max(8, Math.ceil(t.water / cupMl));
  let cups = '';
  for (let i = 0; i < cupCount; i++) {
    const on = (i + 1) * cupMl <= water + 1;
    cups += '<div class="cup ' + (on ? 'on' : '') + '" data-act="cup" data-i="' + i + '">' + (on ? '💧' : '○') + '</div>';
  }

  const mealHtml = MEALS.map(function (m) {
    const items = recs.filter(function (r) { return r.meal === m.key; });
    const kcal = items.reduce(function (s, r) { return s + (r.kcal || 0); }, 0);
    const rows = items.map(function (r) {
      return '<div class="item"><div class="row" style="gap:6px;min-width:0">' +
        '<span class="nm">' + esc(r.name) + '</span><span class="g">' + r.grams + 'g</span></div>' +
        '<div class="row"><span class="kc">' + r.kcal + '</span>' +
        '<span class="del" data-act="del" data-id="' + r.id + '">×</span></div></div>';
    }).join('');
    return '<div class="card meal">' +
      '<div class="mealhead"><div class="l"><span class="ic">' + m.icon + '</span>' +
      '<span class="nm">' + m.name + '</span>' +
      (items.length ? '<span class="cnt">' + items.length + ' 项</span>' : '<span class="hint">' + m.hint + '</span>') +
      '</div><div class="r"><span class="kc">' + Math.round(kcal) + '</span><span class="kcu">kcal</span>' +
      '<span class="addbtn" data-act="addmeal" data-meal="' + m.key + '">＋</span></div></div>' +
      (rows ? '<div class="items">' + rows + '</div>' : '') + '</div>';
  }).join('');

  return '<div class="wrap">' +
    '<div class="datebar">' +
    '<div class="nav" data-act="prevday">‹</div>' +
    '<div class="mid" data-act="tab" data-v="report">' +
    '<div class="dblock"><span class="dnum">' + (parseInt(d.slice(8, 10), 10) || '') + '</span>' +
    '<span class="dside"><b>' + ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'][(parseInt(d.slice(5, 7), 10) || 1) - 1] + '</b>' +
    '<i>' + ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'][new Date(d + 'T00:00:00').getDay()] + '</i></span></div>' +
    '<div class="d2">' + dayLabel(d) + ' · ' + d + '</div></div>' +
    (d === todayStr() ? '<div class="nav off">›</div>' : '<div class="nav" data-act="nextday">›</div>') +
    '</div>' +

    '<div class="card">' +
    '<div class="herohead"><span class="pill" data-act="toggleTrainDay">' +
    t.goalName + ' · ' + (t.trainDay ? '训练日' : '休息日') + ' ' + t.kcal + ' kcal ↺</span>' +
    '<span class="link" data-act="tab" data-v="profile">调整目标</span></div>' +
    '<div class="ringbox"><svg viewBox="0 0 100 100">' +
    '<defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">' +
    '<stop offset="0" stop-color="' + ringFrom + '"/>' +
    '<stop offset="1" stop-color="' + ringTo + '"/></linearGradient></defs>' +

function sheetGrams() {
  const f = S.pickFood;
  if (!f) return '';
  const g = Number(S.grams) || 0;
  const p = calcFood(f, g);
  const q = [];
  const push = function (label, grams) {
    const gg = Math.round(grams);
    if (gg > 0 && !q.some(function (x) { return x.g === gg; })) q.push({ l: label, g: gg });
  };
  if (f.serving && f.serving.grams) {
    const s = f.serving.grams, u = f.serving.unit;
    push('0.5' + u, s * 0.5); push('1' + u, s); push('1.5' + u, s * 1.5); push('2' + u, s * 2);
  }
  push('100g', 100); push('150g', 150); push('200g', 200);

  return '<div class="mask" data-act="closesheet"></div>' +
    '<div class="sheet"><h3><span>' + esc(f.name) + '</span><span class="x" data-act="closesheet">×</span></h3>' +
    '<div class="per100">每 100g：' + f.kcal + ' kcal · 蛋白 ' + f.protein + 'g · 碳水 ' + f.carb + 'g · 脂肪 ' + f.fat + 'g</div>' +
    '<div class="gramrow"><div class="step" data-act="gstep" data-d="-1">−</div>' +
    '<input class="ginput" id="grams" type="number" inputmode="decimal" value="' + S.grams + '">' +
    '<div class="step" data-act="gstep" data-d="1">＋</div></div>' +
    '<div class="quicks">' + q.map(function (x) {
      return '<div class="quick" data-act="qg" data-g="' + x.g + '">' + x.l + '</div>';
    }).join('') + '</div>' +
    '<div class="preview"><div class="big">' + p.kcal + '<small>kcal</small></div>' +
    '<div class="det"><span>蛋白 ' + p.protein + 'g</span><span>碳水 ' + p.carb + 'g</span>' +
    '<span>脂肪 ' + p.fat + 'g</span><span>纤维 ' + p.fiber + 'g</span></div></div>' +
    '<div class="btn" data-act="confirm">加入' + (MEALS.filter(function (m) { return m.key === S.meal; })[0] || {}).name + '</div>' +
    '</div>';
}

/* ================= 报告 ================= */
function viewReport() {
  const t = targets(store.data.profile, { trainDay: isTrainDay(S.date) });
  const range = S.range;
  const dates = lastNDates(range);
  const rows = dates.map(function (d) {
    const s = sumRecords(getLogs(d));
    return {
      date: d, kcal: s.kcal, protein: s.protein, carb: s.carb, fat: s.fat, fiber: s.fiber,
      count: getLogs(d).length,
      label: range === 7 ? weekLabel(d) : shortDate(d)
    };
  });

  let maxK = t.kcal;
  rows.forEach(function (r) { if (r.kcal > maxK) maxK = r.kcal; });
  maxK = Math.max(maxK, 1);

  const cols = rows.map(function (r, i) {
    const h = Math.round((r.kcal / maxK) * 100);
    const cls = r.kcal === 0 ? 'zero' : (r.kcal > t.kcal * 1.1 ? 'over' : '');
    const show = range === 7 || i % 5 === 4 || i === rows.length - 1;
    return '<div class="col"><div class="b ' + cls + '" style="height:' + (r.kcal > 0 ? Math.max(2, h) : 2) + '%"></div></div>';
  }).join('');
  const labels = rows.map(function (r, i) {
    const show = range === 7 || i % 5 === 4 || i === rows.length - 1;
    return '<span>' + (show ? r.label : '') + '</span>';
  }).join('');

  const logged = rows.filter(function (r) { return r.count > 0; });
  const n = logged.length || 1;
  const tot = logged.reduce(function (a, r) {
    a.kcal += r.kcal; a.protein += r.protein; a.carb += r.carb; a.fat += r.fat; a.fiber += r.fiber; return a;
  }, { kcal: 0, protein: 0, carb: 0, fat: 0, fiber: 0 });
  const avg = {
    kcal: Math.round(tot.kcal / n), protein: Math.round(tot.protein / n * 10) / 10,
    carb: Math.round(tot.carb / n * 10) / 10, fat: Math.round(tot.fat / n * 10) / 10,
    fiber: Math.round(tot.fiber / n * 10) / 10
  };
  const onTarget = logged.filter(function (r) { return Math.abs(r.kcal - t.kcal) <= t.kcal * 0.1; }).length;
  const proteinOK = logged.filter(function (r) { return r.protein >= t.protein * 0.9; }).length;

  const pk = avg.protein * 4, ck = avg.carb * 4, fk = avg.fat * 9;
  const sumK = (pk + ck + fk) || 1;
  const ratio = [
    { n: '蛋白质', p: Math.round(pk / sumK * 100), c: 'var(--blue)', t: t.proteinKcalPct },
    { n: '碳水', p: Math.round(ck / sumK * 100), c: 'var(--amber)', t: t.carbKcalPct },
    { n: '脂肪', p: Math.round(fk / sumK * 100), c: 'var(--purple)', t: t.fatKcalPct }
  ];

  const ws = store.data.weights;
  let w = null, delta = 0;
  if (ws.length) {
    w = ws[ws.length - 1];
    if (ws.length > 1) delta = Math.round((w.weight - ws[0].weight) * 10) / 10;
  }

  // 餐次热量分布
  const mealKcal = { breakfast: 0, lunch: 0, dinner: 0, snack: 0 };
  logged.forEach(function (r) {
    (store.data.logs[r.date] || []).forEach(function (x) {
      if (mealKcal[x.meal] === undefined) mealKcal[x.meal] = 0;
      mealKcal[x.meal] += (x.kcal || 0);
    });
  });
  const mealSum = Object.keys(mealKcal).reduce(function (s, k) { return s + mealKcal[k]; }, 0) || 1;
  const mealMix = [
    { k: 'breakfast', n: '早餐', c: '#f59e0b' },
    { k: 'lunch', n: '午餐', c: '#12a05b' },
    { k: 'dinner', n: '晚餐', c: '#3b82f6' },
    { k: 'snack', n: '加餐', c: '#a855f7' }
  ].map(function (m) {
    return { n: m.n, c: m.c, pct: Math.round(mealKcal[m.k] / mealSum * 100), kcal: Math.round(mealKcal[m.k]) };
  });

  // 常吃食物 Top5
  const foodCount = {};
  Object.keys(store.data.logs).forEach(function (dt) {
    (store.data.logs[dt] || []).forEach(function (x) {
      if (!foodCount[x.name]) foodCount[x.name] = { c: 0, kcal: 0 };
      foodCount[x.name].c += 1;
      foodCount[x.name].kcal += (x.kcal || 0);
    });
  });
  const topFoods = Object.keys(foodCount)
    .map(function (n) { return { n: n, c: foodCount[n].c, kcal: Math.round(foodCount[n].kcal) }; })
    .sort(function (a, b) { return b.c - a.c; })
    .slice(0, 5);

  // 连续记录天数
  let streakDays = 0;
  let curD = todayStr();
  while ((store.data.logs[curD] || []).length) {
    streakDays += 1;
    curD = addDays(curD, -1);
    if (streakDays > 999) break;
  }

  // 本周 vs 上周日均
  const wkStart = weekKey(todayStr());
  let thisSum = 0, thisN = 0, lastSum = 0, lastN = 0;
  Object.keys(store.data.logs).forEach(function (dt) {
    const s2 = N_sumDay(store.data.logs[dt]);
    if (weekKey(dt) === wkStart) { thisSum += s2; thisN += 1; }
    else if (weekKey(dt) === weekKey(addDays(wkStart, -7))) { lastSum += s2; lastN += 1; }
  });
  const thisAvg = thisN ? Math.round(thisSum / thisN) : 0;
  const lastAvg = lastN ? Math.round(lastSum / lastN) : 0;
  const avgDelta = thisAvg && lastAvg ? thisAvg - lastAvg : 0;

  const extraCards =
    '<div class="card"><div class="row between" style="margin-bottom:4px">' +
    '<b style="font-size:15px">餐次热量分布</b><span class="xs mute">近 ' + range + ' 天</span></div>' +
    '<div class="mixbar">' + mealMix.map(function (m) {
      return '<i style="width:' + m.pct + '%;background:' + m.c + '"></i>';
    }).join('') + '</div>' +
    '<div class="mixlg">' + mealMix.map(function (m) {
      return '<span><b>' + m.n + ' ' + m.pct + '%</b> ' + m.kcal + 'kcal</span>';
    }).join('') + '</div></div>' +

    (topFoods.length
      ? '<div class="card"><div class="row between" style="margin-bottom:4px">' +
        '<b style="font-size:15px">最常吃</b><span class="xs mute">全部记录累计</span></div>' +
        topFoods.map(function (f, i) {
          return '<div class="topfood"><span class="rk">' + (i + 1) + '</span>' +
            '<span class="nm">' + esc(f.n) + '</span>' +
            '<span class="ct">' + f.c + ' 次</span></div>';
        }).join('') + '</div>'
      : '') +

    '<div class="card"><div class="row between">' +
    '<b style="font-size:15px">坚持情况</b>' +
    '<span class="xs mute">本周 vs 上周</span></div>' +
    '<div class="streak" style="margin-top:8px"><b>' + streakDays + '</b>' +
    '<span class="sm mute">天连续记录</span></div>' +
    '<div class="row between" style="margin-top:10px;font-size:12px;color:var(--mute)">' +
    '<span>本周日均 <b style="color:var(--ink)">' + thisAvg + '</b> kcal</span>' +
    '<span>上周日均 <b style="color:var(--ink)">' + lastAvg + '</b> kcal</span>' +
    (avgDelta ? '<span style="color:' + (avgDelta > 0 ? 'var(--red)' : 'var(--green)') + '">' +
      (avgDelta > 0 ? '+' : '') + avgDelta + '</span>' : '') +
    '</div></div>';

  const tips = [];
  if (!logged.length) {
    tips.push('还没有记录，先去「今日」添加一餐吧');
  } else {
    if (avg.kcal > t.kcal * 1.1) tips.push('日均热量超出目标 ' + (avg.kcal - t.kcal) + ' kcal，注意烹饪油与加餐分量');
    else if (avg.kcal < t.kcal * 0.8) tips.push('日均热量偏低，长期过低会掉肌肉、拖慢代谢，建议补足到 ' + t.kcal + ' kcal');
    if (avg.protein < t.protein * 0.8) tips.push('蛋白质日均 ' + avg.protein + 'g，低于目标 ' + t.protein + 'g，可增加鸡胸、蛋、奶、豆制品');
    if (avg.fiber < t.fiber * 0.7) tips.push('膳食纤维不足，多吃蔬菜、全谷物与水果');
    if (avg.fat > t.fat * 1.3) tips.push('脂肪偏高，减少油炸食品与坚果过量摄入');
    if (!tips.length) tips.push('各项指标都在目标区间内，保持这个节奏');
  }

  return '<div class="wrap">' +
    '<div class="card"><div class="row between">' +
    '<b style="font-size:15px">热量趋势</b>' +
    '<div class="seg">' + [7, 30].map(function (r) {
      return '<div class="s ' + (range === r ? 'on' : '') + '" data-act="range" data-r="' + r + '">近' + r + '天</div>';
    }).join('') + '</div></div>' +
    '<div class="chart"><div class="tline" style="bottom:' + Math.min(100, Math.round(t.kcal / maxK * 100)) + '%"><b>目标 ' + t.kcal + '</b></div>' + cols + '</div>' +
    '<div class="xlabels">' + labels + '</div>' +
    '<div class="legend sm mute"><span><i style="background:var(--green)"></i>达标</span>' +
    '<span><i style="background:#f87171"></i>超出10%</span><span><i style="background:#e5e9ee"></i>未记录</span></div></div>' +

    '<div class="card"><div class="row between" style="margin-bottom:6px">' +
    '<b style="font-size:15px">记录日均</b><span class="sm mute">' + logged.length + ' 天有记录</span></div>' +
    '<div class="card"><div class="row between" style="margin-bottom:2px">' +
    '<b style="font-size:15px">营养达成</b><span class="xs mute">日均 / 目标</span></div>' +
    radarSVG([
      { label: '热量', pct: (t.kcal ? avg.kcal / t.kcal : 0) * 100 },
      { label: '蛋白', pct: (t.protein ? avg.protein / t.protein : 0) * 100 },
      { label: '碳水', pct: (t.carb ? avg.carb / t.carb : 0) * 100 },
      { label: '脂肪', pct: (t.fat ? avg.fat / t.fat : 0) * 100 },
      { label: '纤维', pct: (t.fiber ? (avg.fiber || 0) / t.fiber : 0) * 100 }
    ]) + '</div>' +

    '<div class="statgrid">' +
    [['热量', avg.kcal, 'kcal', t.kcal], ['蛋白质', avg.protein, 'g', t.protein],
     ['碳水', avg.carb, 'g', t.carb], ['脂肪', avg.fat, 'g', t.fat]].map(function (c) {
      const wp = c[3] > 0 ? Math.min(100, Math.round(c[1] / c[3] * 100)) : 0;
      return '<div class="statcell">' +
        '<span class="sk">' + c[0] + '</span>' +
        '<span class="sv">' + c[1] + '<i>' + c[2] + '</i></span>' +
        '<span class="st">目标 ' + c[3] + ' · ' + wp + '%</span>' +
        '<i class="sbar"><i style="width:' + wp + '%"></i></i></div>';
    }).join('') + '</div></div>' +

    '<div class="card"><b style="font-size:15px">达成情况</b>' +
    '<div class="three" style="margin-top:10px">' +
    '<div class="a"><b>' + logged.length + '</b><span>记录天数</span></div>' +
    '<div class="a"><b class="green">' + onTarget + '</b><span>热量达标</span></div>' +
    '<div class="a"><b class="green">' + proteinOK + '</b><span>蛋白达标</span></div></div>' +
    '<div class="xs mute" style="margin-top:10px;line-height:1.6">热量达标 = 摄入在目标 ±10% 内；蛋白达标 = 达到目标 90% 以上</div></div>' +

    '<div class="card"><div class="row between" style="margin-bottom:10px">' +
    '<b style="font-size:15px">供能比</b><span class="xs mute">建议 蛋白' + t.proteinKcalPct + '% 碳水' + t.carbKcalPct + '% 脂肪' + t.fatKcalPct + '%</span></div>' +
    ratio.map(function (r) {
      return '<div class="ratiobar"><div class="h"><span>' + r.n + '</span><span class="ratio-pct">' + r.p + '%</span></div>' +
        '<div class="bar"><i style="width:' + r.p + '%;background:' + r.c + '"></i></div></div>';
    }).join('') + '</div>' +

    (w ? '<div class="card"><div class="row between"><b style="font-size:15px">体重</b>' +
      '<span class="sm mute">目标 ' + store.data.profile.targetWeight + ' kg</span></div>' +
      '<div class="wline" style="margin-top:10px"><div class="wv">' + w.weight + '<small>kg</small></div>' +
      '<div class="wchg ' + (delta < 0 ? 'down' : (delta > 0 ? 'up' : '')) + '">' +
      (delta > 0 ? '↑ ' + delta : (delta < 0 ? '↓ ' + (-delta) : '— 0')) + ' kg</div></div>' +
      '<div class="xs mute" style="margin-top:8px">最近记录 ' + w.date + '，变化为区间首尾差</div></div>' : '') +

    extraCards +
    '<div class="card"><b style="font-size:15px">建议</b><div style="margin-top:10px">' +
    tips.map(function (x) { return '<div class="adv"><i>•</i><p>' + esc(x) + '</p></div>'; }).join('') +
    '</div></div>' +
    '<div class="xs mute" style="text-align:center;padding:8px 0 20px">BMR ' + t.bmr + ' · TDEE ' + t.tdee + ' · 目标 ' + t.kcal + ' kcal</div>' +
    '</div>';
}
